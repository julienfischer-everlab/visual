<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Image generator</title>
<link rel="icon" href="data:,">
<style>
  /* Layout: one-screen designer tool. Live halftone preview fills the left; a scrolling inspector sits on the right with a fixed export footer. Below 900px the inspector stacks under the preview. Deliberately dark-only (requested). */
  :root {
    --ground: #0e0f10;
    --stage: #121314;
    --panel: #18191b;
    --raised: #212226;
    --hover: #2a2b30;
    --line: #2a2c31;
    --line-strong: #3a3d44;
    --text: #e8e9eb;
    --label: #a9adb4;
    --muted: #80858d;
    --faint: #5c6068;
    --accent: #3d9be4;
    --accent-soft: rgba(61, 155, 228, 0.16);
    --primary: #ecedef;
    --primary-ink: #111214;
    --warn: #f0b45a;
    --check-a: #1c1d20;
    --check-b: #26272b;
    --veil: rgba(10, 11, 12, 0.78);
    --shadow: rgba(0, 0, 0, 0.5);
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--ground); }
  body { margin: 0; background: var(--ground); color: var(--text); font: 12.5px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  [hidden] { display: none !important; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }

  .app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 344px; overflow: hidden; }

  /* ---------- stage ---------- */
  .stage { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--stage); }
  .tb { display: flex; align-items: center; gap: 12px; padding: 9px 16px; border-bottom: 1px solid var(--line); min-width: 0; }
  .file { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1 1 auto; }
  .fname { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .dims { font: 11px/1 var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .view { position: relative; min-height: 0; min-width: 0; display: grid; place-items: center; padding: 22px; overflow: hidden;
    background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.045) 1px, transparent 1.3px); background-size: 16px 16px; }
  .frame { position: relative; box-shadow: 0 0 0 1px var(--line), 0 20px 50px var(--shadow); touch-action: none; }
  .frame.checker { background-color: var(--check-a); background-image: linear-gradient(45deg, var(--check-b) 25%, transparent 25%, transparent 75%, var(--check-b) 75%), linear-gradient(45deg, var(--check-b) 25%, transparent 25%, transparent 75%, var(--check-b) 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; }
  .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .frame[data-view="after"] #before { visibility: hidden; }
  .frame[data-view="before"] #result { visibility: hidden; }
  .frame[data-view="split"] { cursor: ew-resize; }
  .split { position: absolute; top: 0; bottom: 0; width: 0; left: 50%; display: none; }
  .frame[data-view="split"] .split { display: block; }
  .split::before { content: ""; position: absolute; top: 0; bottom: 0; left: -0.5px; width: 1px; background: var(--primary); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35); }
  .split .knob { position: absolute; top: 50%; left: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--primary); color: var(--primary-ink); display: grid; place-items: center; box-shadow: 0 2px 10px var(--shadow); }
  .split .knob svg { width: 14px; height: 14px; }
  .split:focus-visible { outline: none; }
  .split:focus-visible .knob { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tag { position: absolute; top: 10px; font: 10px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 7px; border-radius: 4px; background: var(--veil); color: var(--text); display: none; pointer-events: none; }
  .tag-l { left: 10px; } .tag-r { right: 10px; }
  .frame[data-view="split"] .tag { display: block; }

  .empty { position: absolute; inset: 22px; display: grid; place-items: center; text-align: center; border: 1px dashed var(--line-strong); border-radius: 12px; padding: 24px; }
  .empty-in { display: grid; gap: 10px; justify-items: center; max-width: 34ch; }
  .empty h2 { margin: 0; font-size: 16px; font-weight: 550; }
  .empty p { margin: 0; color: var(--muted); }
  .empty .glyph { width: 56px; height: 56px; color: var(--label); }
  .drop { position: absolute; inset: 10px; border: 1.5px dashed var(--accent); border-radius: 12px; background: var(--veil); display: grid; place-items: center; font-size: 15px; font-weight: 550; z-index: 5; pointer-events: none; }
  .busy { position: absolute; top: 14px; right: 16px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; background: var(--veil); font-size: 11.5px; color: var(--label); z-index: 4; }
  .spin { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--line-strong); border-top-color: var(--text); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sb { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 7px 16px; border-top: 1px solid var(--line); font: 11px/1.3 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; }
  .sb span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .sb kbd { font: inherit; border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 4px; color: var(--label); }
  .toast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: min(520px, calc(100% - 32px)); padding: 9px 14px; border-radius: 8px; background: var(--raised); border: 1px solid var(--line-strong); box-shadow: 0 10px 30px var(--shadow); font-size: 12.5px; z-index: 6; }

  /* ---------- buttons & segmented ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; white-space: nowrap; font-size: 12px; }
  .btn:hover { background: var(--hover); border-color: var(--line-strong); }
  .btn svg { width: 14px; height: 14px; flex: none; }
  .btn.icon { width: 28px; padding: 0; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--label); }
  .btn.ghost:hover { background: var(--raised); color: var(--text); }
  .btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); font-weight: 600; height: 34px; }
  .btn.primary:hover { background: #ffffff; }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 7px; background: var(--ground); border: 1px solid var(--line); }
  .seg label { position: relative; display: block; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg span { display: flex; align-items: center; justify-content: center; gap: 5px; height: 22px; min-width: 30px; padding: 0 9px; border-radius: 5px; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .seg span svg { width: 12px; height: 12px; }
  .seg label:hover span { color: var(--text); }
  .seg input:checked + span { background: var(--raised); color: var(--text); box-shadow: 0 0 0 1px var(--line-strong); }
  .seg input:focus-visible + span { outline: 1.5px solid var(--accent); outline-offset: 1px; }
  .seg.full { display: flex; width: 100%; }
  .seg.full label { flex: 1 1 0; }
  .seg.full span { padding: 0 4px; }

  /* ---------- panel ---------- */
  .panel { min-height: 0; min-width: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; border-left: 1px solid var(--line); background: var(--panel); }
  .ph { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line); }
  .ttl { display: grid; line-height: 1.2; min-width: 0; }
  .ttl strong { font-size: 13px; font-weight: 600; }
  .ttl span { font-size: 11px; color: var(--muted); }
  .ph { grid-row: 1; } .savebar { grid-row: 2; } .scroll { grid-row: 3; } .exp { grid-row: 4; }
  .acts { display: flex; gap: 4px; }
  .savebar { display: flex; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--raised); }
  .savebar input { flex: 1 1 auto; min-width: 0; }
  .scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }

  details.grp { border-bottom: 1px solid var(--line); }
  details.grp > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; cursor: pointer; user-select: none; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--label); }
  details.grp > summary::-webkit-details-marker { display: none; }
  details.grp > summary:hover { color: var(--text); }
  details.grp > summary .chev { width: 12px; height: 12px; transition: transform 0.15s; color: var(--faint); }
  details.grp[open] > summary .chev { transform: rotate(90deg); }
  details.grp > summary .sum-note { margin-left: auto; font: 10.5px var(--mono); letter-spacing: 0; text-transform: none; color: var(--muted); font-weight: 400; }
  .gb { display: grid; gap: 4px; padding: 0 16px 14px; }

  .row { display: grid; grid-template-columns: 128px minmax(0, 1fr) 40px; align-items: center; gap: 10px; min-height: 28px; }
  .row > label { color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; display: flex; align-items: center; gap: 7px; }
  .row > label svg { width: 11px; height: 11px; flex: none; color: var(--muted); }
  .row output { font: 11px/1 var(--mono); text-align: right; color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row.off > label, .row.off output { color: var(--faint); }
  .hint { color: var(--muted); font-size: 11px; line-height: 1.4; margin: -2px 0 4px; }
  .hint.mono { font-family: var(--mono); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .sub { font-size: 10.5px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin: 8px 0 2px; }

  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; margin: 0; background: transparent; cursor: pointer; --p: 50%; }
  input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--accent) 0 var(--p), var(--line-strong) var(--p) 100%); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4.5px; border-radius: 50%; border: 0; background: var(--text); box-shadow: 0 0 0 3px var(--panel); }
  input[type="range"]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line-strong); }
  input[type="range"]::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--accent); }
  input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; border: 0; background: var(--text); box-shadow: 0 0 0 3px var(--panel); }
  input[type="range"]:focus-visible { outline: none; }
  input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--accent); }
  input[type="range"]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--accent); }
  input[type="range"]:disabled { cursor: default; }
  input[type="range"]:disabled::-webkit-slider-runnable-track { background: var(--line); }
  input[type="range"]:disabled::-webkit-slider-thumb { background: var(--faint); }
  input[type="range"]:disabled::-moz-range-progress { background: var(--line); }

  .field, select { height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--ground); padding: 0 8px; color: var(--text); min-width: 0; }
  .field:hover, select:hover { border-color: var(--line-strong); }
  .field:focus-visible, select:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .field.mono { font: 11.5px var(--mono); font-variant-numeric: tabular-nums; }
  select { width: 100%; cursor: pointer; }
  .row.wide { grid-template-columns: 128px minmax(0, 1fr); }
  .seedbox { display: flex; gap: 6px; min-width: 0; }
  .seedbox .field { flex: 1 1 auto; width: 100%; -moz-appearance: textfield; appearance: textfield; }
  .seedbox .field::-webkit-outer-spin-button, .seedbox .field::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; color: var(--label); cursor: pointer; }
  .sw input { -webkit-appearance: none; appearance: none; flex: none; width: 28px; height: 16px; margin: 0; border-radius: 9px; background: var(--line-strong); position: relative; cursor: pointer; transition: background 0.15s; }
  .sw input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--text); transition: transform 0.15s; }
  .sw input:checked { background: var(--accent); }
  .sw input:checked::after { transform: translateX(12px); }

  .cpick { display: flex; gap: 6px; min-width: 0; grid-column: 2 / -1; }
  .cpick input[type="color"] { -webkit-appearance: none; appearance: none; flex: none; width: 28px; height: 28px; padding: 0; border: 1px solid var(--line-strong); border-radius: 6px; background: none; cursor: pointer; }
  .cpick input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
  .cpick input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 4px; }
  .cpick input[type="color"]::-moz-color-swatch { border: 0; border-radius: 4px; }
  .cpick .field { flex: 1 1 auto; width: 100%; text-transform: uppercase; }
  .row.crow { grid-template-columns: 128px minmax(0, 1fr); }
  .swatches { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 6px 138px; }
  .swatches button { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.14); padding: 0; cursor: pointer; }
  .swatches button:hover { transform: scale(1.15); }

  .mixbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line); margin: 6px 0 4px; gap: 1px; }
  .mixbar i { display: block; height: 100%; transition: flex-grow 0.15s; }

  .presets { display: grid; gap: 8px; }
  .looks { padding: 10px 16px 14px; border-bottom: 1px solid var(--line); }
  .looks .sub { margin: 0 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 11.5px; color: var(--label); }
  .chip:hover { border-color: var(--line-strong); color: var(--text); background: var(--raised); }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
  .plist { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
  .plist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 3px 4px 3px 8px; border-radius: 6px; }
  .plist li:hover { background: var(--raised); }
  .plist .pn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plist .pa { display: flex; gap: 2px; }
  .plist .btn { height: 24px; padding: 0 7px; font-size: 11px; }
  .pempty { color: var(--muted); font-size: 11.5px; }

  .exp { border-top: 1px solid var(--line); padding: 12px 16px 14px; display: grid; gap: 8px; background: var(--panel); }
  .exp-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .exp-h strong { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--label); }
  .exp-h span { font: 10.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .exp-r { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .exp .sw { min-height: 24px; }
  .exp .note { font-size: 11px; color: var(--warn); }

  /* ---------- export sheet ---------- */
  dialog.sheet { width: min(760px, calc(100vw - 32px)); max-height: calc(100% - 32px); padding: 0; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--panel); color: var(--text); box-shadow: 0 30px 80px var(--shadow); }
  dialog.sheet::backdrop { background: rgba(5, 6, 7, 0.66); }
  .sh-in { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-height: calc(100vh - 34px); }
  .sh-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sh-h h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .sh-h p { margin: 3px 0 0; color: var(--muted); font-size: 12px; max-width: 60ch; }
  .sh-b { overflow: auto; padding: 16px; display: grid; gap: 12px; min-height: 0; }
  .sh-prev { display: grid; place-items: center; background-color: var(--check-a); background-image: linear-gradient(45deg, var(--check-b) 25%, transparent 25%, transparent 75%, var(--check-b) 75%), linear-gradient(45deg, var(--check-b) 25%, transparent 25%, transparent 75%, var(--check-b) 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; border-radius: 8px; padding: 12px; min-height: 120px; }
  .sh-prev img { display: block; max-width: 100%; max-height: 46vh; width: auto; height: auto; object-fit: contain; }
  .sh-meta { font: 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .sh-b textarea { width: 100%; min-height: 150px; resize: vertical; border-radius: 8px; border: 1px solid var(--line); background: var(--ground); color: var(--label); font: 11px/1.45 var(--mono); padding: 10px; }
  .sh-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }

  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(260px, 54%) minmax(0, 1fr); }
    .panel { display: block; overflow-y: auto; border-left: 0; border-top: 1px solid var(--line); }
    .scroll { overflow: visible; }
    .view { padding: 16px; }
    .tb { padding: 8px 16px; gap: 8px; }
    .tb .up-label { display: none; }
    .sb .hint-k, .sb .eng { display: none; }
  }
  @media (max-width: 480px) {
    .dims { display: none; }
    .row { grid-template-columns: 116px minmax(0, 1fr) 38px; gap: 8px; }
    .row.wide, .row.crow { grid-template-columns: 116px minmax(0, 1fr); }
    .swatches { margin-left: 124px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <main class="stage" aria-label="Preview">
    <header class="tb">
      <div class="file"><span class="fname" id="fname">Loading sample…</span><span class="dims" id="dims"></span></div>
      <div class="seg" role="radiogroup" aria-label="Preview mode" id="viewSeg">
        <label><input type="radio" name="view" value="before" id="v-before"><span>Before</span></label>
        <label><input type="radio" name="view" value="split" id="v-split"><span>Split</span></label>
        <label><input type="radio" name="view" value="after" id="v-after" checked><span>After</span></label>
      </div>
      <button class="btn" id="uploadBtn" type="button" title="Upload a JPEG, PNG or WebP">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10.5V2.5M4.8 5.6 8 2.4l3.2 3.2M2.5 10v2.2c0 .7.6 1.3 1.3 1.3h8.4c.7 0 1.3-.6 1.3-1.3V10"/></svg>
        <span class="up-label">Upload image</span>
      </button>
      <input type="file" id="fileIn" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" hidden>
    </header>
    <div class="view" id="view">
      <div class="frame" id="frame" data-view="after" hidden>
        <canvas id="result" aria-label="Halftone result" role="img"></canvas>
        <canvas id="before" aria-label="Source image" role="img"></canvas>
        <div class="split" id="split" role="slider" tabindex="0" aria-label="Before and after split" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
          <span class="knob"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4 2 8l4 4M10 4l4 4-4 4"/></svg></span>
        </div>
        <span class="tag tag-l">Before</span><span class="tag tag-r">After</span>
      </div>
      <div class="empty" id="empty" hidden>
        <div class="empty-in">

  async function loadFile(file) {
    if (!file) return;
    if (file.type === 'application/json' || /\.json$/i.test(file.name)) { importPresetFile(file); return; }
    if (!OK_TYPES.test(file.type) && !/\.(jpe?g|png|webp)$/i.test(file.name)) {
      toast(`“${file.name}” isn't a JPEG, PNG or WebP image. Choose one of those to halftone.`);
      return;
    }
    setBusy('Reading image…');
    try {
      let src;
      try { src = await createImageBitmap(file); } catch (e) { const u = URL.createObjectURL(file); try { src = await loadElement(u); } finally { setTimeout(() => URL.revokeObjectURL(u), 1000); } }
      await setImage(src, file.name);
    } catch (err) {
      toast(`Couldn't read “${file.name}”. The file may be damaged; try saving it again as JPEG or PNG.`);
    } finally { setBusy(null); }
  }

  /* ---------- layout & preview ---------- */
  let fit = { w: 0, h: 0 }, dprUsed = 1;
  function layout(force) {
    if (!img) return;
    const view = $('#view'), cs = getComputedStyle(view);
    const aw = view.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const ah = view.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    if (aw <= 0 || ah <= 0) return;
    const ar = img.w / img.h;
    let w = aw, h = aw / ar;
    if (h > ah) { h = ah; w = ah * ar; }
    w = Math.floor(w); h = Math.floor(h);
    let dpr = Math.min(2, window.devicePixelRatio || 1);
    if (Math.max(w, h) * dpr > 3000) dpr = 3000 / Math.max(w, h);
    if (!force && w === fit.w && h === fit.h && dpr === dprUsed) return;
    fit = { w, h }; dprUsed = dpr;
    const frame = $('#frame'); frame.style.width = w + 'px'; frame.style.height = h + 'px';
    const bw = Math.max(1, Math.round(w * dpr)), bh = Math.max(1, Math.round(h * dpr));
    engine.post({ type: 'resize', w: bw, h: bh });
    const b = $('#before'); b.width = bw; b.height = bh;
    const x = b.getContext('2d'); x.imageSmoothingQuality = 'high'; x.clearRect(0, 0, bw, bh); x.drawImage(img.base, 0, 0, bw, bh);
  }

  let busy = false, dirty = false, raf = 0, renderSeq = 0, sentAt = 0, lastStats = null, renders = 0;
  const renderWaiters = [];
  function requestRender() { dirty = true; if (!raf) raf = requestAnimationFrame(pump); }
  function pump() {
    raf = 0;
    if (!dirty || busy || !engineReady || !img) return;
    dirty = false; busy = true; sentAt = performance.now();
    engine.post({ type: 'render', id: ++renderSeq, settings: Object.assign({}, S) });
  }
  function onRendered(m) {
    busy = false; renders++;
    const st = m.stats;
    if (st) {
      st.latency = performance.now() - sentAt;
      lastStats = st;
      $('#statL').textContent = `Grid ${st.cols} × ${st.rows} · ${fmtInt(st.marks)} marks`;
      $('#statMs').innerHTML = `${Math.max(1, Math.round(st.latency))} ms${engineMode === 'worker' ? '<span class="eng"> · off main thread</span>' : ''}<span class="hint-k"> · </span>`;
      updateExportInfo();
    }
    if (dirty) { if (!raf) raf = requestAnimationFrame(pump); }
    else while (renderWaiters.length) renderWaiters.shift()(st);
  }
  function whenRendered() { return new Promise(r => { if (!dirty && !busy) r(lastStats); else renderWaiters.push(r); }); }
  function updateGridHint() {
    const h = $('#gridHint'); if (!h) return;
    if (!img) { h.textContent = ''; return; }
    const NW = img.w >= img.h ? 1000 : 1000 * img.w / img.h, NH = img.h > img.w ? 1000 : 1000 * img.h / img.w;
    let c = Math.max(8, Math.round(NW / S.spacing)), r = Math.max(8, Math.round(NH / S.spacing));
    h.textContent = `${c} × ${r} cells · ${(Math.max(img.w, img.h) / 1000 * S.spacing).toFixed(1)} px each on the original`;
  }

  /* ---------- view: before / split / after ---------- */
  let view = 'after', splitP = 0.5;
  function setView(v) {
    view = v; $('#frame').dataset.view = v; $('#v-' + v).checked = true;
    applySplit();
  }
  function applySplit() {
    const b = $('#before');
    b.style.clipPath = view === 'split' ? `inset(0 ${((1 - splitP) * 100).toFixed(2)}% 0 0)` : '';
    $('#split').style.left = (splitP * 100) + '%';
    $('#split').setAttribute('aria-valuenow', Math.round(splitP * 100));
  }
  function bindView() {
    $('#viewSeg').addEventListener('change', e => setView(e.target.value));
    const frame = $('#frame');
    let drag = false;
    const move = e => { const r = frame.getBoundingClientRect(); splitP = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); applySplit(); };
    frame.addEventListener('pointerdown', e => { if (view !== 'split') return; drag = true; frame.setPointerCapture(e.pointerId); move(e); });
    frame.addEventListener('pointermove', e => { if (drag) move(e); });
    frame.addEventListener('pointerup', () => { drag = false; });
    frame.addEventListener('pointercancel', () => { drag = false; });
    $('#split').addEventListener('keydown', e => {
      const step = e.shiftKey ? 0.1 : 0.02;
      if (e.key === 'ArrowLeft') splitP = Math.max(0, splitP - step); else if (e.key === 'ArrowRight') splitP = Math.min(1, splitP + step); else if (e.key === 'Home') splitP = 0; else if (e.key === 'End') splitP = 1; else return;
      e.preventDefault(); applySplit();
    });
    window.addEventListener('keydown', e => {
      if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
      const t = e.target; if (t && (t.tagName === 'INPUT' && !/range|radio|checkbox/.test(t.type) || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
      if (e.key === 'b' || e.key === 'B') { setView(view === 'before' ? 'after' : 'before'); }
    });
  }

  /* ---------- drag & drop, upload, paste ---------- */
  function bindInput() {
    const fileIn = $('#fileIn');
    $('#uploadBtn').addEventListener('click', () => fileIn.click());
    $('#emptyUpload').addEventListener('click', () => fileIn.click());
    fileIn.addEventListener('change', () => { loadFile(fileIn.files[0]); fileIn.value = ''; });
    let depth = 0;
    const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
    window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); depth++; $('#drop').hidden = false; });
    window.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) $('#drop').hidden = true; });
    window.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); depth = 0; $('#drop').hidden = true; loadFile(e.dataTransfer.files[0]); });
    window.addEventListener('paste', e => {
      const items = e.clipboardData ? Array.from(e.clipboardData.items) : [];
      const it = items.find(i => i.kind === 'file' && /^image\//.test(i.type));
      if (it) { const f = it.getAsFile(); if (f) { e.preventDefault(); loadFile(new File([f], f.name && f.name !== 'image.png' ? f.name : 'pasted-image.png', { type: f.type })); } }
    });
  }

  /* ---------- presets ---------- */
  const PKEY = 'ig-presets-v1';
  let presets = store.get(PKEY, []);
  if (!Array.isArray(presets)) presets = [];
  function renderPresets() {
    const ul = $('#plist'); ul.innerHTML = '';
    if (!presets.length) { ul.appendChild(el('li', { class: 'pempty' }, 'Nothing saved yet. Use “Save preset” to keep the current settings.')); return; }
    presets.forEach((p, i) => {
      const li = el('li');
      li.innerHTML = `<span class="pn" title="${esc(p.name)}">${esc(p.name)}</span><span class="pa"><button class="btn ghost" type="button" data-a="apply" data-i="${i}">Apply</button><button class="btn ghost" type="button" data-a="json" data-i="${i}" title="Export as .json">.json</button><button class="btn ghost" type="button" data-a="del" data-i="${i}" aria-label="Delete ${esc(p.name)}">Delete</button></span>`;
      ul.appendChild(li);
    });
  }
  function persist() { if (!store.set(PKEY, presets)) $('#storeNote').hidden = false; }
  function openSave() {
    const bar = $('#saveBar'); bar.hidden = false;
    const inp = $('#presetName'); inp.value = `Preset ${presets.length + 1}`; inp.focus(); inp.select();
  }
  function bindPresets() {
    $('#saveHead').addEventListener('click', openSave);
    $('#saveInline').addEventListener('click', openSave);
    $('#saveCancel').addEventListener('click', () => { $('#saveBar').hidden = true; });
    $('#saveBar').addEventListener('keydown', e => { if (e.key === 'Escape') $('#saveBar').hidden = true; });
    $('#saveBar').addEventListener('submit', e => {
      e.preventDefault();
      const name = $('#presetName').value.trim() || `Preset ${presets.length + 1}`;
      const existing = presets.findIndex(p => p.name === name);
      const entry = { name, settings: Object.assign({}, S), saved: Date.now() };
      if (existing >= 0) presets[existing] = entry; else presets.unshift(entry);
      persist(); renderPresets(); $('#saveBar').hidden = true;
      $('#g-presets').open = true;
      toast(existing >= 0 ? `Updated preset “${name}”` : `Saved preset “${name}”`);
    });
    $('#plist').addEventListener('click', e => {
      const b = e.target.closest('button[data-a]'); if (!b) return;
      const i = +b.dataset.i, p = presets[i]; if (!p) return;
      if (b.dataset.a === 'apply') { applySettings(p.settings); toast(`Applied “${p.name}”`); }
      else if (b.dataset.a === 'del') { presets.splice(i, 1); persist(); renderPresets(); toast(`Deleted “${p.name}”`); }
      else if (b.dataset.a === 'json') exportPreset(p);
    });
    $('#importBtn').addEventListener('click', () => $('#importIn').click());
    $('#importIn').addEventListener('change', () => { importPresetFile($('#importIn').files[0]); $('#importIn').value = ''; });
    renderPresets();
  }
  async function importPresetFile(file) {
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const src = data && data.settings ? data.settings : data;
      if (!src || typeof src !== 'object') throw new Error('shape');
      const name = (data.name && String(data.name).slice(0, 40)) || file.name.replace(/\.json$/i, '');
      const settings = sanitize(src);
      presets.unshift({ name, settings, saved: Date.now() }); persist(); renderPresets();
      applySettings(settings); toast(`Imported and applied “${name}”`);
    } catch (e) { toast(`“${file.name}” isn't a preset file from this tool.`); }
  }
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'preset'; }
  async function exportPreset(p) {
    const text = JSON.stringify({ app: 'image-generator', version: 1, name: p.name, settings: p.settings }, null, 2);
    const filename = slug(p.name) + '.json';
    const r = await saveFile(filename, text);
    if (r === 'fallback') openSheet({ kind: 'text', title: 'Save your preset', lead: 'Saving files directly isn’t available here. Copy the JSON and keep it in a .json file; import it later with “Import .json”.', text, filename, copyLabel: 'Copy JSON' });
  }

  /* ---------- downloads capability ---------- */
  let dlValue, dlPromise;
  function initDownloads() {
    dlPromise = (async () => {
      let host = null;
      try { host = (window.claude && window.claude.use) ? window.claude : (window.parent !== window && window.parent.claude && window.parent.claude.use ? window.parent.claude : null); } catch (e) { host = null; }
      if (!host) return null;
      try { return (await host.use('downloads')) || null; } catch (e) { return null; }
    })();
    dlPromise.then(v => { dlValue = v; }, () => { dlValue = null; });
  }
  async function getDownloads(ms) {
    if (dlValue !== undefined) return dlValue;
    return Promise.race([dlPromise, new Promise(r => setTimeout(() => r(null), ms))]);
  }
  // returns 'saved' | 'declined' | 'too_large' | 'rate_limited' | 'fallback'
  async function saveFile(filename, data) {
    const size = typeof data === 'string' ? new Blob([data]).size : data.size;
    const dl = await getDownloads(1500);
    if (!dl || typeof dl.save !== 'function') return 'fallback';
    if (size > 16 * 1048576) { toast(`${filename} is ${fmtBytes(size)}, over the 16 MB save limit. Showing it here so you can save it by hand; a smaller scale or SVG may fit.`); return 'fallback'; }
    try { await dl.save({ filename, data }); toast(`Saved ${filename}`); return 'saved'; }
    catch (err) {
      const code = err && err.code;
      if (code === 'declined') return 'declined';
      if (code === 'too_large') { toast('That file is over the 16 MB save limit. Try 1x or 2x, or SVG.'); return 'too_large'; }
      if (code === 'rate_limited') { toast('Too many saves in a row. Wait a few seconds, then export again.'); return 'rate_limited'; }
      return 'fallback';
    }
  }

  /* ---------- export ---------- */
  function exportDims() {
    if (!img) return null;
    let W = Math.round(img.w * X.scale), H = Math.round(img.h * X.scale), capped = false;
    if (X.format === 'png') {
      const f = Math.min(1, 16384 / W, 16384 / H, Math.sqrt(100e6 / (W * H)));
      if (f < 1) { W = Math.floor(W * f); H = Math.floor(H * f); capped = true; }
    }
    return { W, H, capped };
  }
  function estimate() {
    const st = lastStats, d = exportDims();
    if (!st || !d) return null;
    if (X.format === 'svg') {
      const nd = String(Math.round(Math.max(img.w, img.h))).length + 4;
      const c = st.counts, sqUnrot = Math.max(0, c[1] - st.rotSquares);
      return 220 + c[0] * (2 * nd + 42) + sqUnrot * (2 * nd + 22) + st.rotSquares * (8 * nd + 4) + c[3] * (8 * nd + 4) + c[2] * (24 * nd + 4);
    }
    // fitted against 108 real exports (portrait, landscape, texture and silhouette; all five looks plus extremes; 1x to 4x):
    // usually within 15%, worst cases about 0.7x to 1.4x. Axis-aligned square edges compress far better than slanted or round ones.
    const edgePx = Math.max(1, (st.perim + 0.3 * st.perimA + 6 * st.marks * st.spreadW) * d.W / st.NW);
    return Math.round(0.5865 * Math.pow(d.W * d.H, 0.082) * Math.pow(edgePx, 1.0638) * (st.duo ? 1.196 : 1));
  }
  function updateExportInfo() {
    const d = exportDims(), info = $('#expInfo'), note = $('#expNote'), btn = $('#exportBtn');
    btn.textContent = exporting ? 'Rendering…' : `Export ${X.format.toUpperCase()}`;
    btn.disabled = exporting || !img;
    if (!d) { info.textContent = '–'; note.hidden = true; return; }
    const est = estimate();
    info.textContent = `${fmtInt(d.W)} × ${fmtInt(d.H)} px${est ? ' · ≈ ' + fmtBytes(est) : ''}`;
    if (d.capped) { note.hidden = false; note.textContent = `${X.scale}x would be ${fmtInt(img.w * X.scale)} × ${fmtInt(img.h * X.scale)} px, past the browser's canvas limit, so the PNG is capped at ${fmtInt(d.W)} × ${fmtInt(d.H)}.`; }
    else if (est && est > 16 * 1048576) { note.hidden = false; note.textContent = 'Likely over the 16 MB save limit. Try a smaller scale or SVG.'; }
    else note.hidden = true;
  }
  let exporting = false;
  async function doExport() {
    if (!img || exporting) return;
    exporting = true; const btn = $('#exportBtn'); btn.disabled = true; updateExportInfo();
    await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
    const base = img.name.replace(/\.[a-z0-9]+$/i, '') || 'image';
    const suffix = X.scale > 1 ? `-${X.scale}x` : '';
    try {
      const res = await request({ type: 'export', format: X.format, scale: X.scale, settings: Object.assign({}, S) });
      if (X.format === 'svg') {
        const filename = `${slug(base)}-halftone${suffix}.svg`;
        const r = await saveFile(filename, res.text);
        if (r === 'fallback') openSheet({ kind: 'svg', title: 'Save your SVG', lead: 'Saving files directly isn’t available here. Copy the SVG markup into a .svg file, or right-click the preview and choose Save image as….', text: res.text, filename, w: res.w, h: res.h, copyLabel: 'Copy SVG' });
      } else {
        const filename = `${slug(base)}-halftone${suffix}${S.transparent ? '-transparent' : ''}.png`;
        const r = await saveFile(filename, res.blob);
        if (r === 'fallback') openSheet({ kind: 'png', title: 'Save your PNG', lead: 'Saving files directly isn’t available here. Right-click the image → Save image as….', blob: res.blob, filename, w: res.w, h: res.h, capped: res.capped });
      }
    } catch (err) {
      toast(`Export failed: ${err.message}. Try a smaller scale.`);
    } finally {
      exporting = false; btn.disabled = false; updateExportInfo();
    }
  }

  /* ---------- fallback sheet ---------- */
  let sheetUrls = [];
  function openSheet(o) {
    const dlg = $('#sheet'), body = $('#sheetBody'), foot = $('#sheetFoot');
    sheetUrls.forEach(u => URL.revokeObjectURL(u)); sheetUrls = [];
    $('#sheetTitle').textContent = o.title; $('#sheetLead').textContent = o.lead;
    body.innerHTML = ''; foot.innerHTML = '';
    if (o.kind === 'png' || o.kind === 'svg') {
      const blob = o.blob || new Blob([o.text], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob); sheetUrls.push(url);
      const prev = el('div', { class: 'sh-prev' });
      const im = el('img', { id: 'sheetImg', alt: `${o.filename}, ${o.w} × ${o.h} pixels`, src: url, 'data-filename': o.filename });
      prev.appendChild(im); body.appendChild(prev);
      body.appendChild(el('div', { class: 'sh-meta', id: 'sheetMeta' }, `${esc(o.filename)} · ${fmtInt(o.w)} × ${fmtInt(o.h)} px · ${fmtBytes(blob.size)}${o.capped ? ' · capped to the browser canvas limit' : ''}`));
    }
    if (o.kind === 'svg' || o.kind === 'text') {
      const ta = el('textarea', { id: 'sheetText', readonly: true, spellcheck: 'false', 'aria-label': o.kind === 'svg' ? 'SVG markup' : 'Preset JSON', rows: o.kind === 'svg' ? 8 : 14 });
      ta.value = o.text; body.appendChild(ta);
      if (o.kind === 'text') body.appendChild(el('div', { class: 'sh-meta' }, `${esc(o.filename)} · ${fmtBytes(new Blob([o.text]).size)}`));
      const copy = el('button', { class: 'btn', type: 'button', id: 'sheetCopy' }, o.copyLabel);
      copy.addEventListener('click', () => {
        const done = () => { copy.textContent = 'Copied'; setTimeout(() => { copy.textContent = o.copyLabel; }, 1600); };
        const fallback = () => { ta.focus(); ta.select(); copy.textContent = 'Selected: press Ctrl/⌘ + C'; };
        try { navigator.clipboard.writeText(o.text).then(done, fallback); } catch (e) { fallback(); }
      });
      foot.appendChild(copy);
    }
    const close = el('button', { class: 'btn primary', type: 'button', style: 'height:28px' }, 'Done');
    close.addEventListener('click', () => dlg.close());
    foot.appendChild(close);
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  }
  function bindSheet() {
    const dlg = $('#sheet');
    $('#sheetX').addEventListener('click', () => dlg.close());
    dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
    dlg.addEventListener('close', () => { setTimeout(() => { sheetUrls.forEach(u => URL.revokeObjectURL(u)); sheetUrls = []; $('#sheetBody').innerHTML = ''; }, 0); });
  }

  /* ---------- wire up ---------- */
  function bindExport() {
    document.querySelectorAll('input[name=fmt]').forEach(r => r.addEventListener('change', () => { X.format = r.value; updateExportInfo(); }));
    document.querySelectorAll('input[name=scale]').forEach(r => r.addEventListener('change', () => { X.scale = +r.value; updateExportInfo(); }));
    $('#x-transparent').addEventListener('change', e => set('transparent', e.target.checked));
    $('#exportBtn').addEventListener('click', doExport);
  }
  function bindHeader() {
    $('#randHead').addEventListener('click', randomiseSeed);
    $('#resetBtn').addEventListener('click', () => { applySettings(Object.assign({}, DEFAULTS)); toast('Settings reset to defaults'); });
  }

  async function boot() {
    buildPanel(); syncAll();
    bindView(); bindInput(); bindPresets(); bindSheet(); bindExport(); bindHeader();
    initDownloads();
    await startEngine();
    new ResizeObserver(() => layout(false)).observe($('#view'));
    window.addEventListener('resize', () => layout(false));
    setBusy('Loading sample…');
    try {
      const sample = await loadElement('visuals/ig-sample.webp');
      if (!img) await setImage(sample, 'ig-sample.webp');
    } catch (e) {
      if (!img) { $('#empty').hidden = false; $('#fname').textContent = 'No image'; $('#dims').textContent = ''; }
    } finally { setBusy(null); }
  }

  // small hook for automated checks
  window.IG = {
    get settings() { return Object.assign({}, S); },
    set(id, v) { set(id, v); syncControl(id); return whenRendered(); },
    apply(o) { applySettings(Object.assign({}, S, o)); return whenRendered(); },
    rendered: whenRendered,
    stats: () => lastStats,
    renders: () => renders,
    engine: () => engineMode,
    hash: () => request({ type: 'hash' }),
    hasImage: () => !!img
  };

  boot();
})();
</script>
</body>
</html>
