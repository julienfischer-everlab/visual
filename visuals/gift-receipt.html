<!doctype html>
<html lang="en" class="inApp">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gift Receipt</title>
<!--
  Everlab · Gift receipt: what the giver sees once they've paid for a gift
  ("create a Gift Receipt page; use the layout of the Member card screen: big
  title, card with properties; use the orange imagery from the member card
  screen").

  The Membership reveal's composition: the big title centred, then the card,
  the actions under it and a quiet line at the foot. Over the top of the
  screen, the Gift page's own photograph (the couple with the album), dimmed,
  in a radial gone by half the screen's height ("use this imagery; radial 50%
  on the top of the screen"); no eyebrow, and the card glass with no edge. Its rows are the gift
  summary the site shows today (Gift, For, Sent to, From, Occasion, Delivery)
  and the message, each an icon and a label at the left, the value at the
  right, as on Booking confirmed; the two buttons side by side under it.

  The story is the Gift page's: Marc's gift, with his message ("Happy
  Birthday. I want you around for a long time."), on its way to Olive.

  Dark first; light with data-theme="light" on the root (the prototype sets it
  from its Mode) or #light. Fonts are named, never loaded where commercial
  (Saans): Geist and Geist Mono from Google Fonts stand in.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap">
<style>
  :root{
    --bg:#0b0908; --ink:#f5f0ea; --ink2:rgba(245,240,234,.62); --ink3:rgba(245,240,234,.42);
    --card:#1c1916; --line:rgba(255,236,214,.09);   /* --card: the secondary ground, solid ("secondary colour bg"; was a glass .07 over the light) */
    --secEdge:rgba(255,236,214,.22); --secHover:rgba(255,236,214,.06); --pri:#fff; --priInk:#151110; --priHover:#ece7e1;
    --acc:#f08a3c;
    --sans:'Saans','Geist','Helvetica Neue',Helvetica,Arial,sans-serif;
    --mono:'Saans Mono','Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#faf7f3; --ink:#1d1a17; --ink2:rgba(29,26,23,.6); --ink3:rgba(29,26,23,.42);
    --card:rgba(0,0,0,.04); --line:rgba(29,26,23,.08);
    --secEdge:rgba(29,26,23,.18); --secHover:rgba(29,26,23,.04); --pri:#1d1a17; --priInk:#fff; --priHover:#36312c;
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{position:relative;margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  svg{display:block;}

  /* ---- the picture: the Gift page's own photograph (the couple with the album, in the wood-toned living room), dimmed as there, in a radial from the top of
     the screen gone by half its height ("use this imagery; radial 50% on the top of the screen"); light: the same, washed into the paper ---- */
  .skyClip{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .sky{position:absolute;left:0;right:0;top:0;height:max(100vh, 640px);pointer-events:none;}
  .sky .img{position:absolute;inset:0;opacity:0;transform:scale(1.04);transition:opacity 1.6s ease, transform 2.4s cubic-bezier(.2,.7,.15,1);
    background:url(../assets/gift/living-room.webp) 50% calc(30% - 128px) / cover no-repeat;filter:brightness(.55) saturate(.9);   /* the photograph 128 px higher, the couple further into the light ("push imagery up by 128px to see people more"); its foot, now short of the box's, is under the mask's clear end */
    -webkit-mask:radial-gradient(110% 50% at 50% 0%, #000 30%, rgba(0,0,0,.55) 62%, transparent 100%);mask:radial-gradient(110% 50% at 50% 0%, #000 30%, rgba(0,0,0,.55) 62%, transparent 100%);}
  @media (min-width:720px){ .sky .img{-webkit-mask:radial-gradient(70% 50% at 50% 0%, #000 30%, rgba(0,0,0,.55) 62%, transparent 100%);mask:radial-gradient(70% 50% at 50% 0%, #000 30%, rgba(0,0,0,.55) 62%, transparent 100%);} }
  :root[data-theme="light"] .sky .img{filter:saturate(.85);opacity:0;} :root[data-theme="light"].on .sky .img{opacity:.42;}
  .on .sky .img{opacity:1;transform:none;}
  :root.noBg .skyClip{display:none;}   /* Tweaks -> Gift receipt -> Background: None, the plain ground ("tweak without bg"); also #nobg on the page's own link */

  /* ---- the page: the wordmark, then the column ---- */
  .top{position:relative;z-index:1;display:flex;justify-content:center;padding:52px 24px 0;}   /* 24 more above the logo, desk and phone ("+24px margin top logo"; was 28) */
  .logo{display:block;width:112px;color:var(--ink);}
  .logo svg{width:100%;height:auto;}
  .rc{position:relative;z-index:1;width:100%;max-width:600px;margin:0 auto;padding:88px 24px 48px;display:flex;flex-direction:column;align-items:center;text-align:center;}
  h1{margin:0;font:500 clamp(32px, 4.2vw + 18px, 52px)/.906 var(--sans);letter-spacing:-.025em;text-wrap:balance;}
  .sub{max-width:30em;margin:16px 0 0;font-size:16px;line-height:1.45;color:var(--ink2);text-wrap:pretty;}
  .sub b{font-weight:400;color:var(--ink);overflow-wrap:anywhere;}

  /* ---- the card: glass over the light; its rows an icon and a label at the left, the value at the right (Booking confirmed's) ---- */
  .card{width:100%;margin-top:40px;padding:14px 24px 16px;border-radius:24px;text-align:left;background:var(--card);}   /* the secondary ground, solid, no glass ("secondary colour bg"); no edge ("remove card border") */
  .cardH{margin:0 0 4px;padding:16px 0 6px;font:500 20px/26px var(--sans);letter-spacing:-.01em;color:var(--ink);}   /* the card's title, a heading of its own ("gift summary title h2") */
  .rows{margin:0;padding:8px 0;}   /* the rows 8, then 4, then 4 more nearer each other ("-8px gap between props", "reduce gap by 4px" twice), their group's edges where they were: 8 back at its top and foot */
  /* three groups, each a question over its rows ("group the gift summary: what did I buy? who is it for? ..."); the question in the ink, a size under the card's title */
  .grp + .grp{margin-top:20px;}
  /* Tweaks -> Gift receipt -> Split cards ("split in 3 cards"): the title on the page, each group a card of its own on the secondary ground, 12 apart */
  :root.split .card{padding:0;border-radius:0;background:none;} :root.split .cardH{padding-top:0;margin-bottom:20px;}   /* 16 more under the title over the cards ("+16px margin bottom") */
  :root.split .grp{padding:14px 24px 12px;border-radius:24px;background:var(--card);} :root.split .grp + .grp{margin-top:12px;}
  .grpH{margin:0;padding:8px 0 4px;font:500 15px/20px var(--sans);letter-spacing:-.005em;color:var(--ink);}
  .row{display:grid;grid-template-columns:minmax(0, 9em) minmax(0, 1fr);column-gap:16px;padding:5px 0;font-size:15px;line-height:20px;}   /* no rules between the rows ("remove divider"): the groups and their space hold them */
  .row dt{display:flex;align-items:flex-start;gap:8px;color:var(--ink2);}
  .row dt svg{flex:none;width:16px;height:16px;margin-top:2px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;}
  .row dd{margin:0;color:var(--ink);overflow-wrap:anywhere;}
  .row.msg dd{font-style:italic;}   /* the message in italics, no rule beside it ("remove orange bar; italic font") */

  /* ---- the actions, side by side; the help line at the foot ---- */
  .btns{display:flex;justify-content:center;width:100%;margin-top:56px;}   /* one CTA now, Back to overview, half the column on the desk ("remove Send another gift"; Sign in gone too) */
  .btns .btn{width:auto;padding:0 28px;}   /* the button its label's width ("hug: too much padding left right") */
  :root:not(.inApp) .btns{display:none;}   /* bought outside the app (Tweaks -> Gift receipt -> In app: Off; #web on the page's own link): no CTA at all */
  .btn{display:flex;align-items:center;justify-content:center;height:56px;padding:0 16px;border-radius:999px;font:500 16px/1 var(--sans);text-decoration:none;cursor:pointer;transition:background-color .2s ease;}
  .btn.sec{box-shadow:inset 0 0 0 1.5px var(--secEdge);color:var(--ink);}
  .btn.sec:hover{background:var(--secHover);}
  .btn.pri{background:var(--pri);color:var(--priInk);}
  .btn.pri:hover{background:var(--priHover);}
  .btn:focus-visible{outline:2px solid var(--acc);outline-offset:3px;}
  .foot{margin:32px 0 0;padding:0 32px;font-size:14px;line-height:1.45;color:var(--ink3);text-wrap:balance;}   /* 32 in at each side ("+32 padding left right"), its two lines balanced */
  .foot span{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;}

  /* ---- coming in: the light rising, then each part up from 12 px, the title out of a blur ---- */
  /* in four beats, one after another ("sections appear smoothly one after another: logo; title group with sub; card; CTA group + sub"): each group up 12 px out of nothing, 1.1 s, 380 ms apart */
  .top, .rc > *{opacity:0;transform:translateY(12px);}
  .on .top, .on .rc > *{animation:up 1.1s cubic-bezier(.2,.7,.15,1) forwards;animation-delay:calc(var(--i, 0) * 380ms + 250ms);}
  .on h1{animation-name:upBlur;}
  @keyframes up{to{opacity:1;transform:none;}}
  @keyframes upBlur{from{filter:blur(10px);} to{opacity:1;transform:none;filter:none;}}

  /* ---- the phone: the rows still two columns ("keep 2 cols for properties"), the label's narrower ---- */
  @media (max-width:479px){
    .top{padding-top:48px;}
    .rc{padding:76px 24px 40px;}   /* 24 at each side ("padding left right 24px"; was 20) */
    .card{margin-top:32px;padding:12px 20px 14px;}
    .row{grid-template-columns:minmax(0, 8.4em) minmax(0, 1fr);column-gap:12px;padding:4px 0;font-size:14px;}   /* the label just wide enough for "Purchase date", the email whole beside it */
    .btns{margin-top:36px;} .btns .btn{padding:0 28px;}   /* the phone: 36 under the card, hugging its label as on the desk */
    :root.split .grp{padding:12px 20px 10px;}
    .btn{padding:0 10px;font-size:15px;white-space:nowrap;}   /* the two on one line each, 28 apart */
    .foot{margin-top:28px;}
  }
  @media (prefers-reduced-motion:reduce){
    .sky .img, .top, .rc > *{transition:none;animation:none !important;opacity:1;transform:none;filter:none;}
  }
</style>
</head>
