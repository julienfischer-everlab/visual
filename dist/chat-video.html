<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat video builder</title>
<link rel="icon" href="data:,">
<style>
  /* Marketing -> Chat video builder (docs/chat-video.md): a composition layer around the Concierge's stage. This page edits the composition JSON; the preview (and the MP4's frames)
     are drawn by visuals/concierge.html#stage in an iframe, with the chat's own CSS and renderers, so the builder never draws a bubble. Its own chrome is the app's tool-page look
     (the Image generator's tokens), dark by default, light on html[data-theme="light"] */
  :root {
    --ground: #0e0f10; --stage: #121314; --panel: #18191b; --raised: #212226; --hover: #2a2b30; --line: #2a2c31; --lineS: #3a3d44;
    --text: #e8e9eb; --label: #a9adb4; --muted: #80858d; --faint: #5c6068; --accent: #3d9be4; --accentSoft: rgba(61, 155, 228, .16);
    --primary: #ecedef; --primaryInk: #111214; --danger: #ef6b5e; --warn: #f0b45a; --ok: #5fd08b; --dot: rgba(255, 255, 255, .045);
    --shadow: rgba(0, 0, 0, .5); --veil: rgba(10, 11, 12, .72); --pop: #1d1e21;
    --tUser: rgba(255, 255, 255, .08); --tUserFg: #c9ccd1; --tEva: rgba(242, 107, 58, .16); --tEvaFg: #f58a5a; --tSpec: rgba(95, 208, 139, .14); --tSpecFg: #6fd497; --tWid: rgba(61, 155, 228, .16); --tWidFg: #6cb4ec;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    color-scheme: dark;
  }
  html[data-theme="light"] {
    --ground: #f3f3f1; --stage: #e8e8e5; --panel: #ffffff; --raised: #f2f2f0; --hover: #e9e9e6; --line: #e0e0dc; --lineS: #cbcbc6;
    --text: #1b1c1e; --label: #44474c; --muted: #6c7077; --faint: #a0a4aa; --accent: #1f7fd0; --accentSoft: rgba(31, 127, 208, .12);
    --primary: #1b1c1e; --primaryInk: #ffffff; --danger: #c8402f; --warn: #b7791f; --ok: #1f8a4c; --dot: rgba(0, 0, 0, .06);
    --shadow: rgba(0, 0, 0, .16); --veil: rgba(243, 243, 241, .8); --pop: #ffffff;
    --tUser: rgba(0, 0, 0, .06); --tUserFg: #44474c; --tEva: rgba(217, 90, 40, .12); --tEvaFg: #c4521f; --tSpec: rgba(31, 138, 76, .12); --tSpecFg: #1f7a45; --tWid: rgba(31, 127, 208, .12); --tWidFg: #1f6fb4;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }   /* a focused field never scrolls the frame: the panels scroll, the page does not */
  body { background: var(--ground); color: var(--text); font: 12.5px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }
  .boot { height: 100%; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }
  .boot.err { color: var(--warn); }
  .ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- the frame: top bar, Composition (left), the canvas (centre), playback (foot), settings (right) ---------- */
  .cvb { position: fixed; inset: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr) 320px; grid-template-rows: auto minmax(0, 1fr) 54px; }
  .tb { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 600; white-space: nowrap; color: var(--label); }
  .brand .ic { color: var(--text); }
  .nm { min-width: 60px; width: 240px; height: 30px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; font-weight: 550; font-size: 13px; outline: none; text-overflow: ellipsis; }
  .nm:hover { background: var(--raised); } .nm:focus { background: var(--raised); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .stat { font: 11px/1 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .stat.dirty { color: var(--warn); }
  .sp { flex: 1 1 auto; }
  .btn { height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--raised); display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; color: var(--text); }
  .btn:hover { background: var(--hover); }
  .btn.pri { background: var(--primary); color: var(--primaryInk); }
  .btn.pri:hover { filter: brightness(.94); }
  .btn.ghost { background: transparent; } .btn.ghost:hover { background: var(--hover); }
  .btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 7px; }
  .btn.danger { color: var(--danger); }
  .btn:disabled, .ib:disabled { opacity: .4; cursor: default; }
  .ib { width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px; background: transparent; display: inline-grid; place-items: center; color: var(--label); flex: none; }
  .ib:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .ib[aria-pressed="true"] { background: var(--accentSoft); color: var(--accent); }
  .ib.sm { width: 26px; height: 26px; border-radius: 7px; } .ib.sm .ic { width: 14px; height: 14px; }
  .mnw { position: relative; }
  .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 250px; padding: 6px; border-radius: 12px; background: var(--pop); box-shadow: 0 0 0 1px var(--line), 0 16px 40px var(--shadow); display: grid; gap: 2px; }
  .menu button { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px; height: auto; min-height: 36px; padding: 6px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
  .menu button:hover:not(:disabled) { background: var(--hover); }
  .menu button:disabled { opacity: .5; cursor: default; }
  .menu b { font-weight: 550; display: block; } .menu em { font-style: normal; color: var(--muted); font-size: 11.5px; display: block; }
  .menu .soon { font: 10px/1 var(--mono); padding: 4px 6px; border-radius: 5px; background: var(--raised); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .menu hr { border: 0; height: 1px; background: var(--line); margin: 4px 2px; }

  .left, .right { grid-row: 2 / 4; background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
  .left { grid-column: 1; border-right: 1px solid var(--line); }
  .right { grid-column: 3; border-left: 1px solid var(--line); }
  .pHd { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
  .pHd h2 { margin: 0; font-size: 12.5px; font-weight: 600; }
  .pHd .cnt { color: var(--muted); font: 11px var(--mono); }
  .pTabs { padding: 0 12px 10px; }
  .seg { display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--raised); min-width: 0; }
  .seg button { flex: 1 1 0; min-width: 0; height: 26px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--hover); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
  html[data-theme="light"] .seg button[aria-pressed="true"] { background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .12), 0 0 0 1px var(--line); }
  .seg.sm button { height: 24px; font-size: 12px; padding: 0 7px; }
  .scroll { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 2px 12px 18px; }
  .scroll::-webkit-scrollbar { width: 8px; } .scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  .adds { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 12px 10px; }
  .add { height: 32px; border: 0; border-radius: 8px; background: var(--raised); display: flex; align-items: center; gap: 7px; padding: 0 10px; color: var(--text); white-space: nowrap; }
  .add:hover { background: var(--hover); }
  .add .dotT { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* the sequence */
  .rows { position: relative; display: grid; gap: 6px; }
  .row { position: relative; display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 4px; padding: 8px 8px 8px 2px; border-radius: 10px; background: var(--raised); box-shadow: inset 0 0 0 1px transparent; transition: transform .2s cubic-bezier(.2, .8, .2, 1), box-shadow .12s, background .12s; }
  .row:hover { background: var(--hover); }
  .row.sel { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .row.drag { transition: none; z-index: 5; background: var(--hover); box-shadow: 0 12px 30px var(--shadow), inset 0 0 0 1.5px var(--accent); }
  .grip { touch-action: none; cursor: grab; width: 20px; align-self: stretch; display: grid; place-items: center; color: var(--faint); border: 0; background: none; padding: 0; border-radius: 6px; }
  .grip:hover { color: var(--label); } .row.drag .grip { cursor: grabbing; }
  .rowMain { min-width: 0; cursor: pointer; outline: none; border-radius: 6px; }
  .rowMain:focus-visible { box-shadow: 0 0 0 1.5px var(--accent); }
  .rowTop { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .num { font: 10.5px/1 var(--mono); color: var(--faint); width: 14px; text-align: right; flex: none; }
  .tag { font-size: 10px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; padding: 3px 6px; border-radius: 5px; white-space: nowrap; flex: none; }
  .tag.user { background: var(--tUser); color: var(--tUserFg); } .tag.eva { background: var(--tEva); color: var(--tEvaFg); }
  .tag.specialist { background: var(--tSpec); color: var(--tSpecFg); } .tag.widget { background: var(--tWid); color: var(--tWidFg); }
  .dotT.user { background: var(--tUserFg); } .dotT.eva { background: var(--tEvaFg); } .dotT.specialist { background: var(--tSpecFg); } .dotT.widget { background: var(--tWidFg); }
  .sub { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .live { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-left: auto; box-shadow: 0 0 0 3px var(--accentSoft); }
  .prev { margin: 4px 0 0 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .rowFoot { display: flex; align-items: center; gap: 2px; margin: 4px 0 0 20px; }
  .meta { font: 10.5px/1.2 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; font-variant-numeric: tabular-nums; }
  .rowAct { display: flex; gap: 0; opacity: .6; transition: opacity .12s; }
  .row:hover .rowAct, .row.sel .rowAct, .row:focus-within .rowAct { opacity: 1; }
  .none { padding: 18px 12px; border-radius: 12px; border: 1px dashed var(--lineS); color: var(--muted); text-align: center; line-height: 1.5; }

  /* the widget library */
  .srch { position: relative; margin: 0 0 8px; }
  .srch .ic { position: absolute; left: 9px; top: 7px; color: var(--muted); }
  .srch input { width: 100%; height: 30px; padding: 0 9px 0 30px; border: 0; border-radius: 8px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); outline: none; }
  .srch input:focus { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { height: 26px; padding: 0 10px; border: 0; border-radius: 99px; background: var(--raised); color: var(--muted); font-size: 12px; }
  .chip[aria-pressed="true"] { background: var(--primary); color: var(--primaryInk); }
  .wh { margin: 12px 2px 6px; font-size: 10.5px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .wcard { border: 0; padding: 0; border-radius: 10px; background: var(--raised); text-align: left; overflow: hidden; display: flex; flex-direction: column; box-shadow: inset 0 0 0 1px transparent; }
  .wcard:hover { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .wth { height: 112px; display: grid; place-items: center; background: var(--stage); overflow: hidden; padding: 8px; }
  .wth img { display: block; max-width: 100%; max-height: 96px; object-fit: contain; border-radius: 4px; }
  .wth .ph { width: 70%; height: 46px; border-radius: 8px; background: var(--hover); animation: ph 1.2s ease-in-out infinite alternate; }
  @keyframes ph { to { opacity: .45; } }
  .wlbl { padding: 7px 9px 8px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .wlbl em { font-style: normal; color: var(--accent); font-size: 10.5px; margin-left: auto; white-space: nowrap; opacity: 0; transition: opacity .12s; } .wcard:hover .wlbl em, .wcard:focus-visible .wlbl em { opacity: 1; }

  /* saved compositions and templates */
  .svRow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 8px 6px 8px 10px; border-radius: 10px; background: var(--raised); margin-bottom: 6px; box-shadow: inset 0 0 0 1px transparent; }
  .svRow.cur { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .svRow .nmB { min-width: 0; border: 0; background: none; padding: 0; text-align: left; }
  .svRow b { display: block; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .svRow em { display: block; font-style: normal; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .svRow input { width: 100%; height: 26px; padding: 0 6px; border: 0; border-radius: 6px; background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--accent); outline: none; }
  .svAct { display: flex; }
  .where { display: inline-flex; align-items: center; gap: 5px; margin: 0 2px 10px; color: var(--muted); font-size: 11.5px; }
  .where i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); } .where.db i { background: var(--ok); }
  .tpl { display: grid; gap: 6px; }
  .tplB { border: 0; padding: 9px 10px; border-radius: 10px; background: var(--raised); text-align: left; display: grid; gap: 2px; }
  .tplB:hover { background: var(--hover); }
  .tplB b { font-weight: 550; } .tplB span { color: var(--muted); font-size: 11.5px; }
  .tplB .flow { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .warnBar { margin: 0 0 10px; padding: 9px 10px; border-radius: 10px; background: rgba(240, 180, 90, .12); color: var(--text); font-size: 12px; display: grid; gap: 8px; }
  .warnBar div { display: flex; gap: 6px; }

  /* the canvas */
  .centre { grid-row: 2; grid-column: 2; position: relative; min-width: 0; min-height: 0; display: grid; place-items: center; background: var(--stage);
    background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.3px); background-size: 16px 16px; overflow: hidden; }
  .cv { position: relative; box-shadow: 0 0 0 1px var(--line), 0 20px 50px var(--shadow); background: #000; margin-bottom: 18px; }
  .cv iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; pointer-events: none; }
  .cvHit { position: absolute; inset: 0; cursor: pointer; touch-action: none; } .cvHit.pic { cursor: grab; } .cvHit.pic.drag { cursor: grabbing; }
  .cvTip { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); padding: 6px 10px; border-radius: 999px; background: var(--veil); color: var(--text); font-size: 11px; line-height: 14px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .2s ease; } .cv:hover .cvTip { opacity: 1; } .cv.drag .cvTip { opacity: 0; }   /* the background moved on the canvas itself ("drag the background and increase the background manually") */
  .res { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 10px; font: 11px/1 var(--mono); color: var(--muted); pointer-events: none; font-variant-numeric: tabular-nums; }
  .res b { color: var(--label); font-weight: 500; }
  .stErr { position: absolute; inset: auto 16px 40px; padding: 10px 12px; border-radius: 10px; background: var(--veil); color: var(--warn); text-align: center; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: var(--veil); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 4; }
  .emptyIn { width: min(560px, 100%); padding: 22px; border-radius: 16px; background: var(--panel); box-shadow: 0 0 0 1px var(--line), 0 24px 60px var(--shadow); display: grid; gap: 14px; }
  .emptyIn h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .emptyIn p { margin: 0; color: var(--muted); line-height: 1.5; }
  .emptyIn .tpl { grid-template-columns: 1fr 1fr; }
  .emptyIn .tplB { background: var(--raised); }

  /* playback */
  .tp { grid-row: 3; grid-column: 2; display: flex; align-items: center; gap: 6px; padding: 9px 14px; border-top: 1px solid var(--line); background: var(--panel); min-width: 0; }
  .tp .play { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: var(--primaryInk); }
  .tp .play:hover:not(:disabled) { background: var(--primary); color: var(--primaryInk); filter: brightness(.92); }
  .tp .play .ic { fill: currentColor; stroke: none; width: 15px; height: 15px; }
  .scrub { position: relative; flex: 1 1 auto; min-width: 80px; height: 30px; margin: 0 6px; }
  .scrub input { position: absolute; left: 0; right: 0; top: 12px; width: 100%; margin: 0; height: 18px; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
  .scrub input::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(var(--accent), var(--accent)) 0 / var(--p, 0%) 100% no-repeat, var(--line); }
  .scrub input::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
  .scrub input::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
  .scrub input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--text); box-shadow: 0 1px 4px var(--shadow); }
  .scrub input::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--text); }
  .marks { position: absolute; left: 7px; right: 7px; top: 0; height: 10px; }
  .mk { position: absolute; top: 0; width: 8px; height: 8px; margin-left: -4px; border: 0; padding: 0; border-radius: 2px; transform: rotate(45deg); opacity: .85; }
  .mk.user { background: var(--tUserFg); } .mk.eva { background: var(--tEvaFg); } .mk.specialist { background: var(--tSpecFg); } .mk.widget { background: var(--tWidFg); }
  .mk.sel { outline: 1.5px solid var(--text); outline-offset: 1px; }
  .time { font: 11.5px/1 var(--mono); color: var(--label); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .time b { color: var(--text); font-weight: 500; }

  /* settings */
  .fs { padding: 2px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .fs:last-child { border-bottom: 0; }
  .fs h3 { margin: 6px 0 9px; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .fs h3 .tag { letter-spacing: .05em; }
  .f { display: grid; gap: 5px; margin-bottom: 10px; min-width: 0; }
  .f > .lb { color: var(--label); font-size: 11.5px; display: flex; justify-content: space-between; gap: 8px; }
  .f > .lb em { font-style: normal; color: var(--muted); }
  .hint { color: var(--muted); font-size: 11px; line-height: 1.4; font-style: normal; margin: 0; }
  .in, .ta, .slc { width: 100%; min-width: 0; height: 30px; padding: 0 9px; border: 0; border-radius: 7px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); outline: none; }
  .ta { height: auto; min-height: 58px; padding: 7px 30px 7px 9px; resize: none; line-height: 1.45; display: block; }
  .in:focus, .ta:focus, .slc:focus { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .slc { padding-right: 6px; }
  .f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .rng { display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 8px; align-items: center; }
  .rng input { width: 100%; accent-color: var(--accent); }
  .rng output { font: 11px var(--mono); color: var(--label); text-align: right; font-variant-numeric: tabular-nums; }
  .txw { position: relative; }
  .emoB { position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 14px; line-height: 1; }
  .emoB:hover { background: var(--hover); color: var(--text); }
  .emo { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; margin-top: 6px; padding: 6px; border-radius: 8px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); }
  .emo button { height: 28px; border: 0; border-radius: 6px; background: transparent; font-size: 16px; line-height: 1; }
  .emo button:hover { background: var(--hover); }
  .tog { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 28px; padding: 0; border: 0; background: transparent; text-align: left; color: var(--text); }
  .tog i { position: relative; width: 30px; height: 18px; border-radius: 99px; background: var(--lineS); flex: none; transition: background .15s; }

        <div className="pTabs" style=${{ paddingTop: '12px' }}><${Seg} label="Settings" value=${rtab} options=${[['item', selItem ? 'Item ' + (selIdx + 1) : 'Item'], ['canvas', 'Canvas']]} onChange=${setRtab} /></div>
        <div className="scroll">
          ${rtab === 'canvas' ? html`<${CanvasPanel} comp=${comp} cat=${cat} edit=${edit} uploadBg=${uploadBg} pickBg=${pickBg} bgNote=${bgNote} lastPic=${lastPic.current} lastVid=${lastVid.current} />`
            : selItem ? html`<${ItemPanel} key=${selItem.id} item=${selItem} index=${selIdx} comp=${comp} S=${S} cat=${cat} sch=${schById[selItem.id]} wById=${wById} specById=${specById} P=${P}
                set=${function (patch, key) { setItem(selItem.id, patch, key); }} onDup=${function () { dup(selItem.id); }} onDel=${function () { del(selItem.id); }} pickAvatar=${pickAvatar} />`
            : html`<div className="noSel"><span>Select an item in the sequence to edit it, or click the canvas for its format and background.</span><button type="button" className="btn sm" onClick=${function () { setRtab('canvas'); }}>Canvas settings</button></div>`}
        </div>
      </aside>
      <input ref=${avRef} type="file" accept="image/*" hidden onChange=${onAvatar} />
      ${dlg ? html`<${CodeDlg} tab=${dlg} comp=${comp} cat=${cat} toast=${toast} onClose=${function () { setDlg(null); }} onImport=${importComp} />` : null}
      <div className="toasts" aria-live="polite">${toasts.map(function (t) { return html`<div key=${t.id} className=${'toast' + (t.kind ? ' ' + t.kind : '')}>${t.msg}</div>`; })}</div>
    </div>`;
  }

  try { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'light' || ls.get(THEME, 'dark') === 'light' ? 'light' : 'dark'; } catch (e) {}
  ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);
})();
</script>
</body>
</html>
