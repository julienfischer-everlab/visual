  body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;}
  button{font:inherit;color:inherit;}
  .logo svg{display:block;height:22px;width:auto;}

  /* the column: the phone's width at any size, centred on a desk */
  .stage{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;}
  :root:not(.xs) body{background:#e9e5e0;} :root:not(.xs) .stage{box-shadow:0 0 0 1px rgba(0,0,0,.06);}
  .sc{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s .35s;}
  .sc.on{opacity:1;visibility:visible;transition:opacity .35s ease;}

  /* the status bar, only in the phone frame */
  .sb{display:none;position:absolute;left:0;right:0;top:0;z-index:30;height:54px;padding:18px 34px 0 46px;justify-content:space-between;align-items:center;font:600 16px/1 -apple-system,'SF Pro Text',var(--sans);letter-spacing:-.01em;pointer-events:none;}
  :root.xs .sb{display:flex;}
  .sb i{display:flex;gap:6px;align-items:center;} .sb svg{display:block;}
  :root.xs .sc{padding-top:54px;}

  /* 00, the app: the Overview dimmed behind the More sheet */
  .s0{background:var(--app);color:var(--appInk);}
  .s0 .ov{padding:28px 24px 0;opacity:.42;}
  .s0 .ovH{display:flex;justify-content:space-between;align-items:center;font-size:24px;letter-spacing:-.01em;}
  .s0 .ovH b{font-weight:400;} .s0 .bell{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;}
  .s0 .ovC{margin-top:22px;height:180px;border-radius:20px;background:radial-gradient(120% 90% at 20% 30%,#2c3a1c,#141812 60%,#101010);}
  .s0 .sheet{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 34px;border-radius:32px 32px 0 0;background:var(--sheet);transform:translateY(100%);transition:transform .55s var(--ease);}
  .s0.on .sheet{transform:none;}
  .grab{display:block;width:36px;height:5px;margin:0 auto 14px;border-radius:3px;background:rgba(255,255,255,.22);}
  .s0 .shH{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px;color:var(--appInk);}
  .s0 .shH .logo svg{height:24px;}
  .x{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;cursor:pointer;}
  .x svg{width:16px;height:16px;}
  .s0 ul{list-style:none;margin:0;padding:0;}
  .s0 li + li{margin-top:2px;}
  .s0 .grp + .grp{margin-top:8px;padding-top:8px;border-top:1px solid var(--appLine);}
  .s0 .it{display:flex;align-items:center;gap:14px;width:100%;padding:14px 8px;border:0;border-radius:14px;background:none;text-align:left;font-size:16px;cursor:pointer;}
  .s0 .it:hover{background:rgba(255,255,255,.04);}
  .s0 .it svg{flex:none;width:22px;height:22px;}
  .s0 .it .av{flex:none;width:22px;height:22px;border-radius:50%;background:#f2f2f2;color:#111;font-size:11px;font-weight:500;display:grid;place-items:center;}
  .s0 .it.go{background:rgba(255,255,255,.06);}

  /* 01, the referral page */
  .s1{background:var(--paper);overflow-y:auto;scrollbar-width:none;} .s1::-webkit-scrollbar{display:none;}
  .pg{display:flex;flex-direction:column;align-items:center;padding:24px 20px 40px;text-align:center;}
  .pg .logo{color:var(--ink);} .pg .logo svg{height:24px;}
  h1{margin:40px 0 0;font:400 34px/1.08 var(--serif);letter-spacing:-.01em;text-wrap:balance;}
  .lede{margin:14px 0 0;max-width:300px;color:var(--ink2);font-size:15px;line-height:1.4;}
  .how{width:100%;margin-top:28px;padding:22px 18px 18px;border-radius:24px;background:var(--card);text-align:left;}
  .how h2{margin:0 0 16px;font:400 23px/1.15 var(--serif);}
  .how ol{list-style:none;margin:0;padding:0;display:grid;gap:16px;}
  .how li{display:grid;grid-template-columns:26px 1fr;gap:12px;}
  .how .n{width:26px;height:26px;border-radius:50%;border:1px solid rgba(29,26,23,.4);display:grid;place-items:center;font-size:12px;}
  .how b{display:block;font-weight:500;font-size:15px;line-height:1.3;}
  .how span{display:block;margin-top:3px;color:var(--ink2);font-size:13px;line-height:1.4;}
  .btn{display:block;width:100%;height:56px;border:0;border-radius:16px;background:#0d0d0d;color:#fff;font-size:16px;font-weight:500;cursor:pointer;transition:transform .15s ease,background .2s ease;}
  .btn:hover{background:#262422;} .btn:active{transform:scale(.98);}
  .btn.sec{background:rgba(29,26,23,.05);color:var(--ink);} .btn.sec:hover{background:rgba(29,26,23,.09);}
  .how .btn{margin-top:22px;}
  .fine{margin:26px 4px 0;color:var(--ink3);font-size:11.5px;line-height:1.5;}
  .ask{margin:16px 0 0;color:var(--ink2);font-size:13px;} .ask a{color:inherit;}

  /* 02 and 03: a sheet over the referral page, the page dimmed */
  .s2,.s3{background:var(--paper);}
  .s2 .pg,.s3 .pg{pointer-events:none;}
  .dim{position:absolute;inset:0;background:rgba(20,18,16,.3);opacity:0;transition:opacity .4s ease;}
  .on .dim{opacity:1;}
  .bs{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:10px 20px 34px;border-radius:32px 32px 0 0;background:#fff;transform:translateY(100%);transition:transform .55s var(--ease);}
  .on .bs{transform:none;}
  .bs .grab{background:rgba(0,0,0,.12);margin-bottom:18px;}
  html.evDisOff .grab{opacity:0;visibility:hidden;}   /* the prototype's Dismiss off (Design system -> Modals): no notch, its room kept */
  .bsH{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
  .bsH h3{margin:0;font:400 26px/1.15 var(--serif);}
  .bsH p{margin:6px 0 0;color:var(--ink2);font-size:13px;line-height:1.4;max-width:270px;}
  .bs .x{flex:none;width:36px;height:36px;background:rgba(29,26,23,.06);}
  .fl{display:grid;gap:14px;margin-top:22px;}
  .fl label{display:grid;gap:7px;font-size:13px;font-weight:500;}
  .fl label small{font-weight:400;color:var(--ink3);font-size:12px;}
  .in{display:flex;height:52px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;transition:border-color .2s ease,box-shadow .2s ease;}
  .in:focus-within{border-color:rgba(29,26,23,.55);box-shadow:0 0 0 3px rgba(29,26,23,.06);}
  .in input{flex:1;min-width:0;border:0;outline:0;padding:0 14px;background:none;font:inherit;font-size:15px;color:var(--ink);}
  .in input::placeholder{color:var(--ink3);}
  .in .cc{flex:none;display:flex;align-items:center;padding:0 14px;border-right:1px solid var(--line);font-size:15px;}
  .s2 .btn{margin-top:20px;}
  .legal{margin:12px 0 0;text-align:center;color:var(--ink3);font-size:12px;line-height:1.45;}
  .okC{display:flex;align-items:center;gap:14px;margin-top:22px;padding:16px;border-radius:16px;background:var(--okBg);color:var(--ok);}
  .okC i{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;}
  .okC i svg{width:20px;height:20px;}
  .okC b{display:block;font-weight:500;font-size:15px;} .okC span{display:block;margin-top:2px;font-size:13px;opacity:.85;}
  .s3 .acts{display:grid;gap:10px;margin-top:22px;}
  .s3 .okC{transform:scale(.96);opacity:0;transition:transform .5s var(--ease) .25s,opacity .4s ease .25s;}
  .s3.on .okC{transform:none;opacity:1;}
  @media (prefers-reduced-motion:reduce){ .sc,.sheet,.bs,.dim,.s3 .okC{transition:none !important;} }

/* Secondary CTAs always on a 32px glass blur ("CTA secondary always blur bg 32px") */
.x { -webkit-backdrop-filter: blur(32px) !important; backdrop-filter: blur(32px) !important; } .btn.sec { -webkit-backdrop-filter: blur(32px) !important; backdrop-filter: blur(32px) !important; }
</style>

    <div class="bs" role="dialog" aria-label="Invitation sent">
      <i class="grab" aria-hidden="true"></i>
      <div class="bsH"><h3>Invitation sent</h3><button class="x" type="button" aria-label="Close" data-go="1"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div>
      <div class="okC" role="status"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4Z"/></svg></i><div><b id="rfOkT">Alex’s invitation is on its way</b><span>We’ve texted them $100 off Everlab.</span></div></div>
      <div class="acts"><button class="btn" type="button" data-go="2" data-reset>Invite someone else</button><button class="btn sec" type="button" data-go="0">Done</button></div>
    </div>
  </section>
</div>
<script>
(function () {
  var root = document.documentElement, scs = [].slice.call(document.querySelectorAll('.sc')), at = -1;
  // the referral page once, under 01, 02 and 03
  var t = document.getElementById('tPg');
  ['.s1', '.s2', '.s3'].forEach(function (s) { var sc = document.querySelector(s); sc.insertBefore(t.content.cloneNode(true), sc.firstChild); });
  [].forEach.call(document.querySelectorAll('.s2 .pg button, .s3 .pg button, .s2 .pg a, .s3 .pg a'), function (b) { b.tabIndex = -1; });
  // the status bar's ink follows the screen: light on the app, dark on the page
  var sb = document.querySelector('.sb');
  function go(i, quiet) {
    i = Math.max(0, Math.min(scs.length - 1, +i || 0));
    if (i === at) return;
    at = i;
    scs.forEach(function (s, k) { s.classList.toggle('on', k === i); s.setAttribute('aria-hidden', String(k !== i)); s.inert = k !== i; });
    sb.style.color = i === 0 ? '#f2f2f2' : '#1d1a17';
    if (i === 2) setTimeout(function () { var n = document.getElementById('rfName'); if (n && at === 2) n.focus({ preventScroll: true }); }, 420);
    if (!quiet) try { parent.postMessage({ everlab: 'rf:at', i: i }, '*'); } catch (e) {}
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]'); if (!b) return;
    if (b.hasAttribute('data-reset')) [].forEach.call(document.querySelectorAll('.s2 input'), function (x) { x.value = ''; });
    go(b.getAttribute('data-go'));
  });
  // Send invitation: on to Sent, with their name (Alex if left empty)
  document.querySelector('.s2 form').addEventListener('submit', function (e) {
    e.preventDefault();
    var n = (document.getElementById('rfName').value || '').trim() || 'Alex';
    document.getElementById('rfOkT').textContent = n + '’s invitation is on its way';
    go(3);
  });
  addEventListener('message', function (e) { var d = e.data; if (d && d.everlab === 'rf:go') go(d.i); });
  window.rfGo = go;
  window.rfAt = function () { return at; };
  var m = /(?:^|[#&])s=(\d)/.exec(location.hash);
  if (/(^|[#&])xs(&|$)/.test(location.hash)) root.classList.add('xs');
  go(m ? +m[1] : 0);
})();
</script>
</body>
