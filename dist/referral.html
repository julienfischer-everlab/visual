<title>Gift referral</title>
<!--
  Everlab · Gift referral, the member's side ("Gift referral page; just this,
  step by step flow"): a member refers someone for $100, in four steps.

    00 In the app · More   the More sheet over the Overview; Refer someone for $100
    01 Refer               the referral page: Good health is worth passing on.
    02 Contact capture     the Send an invitation sheet over it: first name, mobile, email (optional)
    03 Sent                Invitation sent: Alex's invitation is on its way

  One screen at a time, each CTA on to the next; the prototype's Flow panel
  jumps to any of them (postMessage { everlab: 'rf:go', i }) and is told
  which one shows ({ everlab: 'rf:at', i }). The phone's status bar is drawn
  when the prototype frames it as a phone (.xs on the root).

  Fonts are named, never loaded where commercial (Saans, Tobias): Geist and
  Newsreader from Google Fonts stand in.

  The Refer page's top is the Activity plan's ("a header same as Activity with
  Visual and h1 centered"): the photo (the Gift page's couple) pinned, the H1
  centred at its foot, the sheet sliding up over it with the lede first, the
  Everlab logo in the top nav's centre slot. The header overlap is the master's
  (EvOverlap, Design system -> General layout -> Header overlap): its CSS and
  script are not copied here but put in by tools/build.js from index.html where
  the two ev:master markers stand, so dist/referral.html runs the very code
  the app's pages do, with the numbers saved on the doc page.

  Light or dark as the app's Colour mode (data-theme on the root, set by the
  prototype; #light / #dark in the hash for the first paint; the system's
  when opened alone).
-->
<style data-master="EvOverlap">/* from index.html (tools/build.js): Design system -> General layout -> Header overlap, and the Overview bar blur bands it draws on */
  .ovGround{position:absolute;left:0;right:0;top:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .28s ease;}   /* at rest, no ground: the greeting under the bar was blurring ("on rest the top bar gradient / blur"); it comes in as the page scrolls under */
  .ovGround i{position:absolute;left:0;right:0;top:0;display:block;}
  .ovGround i:nth-child(1){height:100%;-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);}
  .ovGround i:nth-child(2){height:92%;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);}
  .ovGround i:nth-child(3){height:84%;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);}
  .ovGround i:nth-child(4){height:76%;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);}
  .ovGround i:nth-child(5){height:68%;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);}
  .ovGround i:nth-child(6){height:60%;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);}
  .ovGround i:nth-child(7){height:52%;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);}
  .ovGround i:nth-child(8){height:44%;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);}
  .ovGround i:nth-child(9){height:36%;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);}
  .ovGround i:nth-child(10){height:28%;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);}
  /* ---- Header overlap (EvOverlap; Design system -> General layout -> Header overlap): the hero pinned, the sheet over it, a small parallax. The numbers are tokens the master sets */
  :root{--hoOverlap:28px;--hoRadius:24px;--hoRise:32px;--hoDim:.35;--hoPicPos:50% 22%;}   /* --hoPicPos: the Activity plan photo's framing (the two runners' faces), the page's and the doc's phone alike */
  .hoHero{position:sticky;top:0;z-index:0;}
  .hoPic{transform:translateY(var(--hpy, 0px));opacity:calc(var(--hoDim) + (1 - var(--hoDim)) * var(--hk, 1));will-change:transform;}
  .hoWords{transform:translateY(var(--hy, 0px));opacity:var(--hk, 1);}
  /* the parallax on the compositor ("img on parallax so laggy!"): where scroll-driven animations exist, EvOverlap marks the scroller .hoTl (a named timeline, --hoSc: a hero's overflow:hidden is a scroller too, so never scroll(nearest))
     and the picture and the title run off it, locked to the scroll in the frame it is drawn, no script and no restyle per frame. The same curves as the script's: linear over 0 -> the span (--hoSpan, the hero's height
     less the fade end; set by EvOverlap once per resize or content change), the picture rising --hoRise and dimming to --hoDim, the title drifting --hoWy (the drift's share of the span) and fading out. Reduced motion: the fades only */
  .hoTl{scroll-timeline:--hoSc block;}
  @supports (animation-timeline: scroll()){
    .hoTl .hoPic{animation:hoPicRun linear both;animation-timeline:--hoSc;animation-range:0px var(--hoSpan, 225px);}
    .hoTl .hoWords{animation:hoWordsRun linear both;animation-timeline:--hoSc;animation-range:0px var(--hoSpan, 225px);}
    @media (prefers-reduced-motion: reduce){ .hoTl .hoPic{animation-name:hoPicDim;} .hoTl .hoWords{animation-name:hoWordsFade;} }
  }
  @keyframes hoPicRun{from{transform:none;opacity:1;}to{transform:translateY(calc(-1 * var(--hoRise)));opacity:var(--hoDim);}}
  @keyframes hoPicDim{from{opacity:1;}to{opacity:var(--hoDim);}}
  @keyframes hoWordsRun{from{transform:none;opacity:1;}to{transform:translateY(var(--hoWy, 0px));opacity:0;}}
  @keyframes hoWordsFade{from{opacity:1;}to{opacity:0;}}
  /* the Service detail's and the Appointment page's hero (.svmHero: its picture the ::before, at .38, its words the children), bound by EvOverlap as every other: the same timeline, the master's numbers.
     .hasHz (a progress card in the hero, which scrolls with the page): the words still, the picture lagging .4 of the scroll (svHzLag: linear over 0 -> 4000 px, past any such page's scroll; the script's --hzy where there is no timeline), its dim off the timeline; a task's short page (svTaskOn): the whole hero fades, its words only drift */
  @supports (animation-timeline: scroll()){
    .hoTl .svmHero::before{animation:svPicRun linear both;animation-timeline:--hoSc;animation-range:0px var(--hoSpan, 225px);} .hoTl .svmHero.hasHz::before{animation:svHzLag linear both, svPicDim linear both;animation-timeline:--hoSc, --hoSc;animation-range:0px 4000px, 0px var(--hoSpan, 225px);}
    .hoTl .svmHero:not(.hasHz) > *{animation:hoWordsRun linear both;animation-timeline:--hoSc;animation-range:0px var(--hoSpan, 225px);}
    html body.svTaskOn #svcMob.hoTl .svmHero, html body.svTaskOn[data-bp="xs"] #dSvc.hoTl .svmHero{animation:hoWordsFade linear both;animation-timeline:--hoSc;animation-range:0px var(--hoSpan, 225px);}
    html body.svTaskOn #svcMob.hoTl .svmHero:not(.hasHz) > *, html body.svTaskOn[data-bp="xs"] #dSvc.hoTl .svmHero:not(.hasHz) > *{animation-name:hoWordsDrift;}
    @media (prefers-reduced-motion: reduce){ .hoTl .svmHero::before{animation-name:svPicDim;} .hoTl .svmHero.hasHz::before{animation:svPicDim linear both;animation-timeline:--hoSc;animation-range:0px var(--hoSpan, 225px);} .hoTl .svmHero:not(.hasHz) > *{animation-name:hoWordsFade;} html body.svTaskOn #svcMob.hoTl .svmHero:not(.hasHz) > *, html body.svTaskOn[data-bp="xs"] #dSvc.hoTl .svmHero:not(.hasHz) > *{animation:none;} }
  }
  @keyframes svPicRun{from{transform:none;opacity:.38;}to{transform:translateY(calc(-1 * var(--hoRise)));opacity:calc(.38 * var(--hoDim));}}
  @keyframes svPicDim{from{opacity:.38;}to{opacity:calc(.38 * var(--hoDim));}}
  @keyframes svHzLag{from{transform:none;}to{transform:translateY(1600px);}}
  @keyframes hoWordsDrift{from{transform:none;}to{transform:translateY(var(--hoWy, 0px));}}
  /* the bar over the moving photo: four of its ten blur bands (1, 4, 7, 10), their radii set so the four blur as the ten do (the radii add as squares: 2.5, 7, 14, 18.5), so six fewer backdrop blurs
     redraw every frame the photo rises under it (the band's region measured within 1 level of 255 of the ten's); all ten again, easing in, once the sheet reaches the bar (.hoOnSheet) */
  .hoBand.on:not(.hoOnSheet) > .ovGround i:is(:nth-child(2), :nth-child(3), :nth-child(5), :nth-child(6), :nth-child(8), :nth-child(9)){-webkit-backdrop-filter:none;backdrop-filter:none;}
  .hoBand.on:not(.hoOnSheet) > .ovGround i:nth-child(1){-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px);} .hoBand.on:not(.hoOnSheet) > .ovGround i:nth-child(4){-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);}
  .hoBand.on:not(.hoOnSheet) > .ovGround i:nth-child(7){-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);} .hoBand.on:not(.hoOnSheet) > .ovGround i:nth-child(10){-webkit-backdrop-filter:blur(18.5px);backdrop-filter:blur(18.5px);}
  .hoSheet{position:relative;z-index:1;margin-top:calc(-1 * var(--hoOverlap));border-radius:var(--hoRadius) var(--hoRadius) 0 0;}
  /* the bar's overflow state ("when the card and the body start to touch the top header, the top header should take the overflow state with a gradient on the background and the blur effect"):
     .hoBand, pinned at the scroller's top over the status bar and the nav bar (--hoBarH), lit (.on) by EvOverlap the moment the sheet's top reaches its foot. Its ground is the Overview bar's own:
     ten blur bands (.ovGround, 14px at the top stepping down to 1.5) under a gradient of the page's ground (--hoGnd), --hoTint at the top easing to nothing --hoBleed under the bar.
     Nothing on the band takes opacity (a faded parent cuts a backdrop blur off from the page under it): the blur eases in by its own radius, the tint and the title by theirs */
  :root{--hoTint:.85;--hoBleed:38px;--hoGndDk:#0f0f0f;}   /* the bar dark over the photo (lit from the first pixel of scroll), then the screen's own ground once the sheet reaches it (.hoOnSheet: "the top header on scroll should be in dark mode until they reach the body, and then turn to the screen mode") */
  .hoBand{position:sticky;top:0;z-index:6;height:var(--hoBarH, 64px);margin-bottom:calc(-1 * var(--hoBarH, 64px));pointer-events:none;}
  .hoBand::before{content:"";position:absolute;left:0;right:0;top:0;bottom:calc(-1 * var(--hoBleed));background:var(--hoGndDk);opacity:0;transition:opacity .28s ease, background-color .28s ease;-webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.91) 18%,rgba(0,0,0,.78) 36%,rgba(0,0,0,.6) 54%,rgba(0,0,0,.38) 72%,rgba(0,0,0,.18) 88%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.91) 18%,rgba(0,0,0,.78) 36%,rgba(0,0,0,.6) 54%,rgba(0,0,0,.38) 72%,rgba(0,0,0,.18) 88%,transparent 100%);}
  .hoBand.on::before{opacity:var(--hoTint);} .hoBand.hoOnSheet::before{background:var(--hoGnd, #0f0f0f);}
  .hoBand > .ovGround{opacity:1;bottom:calc(-1 * var(--hoBleed));transition:none;}
  .hoBand > .ovGround i{transition:-webkit-backdrop-filter .28s ease, backdrop-filter .28s ease;}
  .hoBand:not(.on) > .ovGround i{-webkit-backdrop-filter:blur(0px);backdrop-filter:blur(0px);}
  .hoBand > :not(.ovGround){transition:opacity .28s ease;} .hoBand:not(.hoOnSheet) > :not(.ovGround){opacity:0;}   /* the page's title only once the sheet is under the bar (the photo's own title gone) */
  @media (prefers-reduced-motion: reduce){ .hoBand::before, .hoBand > .ovGround i, .hoBand > :not(.ovGround){transition:none;} }
</style>

    --desk:#e9e5e0; --btn:#0d0d0d; --btnInk:#fff; --btnHover:#262422; --fill:rgba(29,26,23,.05); --fillHi:rgba(29,26,23,.09); --modal:#fff; --field:#fff; --focus:rgba(29,26,23,.55); --ring:rgba(29,26,23,.06); --dimBg:rgba(20,18,16,.3); --grabBg:rgba(0,0,0,.12); --nRing:rgba(29,26,23,.4);
    color-scheme:light;
  }
  /* dark, as the app's Dark mode and the Activity plan's dark sheet (#0f0f0f, cards #181818, modals #181818): the prototype sets data-theme; alone, the system's */
  :root[data-theme="dark"]{
    --paper:#0f0f0f; --card:#181818; --ink:#fff; --ink2:rgba(255,255,255,.56); --ink3:rgba(255,255,255,.4); --line:rgba(255,255,255,.12);
    --ok:#6fd39a; --okBg:rgba(30,138,76,.18);
    --desk:#000; --btn:#fff; --btnInk:#0d0d0d; --btnHover:#e6e6e6; --fill:rgba(255,255,255,.08); --fillHi:rgba(255,255,255,.13); --modal:#181818; --field:rgba(255,255,255,.04); --focus:rgba(255,255,255,.5); --ring:rgba(255,255,255,.08); --dimBg:rgba(0,0,0,.55); --grabBg:rgba(255,255,255,.2); --nRing:rgba(255,255,255,.4);

  @media (prefers-color-scheme: dark){ :root:not([data-theme]){
    --paper:#0f0f0f; --card:#181818; --ink:#fff; --ink2:rgba(255,255,255,.56); --ink3:rgba(255,255,255,.4); --line:rgba(255,255,255,.12);
    --ok:#6fd39a; --okBg:rgba(30,138,76,.18);
    --desk:#000; --btn:#fff; --btnInk:#0d0d0d; --btnHover:#e6e6e6; --fill:rgba(255,255,255,.08); --fillHi:rgba(255,255,255,.13); --modal:#181818; --field:rgba(255,255,255,.04); --focus:rgba(255,255,255,.5); --ring:rgba(255,255,255,.08); --dimBg:rgba(0,0,0,.55); --grabBg:rgba(255,255,255,.2); --nRing:rgba(255,255,255,.4);

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background-color .3s ease, color .3s ease;}
  button{font:inherit;color:inherit;}
  .logo svg{display:block;height:22px;width:auto;}

  /* the column: the phone's width at any size, centred on a desk */
  .stage{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;}
  :root:not(.xs) body{background:var(--desk);} :root:not(.xs) .stage{box-shadow:0 0 0 1px var(--line);}
  .sc{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s .35s;}
  .sc.on{opacity:1;visibility:visible;transition:opacity .35s ease;}

  /* the status bar, only in the phone frame */
  .sb{display:none;position:absolute;left:0;right:0;top:0;z-index:30;height:54px;padding:18px 34px 0 46px;justify-content:space-between;align-items:center;font:600 16px/1 -apple-system,'SF Pro Text',var(--sans);letter-spacing:-.01em;pointer-events:none;}
  :root.xs .sb{display:flex;}
  .sb i{display:flex;gap:6px;align-items:center;} .sb svg{display:block;}
  :root.xs .s0{padding-top:54px;}   /* the app's More; the referral's own screens run their photo up under the status bar, as the Activity plan's */
  .sb{color:#fff;transition:color .28s ease;} :root[data-at="0"] .sb{color:#f2f2f2;} :root.rfUnder[data-at="1"] .sb{color:var(--ink);}   /* white over the photo; the screen's ink once the sheet is under the bar */

  /* 00, the app: the Overview dimmed behind the More sheet */
  .s0{background:var(--app);color:var(--appInk);}
  .s0 .ov{padding:28px 24px 0;opacity:.42;}
  .s0 .ovH{display:flex;justify-content:space-between;align-items:center;font-size:24px;letter-spacing:-.01em;}
  .s0 .ovH b{font-weight:400;} .s0 .bell{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;}
  .s0 .ovC{margin-top:22px;height:180px;border-radius:20px;background:radial-gradient(120% 90% at 20% 30%,#2c3a1c,#141812 60%,#101010);}
  .s0 .sheet{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 34px;border-radius:32px 32px 0 0;background:var(--sheet);transform:translateY(100%);transition:transform .55s var(--ease);}
  .s0.on .sheet{transform:none;}
  .grab{display:block;width:36px;height:5px;margin:0 auto 14px;border-radius:3px;background:rgba(255,255,255,.22);}
  .s0 .shH{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px;color:var(--appInk);}
  .s0 .shH .logo svg{height:24px;}
  .x{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;cursor:pointer;}
  .x svg{width:16px;height:16px;}
  .s0 ul{list-style:none;margin:0;padding:0;}
  .s0 li + li{margin-top:2px;}
  .s0 .grp + .grp{margin-top:8px;padding-top:8px;border-top:1px solid var(--appLine);}
  .s0 .it{display:flex;align-items:center;gap:14px;width:100%;padding:14px 8px;border:0;border-radius:14px;background:none;text-align:left;font-size:16px;cursor:pointer;}
  .s0 .it:hover{background:rgba(255,255,255,.04);}
  .s0 .it svg{flex:none;width:22px;height:22px;}
  .s0 .it .av{flex:none;width:22px;height:22px;border-radius:50%;background:#f2f2f2;color:#111;font-size:11px;font-weight:500;display:grid;place-items:center;}
  .s0 .it.go{background:rgba(255,255,255,.06);}

  /* 01, the referral page: the Activity plan's header. The hero pinned (.hoHero), the photo --hoRise taller to rise into (.hoPic), the H1 centred at its foot (.hoWords),
     the sheet over its foot (.hoSheet), the bar's overflow state (.hoBand): the master's classes and numbers (EvOverlap); the sizes the Activity plan's (265 XS, 320 the column) */
  .s1{background:var(--paper);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;transition:background-color .3s ease;} .s1::-webkit-scrollbar{display:none;}
  .rfBand{--hoBarH:64px;--hoGnd:var(--paper);} :root.xs .rfBand{--hoBarH:130px;}   /* the status bar and the nav bar (54 + 76) on the phone; 64 in the column */
  .rfBar{position:sticky;top:0;z-index:7;height:0;}   /* the top nav: fixed with the page, its centre slot the logo; no controls (the page has none) */
  .rfBarIn{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;justify-content:center;padding:0 72px;} :root.xs .rfBarIn{top:54px;height:76px;}
  .rfBar .logo{color:#fff;transition:color .28s ease;} .rfBar .logo svg{height:24px;}
  :root.rfUnder[data-at="1"] .s1 .rfBar .logo{color:var(--ink);}   /* the screen's ink once the sheet is under the bar, as the Activity plan's Back */
  .rfTop{height:320px;} :root.xs .rfTop{height:265px;}
  .rfHero{position:absolute;inset:0;overflow:hidden;background:#181818;}
  .rfHero img{display:block;width:100%;height:calc(100% + var(--hoRise, 32px));object-fit:cover;object-position:56% 30%;}   /* the couple's faces in frame */
  .rfHero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,.34) 0, rgba(0,0,0,0) 30%, rgba(0,0,0,.1) 50%, rgba(0,0,0,.66) 100%);pointer-events:none;}   /* the Activity plan's: the status bar legible at its top, darkening to its foot under the title */
  .rfHead{position:absolute;left:20px;right:20px;bottom:calc(var(--hoOverlap, 28px) + 24px);text-align:center;}
  h1{margin:0;font:400 34px/1.08 var(--serif);letter-spacing:-.01em;text-wrap:balance;color:#fff;}
  .pg{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:28px 20px 40px;text-align:center;background:var(--paper);transition:background-color .3s ease;}
  :root.xs .pg{padding-bottom:74px;}   /* the home indicator's 34 under the last line */
  .pg{min-height:calc(100vh - 64px);} :root.xs .pg{min-height:calc(100vh - 130px);}   /* at least the screen less the bar: the sheet can always reach the bar (its overflow state, the screen's ink) however short the page */
  .lede{margin:0;max-width:300px;color:var(--ink2);font-size:15px;line-height:1.4;}
  .how{width:100%;margin-top:24px;padding:22px 18px 18px;border-radius:24px;background:var(--card);text-align:left;}
  .how h2{margin:0 0 16px;font:400 23px/1.15 var(--serif);}
  .how ol{list-style:none;margin:0;padding:0;display:grid;gap:16px;}
  .how li{display:grid;grid-template-columns:26px 1fr;gap:12px;}
  .how .n{width:26px;height:26px;border-radius:50%;border:1px solid var(--nRing);display:grid;place-items:center;font-size:12px;}
  .how b{display:block;font-weight:500;font-size:15px;line-height:1.3;}
  .how span{display:block;margin-top:3px;color:var(--ink2);font-size:13px;line-height:1.4;}
  .btn{display:block;width:100%;height:56px;border:0;border-radius:16px;background:var(--btn);color:var(--btnInk);font-size:16px;font-weight:500;cursor:pointer;transition:transform .15s ease,background .2s ease;}
  .btn:hover{background:var(--btnHover);} .btn:active{transform:scale(.98);}
  .btn.sec{background:var(--fill);color:var(--ink);} .btn.sec:hover{background:var(--fillHi);}
  .how .btn{margin-top:22px;}
  .fine{margin:26px 4px 0;color:var(--ink3);font-size:11.5px;line-height:1.5;}
  .ask{margin:16px 0 0;color:var(--ink2);font-size:13px;} .ask a{color:inherit;}

  /* 02 and 03: a sheet over the referral page, the page dimmed */
  .s2,.s3{background:var(--paper);}
  .s2 .pw,.s3 .pw{pointer-events:none;}
  .dim{position:absolute;inset:0;z-index:8;background:var(--dimBg);opacity:0;transition:opacity .4s ease;}
  .on .dim{opacity:1;}
  .bs{position:absolute;left:0;right:0;bottom:0;z-index:9;padding:10px 20px 34px;border-radius:32px 32px 0 0;background:var(--modal);color:var(--ink);transform:translateY(100%);transition:transform .55s var(--ease), background-color .3s ease;}
  .on .bs{transform:none;}
  .bs .grab{background:var(--grabBg);margin-bottom:18px;}
  html.evDisOff .grab{opacity:0;visibility:hidden;}   /* the prototype's Dismiss off (Design system -> Modals): no notch, its room kept */
  .bsH{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
  .bsH h3{margin:0;font:400 26px/1.15 var(--serif);}
  .bsH p{margin:6px 0 0;color:var(--ink2);font-size:13px;line-height:1.4;max-width:270px;}
  .bs .x{flex:none;width:36px;height:36px;background:var(--fill);color:var(--ink);}
  .fl{display:grid;gap:14px;margin-top:22px;}
  .fl label{display:grid;gap:7px;font-size:13px;font-weight:500;}
  .fl label small{font-weight:400;color:var(--ink3);font-size:12px;}
  .in{display:flex;height:52px;border:1px solid var(--line);border-radius:12px;background:var(--field);overflow:hidden;transition:border-color .2s ease,box-shadow .2s ease;}
  .in:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px var(--ring);}
  .in input{flex:1;min-width:0;border:0;outline:0;padding:0 14px;background:none;font:inherit;font-size:15px;color:var(--ink);}
  .in input::placeholder{color:var(--ink3);}
  .in .cc{flex:none;display:flex;align-items:center;padding:0 14px;border-right:1px solid var(--line);font-size:15px;}
  .s2 .btn{margin-top:20px;}
  .legal{margin:12px 0 0;text-align:center;color:var(--ink3);font-size:12px;line-height:1.45;}
  .okC{display:flex;align-items:center;gap:14px;margin-top:22px;padding:16px;border-radius:16px;background:var(--okBg);color:var(--ok);}
  .okC i{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;}
  .okC i svg{width:20px;height:20px;}
  .okC b{display:block;font-weight:500;font-size:15px;} .okC span{display:block;margin-top:2px;font-size:13px;opacity:.85;}
  .s3 .acts{display:grid;gap:10px;margin-top:22px;}
  .s3 .okC{transform:scale(.96);opacity:0;transition:transform .5s var(--ease) .25s,opacity .4s ease .25s;}

      <p class="lede">Most people hear about Everlab from a friend or a loved one. Refer someone and both of you will receive $100 off.</p>
      <div class="how">
        <h2>How the referral works</h2>
        <ol>
          <li><span class="n">1</span><div><b>Send an invitation</b><span>Tap the button below and add their name and mobile. We’ll send them your invitation.</span></div></li>
          <li><span class="n">2</span><div><b>They get $100 off</b><span>Off their Everlab Baseline, credited towards a plan or add-on of their choice, when they join through your invitation.</span></div></li>
          <li><span class="n">3</span><div><b>You get $100 credit</b><span>Once they sign up, we’ll add $100 credit towards your next renewal or add-on. Please allow up to three business days.</span></div></li>
        </ol>
        <button class="btn" type="button" data-go="2">Send an invitation</button>
      </div>
      <p class="fine">You can receive credit for up to two successful referrals. You can’t refer yourself. Referral credits expire within three months, and are removed if the person you referred receives a refund.</p>
      <p class="ask">Questions? Reach us on <a href="mailto:support@everlab.com.au" tabindex="-1">support@everlab.com.au</a></p>

<script>
(function () {
