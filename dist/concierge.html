<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concierge</title>
<style>
  /* Concierge: the member's chat with Eva, from the Figma boards (single appointment, appointment group, goals,
     attachments, clinician fallback, reports, imaging), as a working page of the prototype: the desktop app (sidebar,
     chat, input) or the mobile panel, every component the boards draw, and a Components tab laying them all out.
     Built to dist/concierge.html by tools/build.js, its pictures inlined; the prototype opens it under its bar. */
  /* the app's own values ("the chat doesn't follow the style of the app: match the font size, the CTAs"), as measured on the Overview: Suisse Intl; dark #0d0d0c under #ececec, secondary #8b8b86, the sidebar #181818,
     cards a 4% white wash with no border, round 20; the CTA a white pill, 15/500; the field a pill at an 8% wash; the count badges #4a4a4a. Light: the page white, the sidebar #efe7d8, ink #2e1f1a, secondary #7d6b58,
     washes of the ink at 6%, the CTA the ink with #fdfaf3 on it */
  :root {
    --bg: #ffffff; --side: #efe7d8; --fg: #2e1f1a; --muted: #7d6b58; --faint: rgba(46, 31, 26, .4);
    --line: rgba(46, 31, 26, .1); --card: rgba(46, 31, 26, .055); --cardLine: transparent; --bubble: rgba(46, 31, 26, .07); --input: rgba(46, 31, 26, .06);
    --hover: rgba(46, 31, 26, .05); --active: rgba(46, 31, 26, .08); --sec: rgba(46, 31, 26, .08); --secH: rgba(46, 31, 26, .13);
    --pri: #2e1f1a; --priFg: #fdfaf3; --acc: #f26b3a; --accFg: #ffffff; --ok: #2f8f57; --bad: #c8463f; --badge: #4a4a4a; --badgeFg: #ffffff;
    --pop: #fdfaf3; --popLine: rgba(46, 31, 26, .1); --stage: #e9e1d2; --scrim: rgba(20, 14, 10, .32); --ring: rgba(46, 31, 26, .55);
    --note: #f4a067; --noteFg: #2e1f1a; --edge: rgba(46, 31, 26, .16);
    --kbBg: #d1d3d9; --kKey: #ffffff; --kFn: #acb0bb; --kInk: #000000; --kSel: rgba(0, 0, 0, .08);
    --shadow: none; --popShadow: 0 2px 6px rgba(46, 31, 26, .06), 0 16px 40px rgba(46, 31, 26, .14);
    --sans: "Suisse Intl", SuisseIntl, "Suisse Int'l", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0d0c; --side: #181818; --fg: #ececec; --muted: #8b8b86; --faint: rgba(236, 236, 236, .36);
      --line: rgba(255, 255, 255, .07); --card: rgba(255, 255, 255, .04); --cardLine: transparent; --bubble: rgba(255, 255, 255, .08); --input: rgba(255, 255, 255, .08);
      --hover: rgba(255, 255, 255, .05); --active: rgba(255, 255, 255, .07); --sec: rgba(255, 255, 255, .08); --secH: rgba(255, 255, 255, .14);
      --pri: #ffffff; --priFg: #111111; --ok: #4cc27e; --bad: #f06a6a; --badge: #4a4a4a; --badgeFg: #ffffff;
      --pop: #232322; --popLine: rgba(255, 255, 255, .08); --stage: #050505; --scrim: rgba(0, 0, 0, .5); --ring: rgba(255, 255, 255, .3);
      --note: #f7b58b; --noteFg: #1c1410; --edge: rgba(255, 255, 255, .16);
      --kbBg: #5a5a5c; --kKey: #7c7c7f; --kFn: #464648; --kInk: #ffffff; --kSel: rgba(0, 0, 0, .16);
      --shadow: none; --popShadow: 0 16px 40px rgba(0, 0, 0, .5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0d0c; --side: #181818; --fg: #ececec; --muted: #8b8b86; --faint: rgba(236, 236, 236, .36);
    --line: rgba(255, 255, 255, .07); --card: rgba(255, 255, 255, .04); --cardLine: transparent; --bubble: rgba(255, 255, 255, .08); --input: rgba(255, 255, 255, .08);
    --hover: rgba(255, 255, 255, .05); --active: rgba(255, 255, 255, .07); --sec: rgba(255, 255, 255, .08); --secH: rgba(255, 255, 255, .14);
    --pri: #ffffff; --priFg: #111111; --ok: #4cc27e; --bad: #f06a6a; --badge: #4a4a4a; --badgeFg: #ffffff;
    --pop: #232322; --popLine: rgba(255, 255, 255, .08); --stage: #050505; --scrim: rgba(0, 0, 0, .5); --ring: rgba(255, 255, 255, .3);
    --note: #f7b58b; --noteFg: #1c1410; --edge: rgba(255, 255, 255, .16);
    --kbBg: #5a5a5c; --kKey: #7c7c7f; --kFn: #464648; --kInk: #ffffff; --kSel: rgba(0, 0, 0, .16);
    --shadow: none; --popShadow: 0 16px 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  img { display: block; max-width: 100%; }
  .ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ic.lg { fill: currentColor; stroke: none; }   /* the Everlab mark, filled */

  /* the page's own bar: what to look at (the chat or its components), on which device, in which theme */
  .bar { position: relative; z-index: 3; display: flex; align-items: center; gap: 12px; height: 48px; padding-inline: 16px; border-bottom: 1px solid var(--line); background: var(--side); }
  .bar h1 { margin: 0 8px 0 0; font-size: 13px; font-weight: 500; letter-spacing: .01em; white-space: nowrap; }
  .seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--sec); }
  .seg button { height: 28px; padding: 0 12px; border-radius: 7px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
  .bar .sp { flex: 1; }
  .iconBtn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; color: var(--muted); }
  .hd .iconBtn { background: var(--sec); color: var(--fg); }
  .hd .iconBtn:hover { background: var(--secH); }
  .iconBtn:hover { background: var(--hover); color: var(--fg); }
  .phoneMode .devSeg { display: none; }

  /* the stage under the bar: the app fills it, or holds the mobile panel framed in the middle */
  .stage { position: absolute; left: 0; right: 0; top: 48px; bottom: 0; overflow: hidden; }
  .stage.dvMob { display: grid; place-items: center; background: var(--stage); padding: 24px 16px; }
  .app { position: relative; display: grid; grid-template-columns: 256px minmax(0, 1fr); width: 100%; height: 100%; background: var(--bg); overflow: hidden; transition: grid-template-columns .32s cubic-bezier(.3, .7, .2, 1), opacity .28s, transform .36s cubic-bezier(.2, .8, .2, 1); }
  .stage.dvMob .app { width: min(390px, 100%); height: min(800px, 100%); border-radius: 24px; border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0, 0, 0, .18); }
  .app.sideMin { grid-template-columns: 64px minmax(0, 1fr); }
  .app.closed { opacity: 0; transform: translateY(16px) scale(.97); pointer-events: none; }
  .stage.dvMob .app.closed { transform-origin: 100% 100%; }

  /* sidebar */
  .side { display: flex; flex-direction: column; min-width: 0; padding: 14px 12px; border-right: 1px solid var(--line); background: var(--side); overflow: hidden; }
  .sideHd { display: flex; align-items: center; gap: 8px; height: 36px; padding-left: 6px; margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 16px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; }
  .brand .ic { width: 18px; height: 18px; }
  .sideHd .iconBtn { margin-left: auto; }
  .nav { display: grid; gap: 2px; }
  .item { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 38px; padding: 8px 10px; border-radius: 8px; font-size: 13.5px; text-align: left; white-space: nowrap; color: var(--muted); }
  .nav .item { color: var(--fg); }
  .item .ic { width: 18px; height: 18px; }
  .item:hover { background: var(--hover); }
  .item.on { background: var(--active); }
  .item span { overflow: hidden; text-overflow: ellipsis; }
  .badge { margin-left: auto; min-width: 24px; height: 22px; padding: 0 7px; display: inline-grid; place-items: center; border-radius: 7px; background: var(--note); color: var(--noteFg); font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .ud { width: 7px; height: 7px; border-radius: 50%; background: var(--note); flex: none; }   /* unread */
  .item .ud { margin-left: 4px; }
  .badge:empty, .badge[data-n="0"] { display: none; }
  .recHd { margin: 24px 10px 8px; font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
  .rec { display: grid; gap: 1px; overflow-y: auto; margin-inline: -4px; padding-inline: 4px; scrollbar-width: none; }
  .rec .item { color: var(--muted); }
  .rec .item.on, .rec .item:hover { color: var(--fg); }
  .app.sideMin .side { padding-inline: 12px; }
  .app.sideMin .brand span, .app.sideMin .item span, .app.sideMin .recHd, .app.sideMin .rec { display: none; }
  .app.sideMin .sideHd { flex-direction: column; height: auto; gap: 10px; padding-left: 0; }
  .app.sideMin .sideHd .iconBtn { margin-left: 0; }
  .app.sideMin .item { justify-content: center; padding-inline: 0; }
  .app.sideMin .badge { position: absolute; top: 3px; right: 3px; min-width: 8px; width: 8px; height: 8px; padding: 0; border-radius: 50%; font-size: 0; }

  /* the chat */
  .main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .hd { display: flex; align-items: center; gap: 6px; height: 52px; flex: none; padding: 0 12px; }
  .hd .ttl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 500; color: var(--fg); }
  .hd .sp { flex: 1; }
  .hd .mobOnly { display: none; }
  .hdInbox { display: none; align-items: center; gap: 8px; height: 36px; padding: 0 8px 0 12px; border-radius: 999px; background: var(--sec); font-size: 14px; font-weight: 500; }
  .hdInbox:hover { background: var(--secH); }
  .hdInbox .ic { width: 18px; height: 18px; }
  .hdInbox .badge { margin-left: 0; min-width: 22px; height: 20px; padding: 0 6px; font-size: 12px; border-radius: 6px; }
  .app.atHome .hd .ttl, .app.atHome #hdBack { visibility: hidden; }
  .app.mob.atHome .hd .hdInbox { display: inline-flex; }
  .app.mob.atHome #hdMin { display: none; }
  .thread { flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: smooth; }
  .col { width: 100%; max-width: 688px; margin: 0 auto; padding: 12px 24px 40px; }
  .dock { flex: none; width: 100%; max-width: 688px; margin: 0 auto; padding: 0 24px 24px; }
  .box { border-radius: 24px; background: var(--input); padding: 14px 10px 10px 18px; box-shadow: inset 0 0 0 1.5px transparent; transition: box-shadow .16s ease, background .16s ease; }
  .box:focus-within { box-shadow: inset 0 0 0 1.5px var(--ring); }
  .box textarea { display: block; width: 100%; min-height: 24px; max-height: 160px; resize: none; border: 0; outline: 0; background: none; color: var(--fg); font: 15px/1.5 var(--sans); padding: 2px 0; }
  .box textarea::placeholder { color: var(--muted); }
  .boxRow { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .boxRow .sp { flex: 1; }
  .round { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--sec); color: var(--fg); }
  .round:hover { color: var(--fg); background: var(--hover); }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px 0 16px; border-radius: 999px; background: var(--sec); font-size: 15px; }
  .pill:hover { background: var(--secH); }
  .pill .ic { width: 18px; height: 18px; color: var(--fg); }
  /* the send arrow only once a character is typed: folded away until then, grown in with the first */
  .send { display: inline-grid; place-items: center; width: 0; height: 40px; margin-left: -8px; border-radius: 50%; overflow: hidden; background: var(--sec); color: var(--faint); opacity: 0; transform: scale(.6); pointer-events: none; transition: background .2s, color .2s, width .22s cubic-bezier(.2, .8, .2, 1), margin .22s cubic-bezier(.2, .8, .2, 1), opacity .16s, transform .22s cubic-bezier(.2, .8, .2, 1); }
  .send.has { width: 40px; margin-left: 0; opacity: 1; transform: none; pointer-events: auto; }
  .send.on { background: var(--pri); color: var(--priFg); }

  /* messages */
  .msg { display: flex; flex-direction: column; margin-top: 24px; }
  .msg:first-child { margin-top: 8px; }
  .msg.u { align-items: flex-end; }
  .msg.u .bub { max-width: min(80%, 480px); padding: 11px 18px; border-radius: 22px; background: var(--bubble); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.a .txt { max-width: 600px; white-space: pre-wrap; overflow-wrap: anywhere; text-wrap: pretty; }
  .msg.a .txt:empty { display: none; }
  .blk { margin-top: 16px; min-width: 0; }
  .blk + .blk { margin-top: 12px; }
  .blk:has(> .cite) { margin-top: 10px; }
  .meta { display: flex; align-items: center; gap: 2px; margin-top: 6px; color: var(--muted); font-size: 12px; opacity: 0; transition: opacity .2s; font-variant-numeric: tabular-nums; }
  .msg:hover .meta, .msg:focus-within .meta, .msg.last .meta { opacity: 1; }
  .meta time { margin-right: 6px; }
  .meta button { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; color: var(--faint); }
  .meta button:hover { background: var(--hover); color: var(--fg); }
  .meta button.on { color: var(--fg); }
  .meta .ic { width: 15px; height: 15px; }
  .msg.a .meta { margin-left: -6px; }
  /* the desk: the question's actions sit in the gap under it on hover, so the answer follows close */
  .app:not(.mob) .msg.u { position: relative; }
  .app:not(.mob) .msg.u .meta { position: absolute; right: 0; top: 100%; margin-top: 4px; }
  .app:not(.mob) .msg.u + .msg, .app:not(.mob) .msg.u + .think { margin-top: 36px; }
  .in { animation: rise .42s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .think { margin-top: 24px; font-size: 14px; color: var(--muted); background: linear-gradient(90deg, var(--faint) 0 30%, var(--fg) 45%, var(--faint) 60% 100%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: shim 1.6s linear infinite; width: fit-content; }
  @keyframes shim { from { background-position: 100% 0; } to { background-position: 0 0; } }

  /* the new chat, the Concierge's home ("that's the screen design", Homepage - With Unread): the mark, the question, the field in the page with the three ways in under it,
     the disclaimer, then what is waiting (For your attention: all, messages, requests, suggestions); a question asked takes the field back down to the foot */
  .home { display: flex; flex-direction: column; padding: 80px 0 24px; }
  .homeHd { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .homeLogo { width: 40px; height: 40px; color: var(--fg); }
  .homeHd h2 { margin: 0; font-size: 24px; font-weight: 500; line-height: 1.25; letter-spacing: -.3px; text-wrap: balance; }
  .homeBox { margin-top: 28px; }
  .app.atHome .dock { display: none; }
  .app.atHome .box { padding: 20px 12px 12px; }
  .app.atHome .box textarea { padding-inline: 8px; }
  .app.atHome .boxRow { margin-top: 18px; }
  .app.atHome .box:focus-within { box-shadow: inset 0 0 0 1.5px transparent; }
  .app.atHome .send { width: 36px; height: 36px; margin-left: 0; opacity: 1; transform: none; }   /* there from the start, faint until a character is typed */
  .cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  .cat { display: flex; align-items: center; gap: 12px; min-width: 0; height: 52px; padding: 0 14px 0 16px; border-radius: 16px; background: var(--input); font-size: 15px; line-height: 1.3; text-align: left; transition: background .15s ease; }
  .cat:hover, .cat[aria-expanded="true"] { background: linear-gradient(var(--hover), var(--hover)), var(--input); }
  .cat .ic { width: 22px; height: 22px; }
  .catT { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat .catChev { width: 18px; height: 18px; color: var(--fg); transition: transform .2s ease; }
  .cat[aria-expanded="true"] .catChev { transform: rotate(180deg); }
  .pop.catPop { width: max-content; max-width: min(420px, calc(100vw - 16px)); }
  .app.atHome:not(.mob) .col { max-width: 768px; }   /* the home's column, the design's 720 */
  .app:not(.mob) .cats { gap: 8px; }
  .app:not(.mob) .cat { gap: 10px; padding: 0 10px 0 14px; font-size: 14px; }
  .disc { margin: 16px auto 0; text-align: center; font-size: 12px; line-height: 1.45; color: var(--muted); text-wrap: balance; }
  .attn { margin-top: 48px; }
  .attnHd { display: flex; align-items: center; gap: 10px; }
  .attnHd > .ic { width: 22px; height: 22px; }
  .attnHd h3 { margin: 0; font-size: 18px; font-weight: 500; letter-spacing: -.01em; }
  .attnHd .sp { flex: 1; }
  .seeAll { display: inline-flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 500; }
  .seeAll .ic { width: 16px; height: 16px; }
  .seeAll:hover { opacity: .75; }
  .chips { --chipX: 24px; display: flex; gap: 8px; margin: 18px calc(-1 * var(--chipX)) 4px; padding: 0 var(--chipX); overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent); }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--edge); font-size: 15px; transition: box-shadow .15s ease; }
  .chip .ic { width: 18px; height: 18px; }
  .chip:hover { box-shadow: inset 0 0 0 1px var(--ring); }
  .chip[aria-selected="true"] { box-shadow: inset 0 0 0 1px var(--fg); }
  .attnRow { display: flex; align-items: center; gap: 16px; width: calc(100% + 16px); margin-inline: -8px; padding: 20px 8px; border-radius: 14px; text-align: left; position: relative; }
  .attnRow + .attnRow::before { content: ""; position: absolute; left: 8px; right: 8px; top: 0; border-top: 1px solid var(--line); }
  .attnRow:hover { background: var(--hover); }
  .attnRow:hover::before, .attnRow:hover + .attnRow::before { opacity: 0; }
  .attnAv { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex: none; }
  .attnIc { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--input); flex: none; }
  .attnIc .ic { width: 22px; height: 22px; }
  .attnTx { flex: 1; min-width: 0; }
  .attnTx b { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; white-space: nowrap; }
  .attnTx b span { overflow: hidden; text-overflow: ellipsis; }
  .attnTx b .ud { margin-left: 4px; }
  .attnTx p { margin: 4px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 14px; }
  .attnSt { flex: none; align-self: flex-start; margin-top: 1px; color: var(--muted); font-size: 14px; }
  .attnNone { padding: 28px 0 8px; color: var(--muted); font-size: 14px; text-align: center; }
  .sugs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 28px; width: 100%; }
  .sug { display: block; width: 100%; padding: 16px 18px; border-radius: 20px; background: var(--card); text-align: left; font-size: 15px; color: var(--fg); transition: background .15s ease; }
  .sug:hover { background: var(--hover); }
  .sug small { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
  .sugRow { display: flex; flex-wrap: wrap; gap: 6px; }
  .sugRow .sug { width: auto; padding: 9px 16px; border-radius: 999px; font-size: 14px; }

  /* inbox */
  .inbox { display: grid; gap: 8px; padding-top: 8px; }
  .inbox h2 { margin: 0 0 8px; font-size: 18px; font-weight: 500; letter-spacing: -.01em; }
  .note { display: flex; gap: 12px; align-items: flex-start; width: 100%; padding: 18px; border-radius: 20px; background: var(--card); text-align: left; }
  .note:hover { background: var(--hover); }
  .note img, .note .noteIc { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex: none; }
  .note .noteIc { display: grid; place-items: center; background: var(--sec); }
  .note b { display: block; font-size: 15px; font-weight: 500; }
  .note p { margin: 3px 0 0; color: var(--muted); font-size: 14px; }
  .note time { margin-left: auto; flex: none; color: var(--faint); font-size: 11.5px; }
  .note .dot { width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--acc); flex: none; }
  .note.read .dot { visibility: hidden; }

  /* appointment card: wide (the chat) or compact (narrow places) */
  .apt { display: flex; flex-direction: column; width: min(100%, 470px); padding: 20px; border-radius: 20px; background: var(--card); }
  .aptTop { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 18px; }
  .av { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex: none; background: var(--sec); }
  .aptTx { min-width: 0; }
  .aptTx b { display: block; font-size: 15px; font-weight: 500; line-height: 1.3; }
  .aptTx p { margin: 4px 0 0; color: var(--muted); font-size: 14px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .aptFoot { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; min-height: 40px; margin-top: auto; }   /* at the card's foot, so cards side by side keep their buttons level */
  .aptSt { display: grid; gap: 2px; font-size: 13px; min-width: 0; }
  .st { font-weight: 500; }
  .st.ok { color: var(--ok); } .st.bad { color: var(--bad); } .st.mut { color: var(--muted); font-weight: 400; }
  .dt { color: var(--muted); font-variant-numeric: tabular-nums; }
  .btns { display: flex; gap: 6px; flex: none; }
  .btn { height: 40px; padding: 0 20px; border-radius: 999px; background: var(--sec); font-size: 15px; font-weight: 500; white-space: nowrap; transition: background .15s, opacity .16s ease, transform .15s ease; }
  .btn:hover { background: var(--secH); }
  .btn:active { transform: scale(.97); }
  .btn.pri { background: var(--pri); color: var(--priFg); }
  .btn.pri:hover { background: var(--pri); opacity: .88; }
  .apt.cmp { width: 264px; padding: 16px; }
  .apt.cmp .av { width: 40px; height: 40px; }
  .apt.cmp .aptTop { margin-bottom: 14px; }
  .apt.cmp .aptFoot { display: block; }
  .apt.cmp .aptSt { display: flex; gap: 6px; flex-wrap: wrap; }
  .apt.cmp .btns { margin-top: 10px; }
  .apt.cmp .btn { flex: 1; }
  .apt.flash { animation: flash .9s ease; }
  @keyframes flash { 30% { border-color: var(--ok); } }

  /* appointment rows and the group around them */
  .aRow { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border-radius: 10px; }
  .aRow .av { width: 36px; height: 36px; border-radius: 9px; }
  .aRow b { display: block; font-size: 15px; font-weight: 500; line-height: 1.3; }
  .aRow .aptSt { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .grp { width: min(100%, 440px); padding: 20px; border-radius: 20px; background: var(--card); }
  .grpHd { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-size: 16px; font-weight: 500; }
  .count { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 8px; border-radius: 12px; background: var(--badge); color: var(--badgeFg); font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .grpList { display: grid; gap: 14px; }
  .grpList .aRow:hover b { text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--faint); }
  .grpMore { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .36s cubic-bezier(.3, .7, .2, 1); }
  .grpMore > div { min-height: 0; overflow: hidden; display: grid; gap: 14px; }
  .grp.open .grpMore { grid-template-rows: 1fr; }
  .grp.open .grpMore > div { padding-top: 14px; }
  .more { display: inline-flex; align-items: center; gap: 4px; margin-top: 16px; font-size: 14px; color: var(--muted); }
  .more:hover { color: var(--fg); }
  .more .ic { width: 14px; height: 14px; transition: transform .3s; }
  .grp.open .more .ic { transform: rotate(180deg); }

  /* carousels: a heading with its count and arrows, then a row that scrolls */
  .car { min-width: 0; }
  .carHd { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 16px; font-weight: 500; }
  .carHd .sp { flex: 1; }
  .carHd .arw { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--sec); color: var(--fg); }
  .carHd .arw:hover { background: var(--hover); }
  .carHd .arw:disabled { color: var(--faint); cursor: default; background: var(--card); }
  .carT { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; padding-bottom: 2px; }
  .carT::-webkit-scrollbar { display: none; }
  .carT > * { scroll-snap-align: start; flex: none; }
  .car.fadeR .carT { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 56px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 56px), transparent); }
  .car.fadeL.fadeR .carT { -webkit-mask-image: linear-gradient(90deg, transparent, #000 40px calc(100% - 56px), transparent); mask-image: linear-gradient(90deg, transparent, #000 40px calc(100% - 56px), transparent); }
  .car.fadeL:not(.fadeR) .carT { -webkit-mask-image: linear-gradient(90deg, transparent, #000 40px); mask-image: linear-gradient(90deg, transparent, #000 40px); }

  /* goal */
  .goal { display: flex; flex-direction: column; justify-content: space-between; width: 220px; min-height: 190px; padding: 18px; border-radius: 20px; background: var(--card); text-align: left; }
  .goalTop { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .goal b { font-size: 15px; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .goal p { margin: 16px 0 0; color: var(--muted); font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .goal.solo { width: min(100%, 260px); }
  .orb { width: 18px; height: 18px; border-radius: 50%; flex: none; box-shadow: inset -2px -3px 6px rgba(0, 0, 0, .25); }
  .orb.or { background: radial-gradient(circle at 34% 30%, #ffd9b8 0, #f4762f 42%, #9a300c 100%); }
  .orb.bl { background: radial-gradient(circle at 34% 30%, #eef4ff 0, #86aee8 42%, #2d4f8e 100%); }
  .orb.br { background: radial-gradient(circle at 34% 30%, #f3dfcc 0, #b07c55 42%, #4f2d1a 100%); }
  .orb.rd { background: radial-gradient(circle at 34% 30%, #ffd0c6 0, #dc4b3c 42%, #6e1710 100%); }
  .orb.gn { background: radial-gradient(circle at 34% 30%, #dcf6e2 0, #56bb79 42%, #1e5c34 100%); }

  /* attachment chips, their menu */
  .atts { display: flex; flex-wrap: wrap; gap: 8px; }
  .att { display: flex; align-items: center; gap: 12px; max-width: 100%; padding: 10px 8px 10px 10px; border-radius: 16px; background: var(--card); }
  .attIc { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--sec); color: var(--fg); flex: none; }
  .attTx { min-width: 0; }
  .attTx b { display: block; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 500; }
  .attTx span { display: block; margin-top: 1px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .att .chev { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: var(--muted); }
  .att .chev:hover, .att .chev[aria-expanded="true"] { background: var(--hover); color: var(--fg); }
  .att .chev .ic { width: 14px; height: 14px; }
  .pop { position: fixed; z-index: 20; min-width: 180px; padding: 6px; border-radius: 16px; background: var(--pop); border: 1px solid var(--popLine); box-shadow: var(--popShadow); animation: pop .16s cubic-bezier(.2, .8, .2, 1); }
  .pop[hidden] { display: none; }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
  .menuIt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 10px; font-size: 15px; text-align: left; }
  .menuIt:hover { background: var(--hover); }
  .menuIt small { display: block; color: var(--muted); font-size: 13px; }
  .menuIt .ck { margin-left: auto; color: var(--fg); }
  .menuIt:not(.sel) .ck { visibility: hidden; }
  .menuStatic { position: static; display: inline-block; animation: none; }

  /* the clinician's answer: Eva hands over, the doctor's own words with who they are, then what they attached */
  .clin { max-width: min(100%, 470px); padding: 18px 20px; border-radius: 20px; background: var(--card); }
  .clin .txt { white-space: pre-wrap; }
  .doc { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .doc img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
  .doc b { font-size: 15px; font-weight: 500; }
  .doc b em { font-style: normal; color: var(--muted); font-weight: 400; }
  .doc span { display: block; color: var(--muted); font-size: 13px; }

  /* report cards: the report's picture, its date, who it is from */
  .rep { position: relative; display: flex; flex-direction: column; justify-content: space-between; width: 208px; height: 272px; padding: 12px; border-radius: 20px; overflow: hidden; color: #fff; text-align: left; background: #1d1d1c center / cover no-repeat; isolation: isolate; }
  .rep::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0, 0, 0, .1) 0, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, .25) 55%, rgba(0, 0, 0, .86) 100%); }
  .rep .date { align-self: flex-start; padding: 5px 10px; border-radius: 999px; background: rgba(20, 20, 20, .38); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .repBy { display: flex; align-items: center; gap: 8px; padding: 2px; }
  .repBy img, .repBy .repIc { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex: none; }
  .repBy .repIc { display: grid; place-items: center; background: rgba(255, 255, 255, .16); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .repBy b { display: block; font-size: 15px; font-weight: 500; line-height: 1.25; }
  .repBy span { display: block; font-size: 13px; color: rgba(255, 255, 255, .7); }
  .rep:hover { filter: brightness(1.06); }
  .cite { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px 0 10px; border-radius: 999px; background: var(--sec); font-size: 14px; font-weight: 500; vertical-align: middle; }
  .cite:hover { background: var(--secH); }
  .cite .ic { width: 14px; height: 14px; color: var(--muted); }

  /* imaging: a report sheet, a slice, a comparison; on their own or as a group */
  .imgs { display: flex; gap: 8px; }
  .im { position: relative; display: block; height: 176px; border-radius: 14px; overflow: hidden; background: #000; flex: none; }
  .im:hover { filter: brightness(1.12); }
  .im.sheet { width: 124px; background: #f5f7f8; }
  .sheet::before { content: ""; position: absolute; inset: 0; background:
      linear-gradient(#cfe0e8 0 0) 0 0 / 100% 16px no-repeat,
      repeating-linear-gradient(180deg, transparent 0 15px, rgba(0, 40, 60, .13) 15px 16px) 0 16px / 100% 100% no-repeat,
      linear-gradient(90deg, transparent 0 32%, rgba(0, 40, 60, .13) 32% calc(32% + 1px), transparent 0 66%, rgba(0, 40, 60, .13) 66% calc(66% + 1px), transparent 0); }
  .sheet::after { content: ""; position: absolute; inset: 21px 5px 6px; background: repeating-linear-gradient(180deg, transparent 0 4px, rgba(30, 50, 60, .28) 4px 6px, transparent 6px 16px); -webkit-mask-image: linear-gradient(90deg, #000 0 22%, transparent 22% 38%, #000 38% 56%, transparent 56% 72%, #000 72% 86%, transparent 86%); mask-image: linear-gradient(90deg, #000 0 22%, transparent 22% 38%, #000 38% 56%, transparent 56% 72%, #000 72% 86%, transparent 86%); }
  .im.neuro { width: 176px; }
  .im img { width: 100%; height: 100%; object-fit: cover; }
  .im.neuro img { transform: scale(1.3); }   /* the slice, not its black margin */
  .im.cmp { display: flex; width: 352px; gap: 2px; background: #05070a; }
  .im.cmp figure { position: relative; flex: 1; margin: 0; overflow: hidden; }
  .im.cmp img { filter: grayscale(1) sepia(.35) hue-rotate(178deg) saturate(1.8) brightness(1.08) contrast(1.05); transform: scale(1.35); transform-origin: 50% 40%; }
  .im.cmp figure + figure img { transform: scale(1.35) translateX(-2%); filter: grayscale(1) sepia(.35) hue-rotate(178deg) saturate(1.8) brightness(1.15) contrast(1.1); }
  .im .lab { position: absolute; left: 6px; bottom: 6px; padding: 2px 6px; border-radius: 6px; background: rgba(0, 0, 0, .5); color: #fff; font: 10px/1.4 var(--mono); letter-spacing: .02em; }
  .im.sheet .lab { background: rgba(0, 30, 45, .55); }

  /* the picture opened over the page */
  .lb { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 56px 16px 24px; background: rgba(8, 8, 8, .82); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); animation: fade .2s ease; color: #fff; }
  .lb[hidden] { display: none; }
  @keyframes fade { from { opacity: 0; } }
  .lbIn { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 100%; max-height: 100%; }
  .lbIn .im { height: min(60vh, 440px); }
  .lbIn .im.sheet { width: calc(min(60vh, 440px) * .705); }
  .lbIn .im.neuro { width: min(60vh, 440px); }
  .lbIn .im.cmp { width: min(calc(min(60vh, 440px) * 2), calc(100vw - 32px)); }
  .lbIn .rep { width: min(320px, 80vw); height: min(420px, 60vh); }
  .lbCap { text-align: center; max-width: 52ch; }
  .lbCap b { display: block; font-weight: 500; }
  .lbCap span { color: rgba(255, 255, 255, .64); font-size: 13px; }
  .lbX, .lbNav { position: absolute; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, .12); color: #fff; }
  .lbX:hover, .lbNav:hover { background: rgba(255, 255, 255, .2); }
  .lbX { top: 14px; right: 14px; }
  .lbNav { top: 50%; margin-top: -18px; } .lbNav.p { left: 14px; } .lbNav.n { right: 14px; }
  .lbNav[hidden] { display: none; }

  .toast { position: absolute; left: 50%; bottom: 24px; z-index: 40; transform: translate(-50%, 8px); padding: 12px 18px; border-radius: 999px; background: var(--pri); color: var(--priFg); font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .28s cubic-bezier(.2, .8, .2, 1); white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* closed: the chat folded into its launcher */
  .launch { position: absolute; right: 24px; bottom: 24px; z-index: 6; display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 22px 0 16px; border-radius: 999px; background: var(--pri); color: var(--priFg); font-size: 15px; font-weight: 500; box-shadow: 0 10px 30px rgba(0, 0, 0, .2); opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .25s .12s, transform .4s .12s cubic-bezier(.2, .8, .2, 1); }
  .launch .ic { width: 18px; height: 18px; }
  .stage.isClosed .launch { opacity: 1; transform: none; pointer-events: auto; }

  /* the mobile panel: the sidebar as a drawer, the message actions always there */
  .app.mob { grid-template-columns: minmax(0, 1fr); }
  .app.mob .side { position: absolute; z-index: 8; left: 0; top: 0; bottom: 0; width: min(320px, 82%); padding-inline: 14px; transform: translateX(-102%); transition: transform .34s cubic-bezier(.3, .7, .2, 1); background: var(--bg); box-shadow: 0 0 40px rgba(0, 0, 0, .2); }
  /* the drawer ("with the menu opened"): the mark and Concierge, New chat and the Inbox with its count, then Recent, white, an unread one dotted */
  .app.mob .sideHd { margin-bottom: 18px; padding-left: 10px; }
  .app.mob .brand { gap: 10px; font-size: 18px; }
  .app.mob .brand .ic { width: 20px; height: 20px; }
  .app.mob .nav { gap: 2px; }
  .app.mob .item { min-height: 44px; gap: 14px; font-size: 15px; }
  .app.mob .item .ic { width: 20px; height: 20px; }
  .app.mob .recHd { margin: 26px 10px 6px; font-size: 12px; }
  .app.mob .rec .item { color: var(--fg); }
  .app.mob.drawer .side { transform: none; }
  .scrim { position: absolute; inset: 0; z-index: 7; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .app.mob.drawer .scrim { opacity: 1; pointer-events: auto; }
  .app.mob .hd { height: 48px; padding: 0 8px; }
  .app.mob .hd .deskOnly { display: none; }
  .app.mob .hd .mobOnly { display: inline-grid; }
  .app.mob .hd .ttl { color: var(--fg); font-weight: 500; }
  .app.mob .col { padding: 8px 16px 28px; }
  .app.mob .dock { padding: 0 12px 12px; }
  .app.mob .meta { opacity: 1; }
  .app.mob .msg.u .bub { max-width: 86%; }
  .app.mob .apt:not(.cmp), .app.mob .grp, .app.mob .clin { width: 100%; }
  .app.mob .sugs { grid-template-columns: minmax(0, 1fr); }
  .app.mob .home { padding-top: 48px; }
  .app.mob .cats { gap: 8px; margin-top: 8px; }
  .app.mob .cat { flex-direction: column; align-items: flex-start; justify-content: space-between; height: 96px; padding: 16px; gap: 0; }
  .app.mob .catT { white-space: normal; }
  .app.mob .catT > span { display: block; }
  .app.mob .cat .catChev { display: none; }
  .app.mob .disc { margin-top: 22px; }
  .app.mob .attn { margin-top: 40px; }
  .app.mob .chips { --chipX: 16px; }
  .app.mob .im.cmp { width: 300px; }

  /* the components, laid out as the boards lay them out */
  .cmpPage { position: absolute; inset: 0; overflow-y: auto; background: var(--bg); }
  .cmpPage[hidden] { display: none; }
  .cmpIn { max-width: 1240px; margin: 0 auto; padding-inline: 24px; padding-block: 28px 80px; display: grid; gap: 44px; }
  .cmpIn > header h2 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
  .cmpIn > header p { margin: 6px 0 0; max-width: 64ch; color: var(--muted); text-wrap: pretty; }
  .sec { display: grid; gap: 16px; min-width: 0; }
  .sec > h3 { margin: 0; padding-bottom: 10px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 500; }
  .sub { display: grid; gap: 10px; min-width: 0; }
  .sub > span { font: 11px/1 var(--mono); color: var(--faint); letter-spacing: .04em; text-transform: uppercase; }
  .wrapRow { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; }
  .wrapRow > .sub { align-content: start; }
  .wrapRow > .apt:not(.cmp) { width: min(100%, 380px); }
  .rowList { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 16px; }
  .rowList .aRow { padding: 0; }
  .cmpIn .car { max-width: 640px; }

  /* as a page of the prototype (Concierge.embed, from its Viewport): in the XS phone or the S tablet frame, the chat alone filling the screen, its own bar gone, clear of the frame's status bar (--safeT) and home indicator (--safeB);
     on the desk the bar kept for its Chat / Components tabs, the device the prototype's Viewport rather than the switch */
  :root { --safeT: 0px; --safeB: 0px; }
  .emb .bar, .embDesk .bar, .embDoc .bar { display: none; }   /* in the prototype, as a page or as its documentation, no bar of its own ("remove this top bar"): the Components live in Documentation */
  .emb .stage, .embDesk .stage, .embDoc .stage { top: 0; }
  .embDesk .devSeg { display: none; }
  .app.mob .hd { height: calc(48px + var(--safeT)); padding-top: var(--safeT); }
  .emb .app.mob .hd { height: calc(58px + var(--safeT)); padding: calc(1px + var(--safeT)) 16px 9px; gap: 10px; }   /* the Overview's top bar: 16 at the sides, 10 between, 44 round buttons on the same line ("match this nav with the overview nav") */
  .emb .app.mob .hd .iconBtn { width: 44px; height: 44px; } .emb .app.mob .hd .iconBtn svg, .emb .app.mob .hdInbox .ic { width: 20px; height: 20px; }
  .emb .app.mob .hdInbox { height: 44px; padding: 0 10px 0 14px; font-size: 15px; }
  .app.mob .side { padding-top: calc(14px + var(--safeT)); }
  .app.mob .dock { padding-bottom: calc(12px + var(--safeB)); }
  .lb { padding-top: calc(56px + var(--safeT)); } .lbX { top: calc(14px + var(--safeT)); }
  .launch { bottom: calc(24px + var(--safeB)); }
  /* the phone's keyboard, drawn in the XS frame while the field is focused ("make sure keyboard version on focus"): the predictions, four rows, the emoji and the dictation;
     its keys type into the field, return sends; the chat stands on it (the dock above it, the thread shortened) */
  .kbd { display: none; position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--kbBg); color: var(--kInk); user-select: none; -webkit-user-select: none; touch-action: manipulation;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; transform: translateY(100%); visibility: hidden; transition: transform .32s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .32s; }
  .embPhone .kbd { display: block; }
  .kbd.on { transform: none; visibility: visible; transition-delay: 0s; }
  .kPred { display: flex; align-items: center; height: 48px; padding: 0 4px; }
  .kPred span { flex: 1; display: grid; place-items: center; height: 38px; margin: 0 2px; border-radius: 6px; font-size: 17px; cursor: pointer; position: relative; }
  .kPred span + span::before { content: ""; position: absolute; left: -3px; top: 9px; bottom: 9px; border-left: 1px solid rgba(128, 128, 128, .4); }
  .kPred span.cur { background: var(--kSel); }
  .kPred span.cur + span::before { display: none; }
  .kRows { padding: 6px 3px 0; }
  .kr { display: flex; gap: 6px; margin-bottom: 11px; padding: 0 3px; }
  .kr:last-child { margin-bottom: 0; }
  .kr.r2 { padding: 0 22px; }
  .k { flex: 1 1 0; min-width: 0; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 5px; background: var(--kKey); font-size: 22px; line-height: 1; box-shadow: 0 1px 0 rgba(0, 0, 0, .35); cursor: pointer; }
  .k:active { filter: brightness(1.18); }
  .k.fn { flex: 1.45 1 0; background: var(--kFn); font-size: 16px; }
  .k.ab, .k.rt { flex: 2.3 1 0; background: var(--kFn); font-size: 16px; }

<div class="bar" role="toolbar" aria-label="Concierge page">

        <button class="iconBtn collapse" type="button" data-act="sideMin" aria-label="Collapse the sidebar" title="Collapse"></button>

      <div class="hd">

          </div>
        </div>
      </div>

</div>
