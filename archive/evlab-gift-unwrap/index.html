<meta charset="utf-8">
<title>Unwrap your Everlab gift</title>
<!--
  Everlab · gift reveal

  Two folds, one continuous page. State: intro → revealing → gift.

    Fold 1  white. The sender's message alone, resolving letter by letter,
            then a single "See my gift" button.
    Fold 2  dark. Rises from the bottom of the screen as a sheet and pushes
            fold 1 out through the top. Nothing on it but the gift card.

  Components (bottom of file):
    AnimatedQuote  splits the message into characters and resolves them into
                   focus one by one (blur → sharp, 3px rise, ~3s in total)
    GiftIntro      fold 1
    GiftCard       the gift itself, with the photo on its right column
    App            owns the state and the timing of the transition

  Photo on the card's right column: set PHOTO below to a data: URI to ship it
  inside the page (the only way it can load on the artifact host), or pass
  ?image=https://... when the page is hosted by Everlab. With neither, a warm
  low-light gradient stands in.

  The link from the email can carry the gift on the query string. Every field
  is optional and falls back to GIFT_DEFAULTS.

    ?from=Sarah
    &to=Sam
    &message=Happy%2030th%2C%20Sam.%0AGo%20find%20out%20how%20good%0Ayou%20actually%20are.
        (%0A = a deliberate line break in the quote; three lines read best)
    &note=Wishing%20you%20a%20long%2C%20healthy%20life.
    &product=Everlab%20Membership
    &term=12%20months
    &value=%241%2C950%20value
    &includes=Comprehensive%20blood%20panel%7CDoctor%20consultation%7CPersonalised%20plan
        (pipe-separated)
    &claim=https%3A%2F%2Feverlab.com.au%2Factivate%3Fcode%3DEVL-7K2M-QX4
    &image=https%3A%2F%2F...  (photo for the card; http(s) only)

  All text is inserted with textContent, never innerHTML.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap">
<style>
  /* Two deliberate worlds, painted explicitly: a white letter, then a dark room. */
  :root{
    /* fold 1 */
    --white:#FCFBF9;
    --ink:#171412;
    --ember:#E0883A;   /* the colour a letter has while it's still out of focus */
    --btn:#171412;
    --btn-ink:#FCFBF9;

    /* fold 2 */
    --night:#0E0C0B;
    --card:#161312;
    --card-hair:rgba(255,255,255,.09);
    --ink-d:#F3EFEA;
    --ink-d2:#B9B0A8;
    --muted-d:#7D746D;
    --hair-d:rgba(255,255,255,.10);
    --red:#C4655B;
    --btn-d:#F3EFEA;
    --btn-d-ink:#0E0C0B;
    --glow-a:rgba(222,150,84,.20);
    --glow-b:rgba(180,87,78,.12);

    --ease-scene:cubic-bezier(.58,.02,.18,1);
    --ease-out:cubic-bezier(.22,.61,.24,1);
    /* the sequence after the click:
         0ms      message and button fade out
         200ms    the viewport starts crossfading to dark (1300ms)
         1000ms   the card starts rising from the bottom (1400ms)
         2400ms   settled */
    --fade-ms:650ms;
    --bg-delay:200ms;
    --bg-ms:1300ms;
    --card-delay:1000ms;
    --card-ms:1400ms;

    --sans:'Suisse Intl','Geist','Helvetica Neue',Helvetica,Arial,sans-serif;
    color-scheme:light;
  }

  *{box-sizing:border-box;}
  html{height:100%;}
  body{
    margin:0;min-height:100%;
    background:var(--white);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overflow:hidden;
    transition:background-color var(--bg-ms) ease var(--bg-delay);
  }
  body[data-state="revealing"],
  body[data-state="gift"]{background:var(--night);color-scheme:dark;}

  /* warm glow that belongs to the dark room; fades in with the background */
  .glow{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(70% 50% at 50% -10%, var(--glow-a), transparent 70%),
      radial-gradient(50% 40% at 50% 110%, var(--glow-b), transparent 70%);
    opacity:0;
    transition:opacity var(--bg-ms) ease var(--bg-delay);
  }
  body[data-state="revealing"] .glow,
  body[data-state="gift"] .glow{opacity:1;}

  :focus-visible{outline:2px solid currentColor;outline-offset:4px;border-radius:999px;}

  /* ---- fold 1 ---- */
  .intro{
    position:fixed;inset:0;z-index:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;
  }
  /* on click the message and button simply dissolve; the room changes around them */
  .intro .quote, .intro .cta{transition:opacity var(--fade-ms) ease, filter var(--fade-ms) ease;}
  body[data-state="revealing"] .intro{pointer-events:none;}
  body[data-state="revealing"] .intro .quote,
  body[data-state="revealing"] .intro .cta{opacity:0 !important;filter:blur(4px) !important;}
  body[data-state="gift"] .intro{display:none;}

  .quote{
    margin:0;
    max-width:min(92vw, 14em);
    text-align:center;
    font-weight:500;
    font-size:clamp(29px, 4.2vw + 12px, 64px);
    line-height:1.04;
    letter-spacing:-.034em;
    color:var(--ink);
    text-wrap:balance;
  }
  .quote .w{white-space:nowrap;}
  /* each letter arrives as a warm orange glow out of focus, then cools to ink */
  .quote .c{
    position:relative;display:inline;
    opacity:0;top:3px;filter:blur(7px);
    color:var(--ember);
    animation:resolve 1200ms var(--ease-out) both;
    animation-delay:var(--d);
  }
  @keyframes resolve{
    0%{opacity:0;top:3px;filter:blur(8px);color:var(--ember);text-shadow:0 0 22px rgba(232,140,60,.65);}
    45%{opacity:.9;color:var(--ember);text-shadow:0 0 14px rgba(232,140,60,.35);}
    100%{opacity:1;top:0;filter:blur(0);color:var(--ink);text-shadow:0 0 0 rgba(232,140,60,0);}
  }

  .pill{
    appearance:none;border:0;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--sans);font-weight:500;font-size:15px;letter-spacing:-.004em;
    color:var(--btn-ink);background:var(--btn);
    padding:13px 26px;border-radius:999px;
    text-decoration:none;
    transition:transform .35s var(--ease-out), background-color .35s var(--ease-out),
               opacity .7s var(--ease-out), filter .7s var(--ease-out);
  }
  .pill:hover{transform:translateY(-1px) scale(1.015);background:#2A2522;}
  .pill:active{transform:scale(.985);}

  .intro .cta{
    margin-top:clamp(40px, 6vh, 64px);
    opacity:0;transform:translateY(10px);filter:blur(3px);
    transition:opacity .8s var(--ease-out), transform .8s var(--ease-out), filter .8s var(--ease-out);
  }
  .intro.cta-in .cta{opacity:1;transform:none;filter:none;}

  /* ---- fold 2: the dark room; the card rises into it from the bottom ---- */
  .gift{
    position:fixed;inset:0;z-index:2;
    overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    color:var(--ink-d);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:clamp(28px, 6vh, 64px) 24px;
    visibility:hidden;
  }
  body[data-state="revealing"] .gift,
  body[data-state="gift"] .gift{visibility:visible;}

  .card{
    width:100%;max-width:900px;
    flex:none;
    margin:auto 0;
    background:var(--card);
    border-radius:24px;
    display:grid;grid-template-columns:1fr 1fr;
    overflow:hidden;
    transform:translateY(110vh);
    will-change:transform;
    transition:transform var(--card-ms) var(--ease-scene) var(--card-delay);
  }
  body[data-state="revealing"] .card,
  body[data-state="gift"] .card{transform:none;}

  .card .info{padding:44px 44px 40px;display:flex;flex-direction:column;min-height:520px;}
  .kicker{
    display:flex;justify-content:space-between;align-items:baseline;gap:16px;
    margin:0 0 28px;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-d);font-weight:500;
  }
  .kicker b{font-weight:500;color:var(--ink-d2);}
  .card h2{
    margin:0 0 8px;
    font-weight:500;
    font-size:clamp(28px, 1.6vw + 16px, 38px);line-height:1.04;letter-spacing:-.03em;
    color:var(--ink-d);
    text-wrap:balance;
  }
  .term{margin:0 0 28px;color:var(--ink-d2);font-size:15px;}
  .incl{list-style:none;margin:0 0 30px;padding:0;border-top:1px solid var(--hair-d);}
  .incl li{
    display:flex;gap:14px;align-items:baseline;
    padding:12px 0;border-bottom:1px solid var(--hair-d);
    font-size:15px;color:var(--ink-d);
  }
  .incl li::before{
    content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--red);
    transform:translateY(-2px);
  }
  .note{
    margin:0 0 32px;
    font-weight:300;font-size:17px;line-height:1.45;letter-spacing:-.01em;color:var(--ink-d2);
    text-wrap:pretty;
  }
  .note .who{display:block;margin-top:8px;font-size:14px;color:var(--muted-d);font-weight:400;}
  .act{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:auto;}
  .act .pill{color:var(--btn-d-ink);background:var(--btn-d);}
  .act .pill:hover{background:#FFFFFF;}
  .fine{font-size:13px;color:var(--muted-d);}

  /* right column: the photograph, or until it ships, a composed stand-in of
     the same scene: a phone on oak in low warm light */
  .visual{
    position:relative;min-height:520px;overflow:hidden;
    background:
      radial-gradient(55% 45% at 72% 26%, rgba(240,178,104,.62), transparent 70%),
      radial-gradient(70% 60% at 15% 95%, rgba(18,10,6,.75), transparent 70%),
      linear-gradient(160deg, #8F5C2F 0%, #6A4222 45%, #30190E 100%);
    background-size:cover;background-position:center;
  }
  .visual.photo{background-size:cover;background-position:center;}
  .visual.photo .scene{display:none;}
  .scene{position:absolute;inset:0;}
  .scene .grain{
    position:absolute;inset:-20%;
    background:repeating-linear-gradient(97deg, rgba(255,235,210,.05) 0 2px, transparent 2px 9px, rgba(40,20,8,.08) 9px 11px, transparent 11px 23px);
    mix-blend-mode:soft-light;
  }
  .scene .shadow{
    position:absolute;left:18%;top:40%;width:54%;height:70%;
    background:radial-gradient(50% 50% at 50% 50%, rgba(20,10,5,.6), transparent 70%);
    transform:rotate(-14deg) translate(8%, 10%);
  }
  .phone{
    position:absolute;left:50%;top:50%;
    width:min(46%, 190px);aspect-ratio:9/19;
    transform:translate(-56%,-46%) rotate(-14deg);
    background:#0B0A0A;border-radius:14% / 6.6%;
    border:2px solid #23201E;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.06) inset;
    padding:9% 8%;
    display:flex;flex-direction:column;
    color:#E9E2DA;font-size:clamp(7px, .55vw + 4px, 9px);
  }
  .phone .st{display:flex;justify-content:space-between;color:#A39B93;font-size:.9em;margin-bottom:12%;}
  .phone .hd{color:#D9D1C8;font-size:1.05em;margin-bottom:10%;}
  .phone .heart{width:38%;margin:0 auto 6%;display:block;}
  .phone .big{text-align:center;font-size:3.4em;line-height:1;letter-spacing:-.04em;color:#F3EFEA;font-weight:300;}
  .phone .cap{text-align:center;color:#9E958C;font-size:.9em;margin-top:6%;}
  .phone .tabs{display:flex;justify-content:space-around;gap:4%;white-space:nowrap;color:#7C746C;font-size:.8em;margin:12% 0 8%;}
  .phone .tabs b{color:#E9E2DA;font-weight:400;}
  .phone .tile{margin-top:auto;background:#151312;border-radius:10px;padding:8% 9%;}
  .phone .tile small{display:block;color:#7C746C;font-size:.8em;letter-spacing:.1em;}
  .phone .tile b{display:block;font-weight:400;font-size:1.3em;margin:3% 0 8%;}
  .phone .bars{display:flex;align-items:flex-end;gap:7%;height:22px;}
  .phone .bars i{flex:1;background:#DCD4CB;border-radius:2px;opacity:.85;}
  .visual::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg, rgba(14,12,11,.30), transparent 30%);
    pointer-events:none;
  }

  .foot{
    margin:28px 0 0;flex:none;
    display:flex;align-items:center;gap:10px;
    font-size:13px;color:var(--muted-d);
    opacity:0;transform:translateY(8px);
    transition:opacity .9s var(--ease-out) 2200ms, transform .9s var(--ease-out) 2200ms;
  }
  body[data-state="revealing"] .foot,
  body[data-state="gift"] .foot{opacity:1;transform:none;}
  .foot svg rect{fill:var(--muted-d);}
  .foot b{font-weight:500;color:var(--ink-d2);}

  @media (max-width:820px){
    .card{grid-template-columns:1fr;max-width:560px;margin:0;}
    .visual{order:-1;min-height:min(58vw, 320px);}
    .visual::after{background:linear-gradient(180deg, transparent 60%, rgba(22,19,18,.6));}
    .phone{width:min(34%, 150px);transform:translate(-50%,-42%) rotate(-14deg);}
    .card .info{padding:30px 26px 28px;min-height:0;}
    .gift{justify-content:flex-start;padding:24px 20px 40px;}
    .intro{padding:24px 22px;}
    .intro .cta{margin-top:44px;}
  }

  @media (prefers-reduced-motion: reduce){
    .quote .c{animation:none;opacity:1;top:0;filter:none;color:var(--ink);text-shadow:none;}
    .intro .quote, .intro .cta, .card, .foot, body, .glow{transition-duration:.3s !important;transition-delay:0s !important;}
    .intro .cta{opacity:1;transform:none;filter:none;}
    .card{transform:none;opacity:0;transition-property:opacity;}
    body[data-state="revealing"] .card, body[data-state="gift"] .card{opacity:1;}
  }
</style>

<div class="glow" aria-hidden="true"></div>

<!-- Fold 1 · GiftIntro -->
<section class="intro" id="intro" aria-label="A message from the sender">
  <p class="quote" id="quote"></p>
  <div class="cta">
    <button class="pill" id="see" type="button">See my gift</button>
  </div>
</section>

<!-- Fold 2 · the gift -->
<main class="gift" id="gift" aria-hidden="true">
  <article class="card" id="card" aria-label="Your gift">
    <div class="info">
      <p class="kicker"><span>A gift from <b id="fromName"></b></span><span id="value"></span></p>
      <h2 id="product" tabindex="-1"></h2>
      <p class="term" id="term"></p>
      <ul class="incl" id="includes"></ul>
      <p class="note"><span id="noteText"></span><span class="who" id="noteWho"></span></p>
      <div class="act">
        <a class="pill" id="claim" href="#">Activate my gift</a>
        <span class="fine">Takes a couple of minutes. Nothing to pay.</span>
      </div>
    </div>
    <div class="visual" id="visual" role="img" aria-label="A phone showing Everlab health insights on a wooden table in warm evening light">
      <div class="scene" aria-hidden="true">
        <div class="grain"></div>
        <div class="shadow"></div>
        <div class="phone">
          <div class="st"><span>9:41</span><span>●●●</span></div>
          <div class="hd">Health insights</div>
          <svg class="heart" viewBox="0 0 40 36" aria-hidden="true">
            <path d="M20 33C9 25 3 19 3 11.5 3 6.5 7 3 11.5 3c3.5 0 6.5 2 8.5 5 2-3 5-5 8.5-5C33 3 37 6.5 37 11.5 37 19 31 25 20 33z"
                  fill="none" stroke="#B4574E" stroke-width="1.2" stroke-dasharray="1.2 2.1" opacity=".85"/>
          </svg>
          <div class="big">44</div>
          <div class="cap">4 years older</div>
          <div class="tabs"><span>Biological</span><b>Heart age</b><span>Lung</span></div>
          <div class="tile">
            <small>STEPS</small><b>2,568</b>
            <div class="bars"><i style="height:45%"></i><i style="height:52%"></i><i style="height:40%"></i><i style="height:62%"></i><i style="height:58%"></i><i style="height:100%"></i><i style="height:30%"></i></div>
          </div>
        </div>
      </div>
    </div>
  </article>

  <p class="foot">
    <svg width="13" height="13" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="12" height="2.6" rx="1.3"/><rect x="1" y="7.7" width="16" height="2.6" rx="1.3"/><rect x="3" y="13.4" width="12" height="2.6" rx="1.3"/></svg>
    <span>everlab &nbsp;·&nbsp; Sent privately to <b id="toName"></b></span>
  </p>
</main>

<script>
(function(){
  'use strict';

  /* Paste a data: URI here to ship the card photo inside the page. */
  var PHOTO = '';

  var GIFT_DEFAULTS = {
    from: 'Sarah',
    to: 'Sam',
    message: 'Happy 30th, Sam.\nGo find out how good\nyou actually are.',
    note: 'Thirty looks good on you. Now go and see what’s going on inside.',
    product: 'Everlab Membership',
    term: 'Twelve months of testing, doctors and insights',
    value: '$1,950 value',
    includes: [
      'Comprehensive blood panel across 100+ biomarkers',
      'Consultation with an Everlab doctor',
      'Personalised health plan and ongoing insights'
    ],
    claim: 'https://everlab.com.au/',
    image: ''
  };

  var params = new URLSearchParams(location.search);
  function pick(key){
    var v = params.get(key);
    return (v && v.trim()) ? v.trim() : GIFT_DEFAULTS[key];
  }
  var gift = {
    from: pick('from'), to: pick('to'), message: pick('message'), note: pick('note'),
    product: pick('product'), term: pick('term'), value: pick('value'),
    includes: params.get('includes')
      ? params.get('includes').split('|').map(function(s){ return s.trim(); }).filter(Boolean)
      : GIFT_DEFAULTS.includes,
    claim: pick('claim'),
    image: pick('image')
  };
  if(!/^https?:\/\//i.test(gift.claim)) gift.claim = GIFT_DEFAULTS.claim;
  if(gift.image && !/^https?:\/\//i.test(gift.image)) gift.image = '';

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function(id){ return document.getElementById(id); };

  /* ---------- AnimatedQuote ----------
     Characters resolve into focus one after another. The stagger is derived
     from the character count so any message lands in about three seconds.
     Words are kept unbreakable; authored line breaks (\n) are honoured. */
  function AnimatedQuote(el, text, opts){
    var startAt = opts.startAt, finishStartsBy = opts.finishStartsBy, charMs = opts.charMs;
    var lines = text.split('\n');
    var count = 0;
    lines.forEach(function(l){ count += l.replace(/\s+/g,'').length; });
    var stagger = count > 1 ? (finishStartsBy - startAt) / (count - 1) : 0;

    var i = 0;
    var frag = document.createDocumentFragment();
    lines.forEach(function(line, li){
      var words = line.split(/\s+/).filter(Boolean);
      words.forEach(function(word, wi){
        var w = document.createElement('span');
        w.className = 'w';
        Array.prototype.forEach.call(word, function(ch){
          var c = document.createElement('span');
          c.className = 'c';
          c.textContent = ch;
          c.style.setProperty('--d', Math.round(startAt + i * stagger) + 'ms');
          w.appendChild(c);
          i++;
        });
        frag.appendChild(w);
        if(wi < words.length - 1) frag.appendChild(document.createTextNode(' '));
      });
      if(li < lines.length - 1) frag.appendChild(document.createElement('br'));
    });
    el.textContent = '';
    el.appendChild(frag);
    el.setAttribute('aria-label', text.replace(/\n/g,' '));

    return { done: reduce ? 0 : finishStartsBy + charMs };
  }

  /* ---------- GiftIntro ---------- */
  function GiftIntro(root, gift, onSee){
    // letters start at 0.3s, the last begins at 3.0s and settles by ~4.2s
    var quote = AnimatedQuote($('quote'), gift.message, {
      startAt: 300, finishStartsBy: 3000, charMs: 1200
    });
    // the button rises ~450ms after the last character settles
    setTimeout(function(){ root.classList.add('cta-in'); }, reduce ? 0 : quote.done + 450);
    $('see').addEventListener('click', onSee);
  }

  /* ---------- GiftCard ---------- */
  function GiftCard(gift){
    $('fromName').textContent = gift.from;
    $('toName').textContent = gift.to;
    $('value').textContent = gift.value;
    $('product').textContent = gift.product;
    $('term').textContent = gift.term;
    $('noteText').textContent = '“' + gift.note + '”';
    $('noteWho').textContent = '— ' + gift.from;
    $('claim').href = gift.claim;
    var list = $('includes');
    gift.includes.forEach(function(item){
      var li = document.createElement('li');
      li.textContent = item;
      list.appendChild(li);
    });
    var src = gift.image || PHOTO;
    if(src){
      var v = $('visual');
      v.classList.add('photo');
      v.style.backgroundImage = 'url("' + src.replace(/["\\]/g, '') + '")';
    }
  }

  /* ---------- App: intro → revealing → gift ---------- */
  var SCENE_MS = 2400; // card-delay + card-ms, see the CSS tokens
  var state = 'intro';
  function setState(next){
    state = next;
    document.body.dataset.state = next;
    $('gift').setAttribute('aria-hidden', next === 'intro' ? 'true' : 'false');
  }

  function reveal(){
    if(state !== 'intro') return;
    setState('revealing');
    $('see').disabled = true;
    setTimeout(function(){
      setState('gift');
      $('product').focus({ preventScroll: true });
    }, reduce ? 320 : SCENE_MS);
  }

  setState('intro');
  GiftCard(gift);
  GiftIntro($('intro'), gift, reveal);
})();
</script>
