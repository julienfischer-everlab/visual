<meta charset="utf-8">
<title>Unwrap your Everlab gift</title>
<!--
  Everlab · gift reveal

  Two folds, one continuous page. State: intro → revealing → gift.

    Fold 1  white. The sender's message alone, resolving letter by letter,
            then a single "See my gift" button.
    Fold 2  dark. Rises from the bottom of the screen as a sheet and pushes
            fold 1 out through the top. Nothing on it but the gift card.

  Components (bottom of file):
    AnimatedQuote  splits the message into characters and resolves them into
                   focus one by one (blur → sharp, 3px rise, ~3s in total)
    GiftIntro      fold 1
    GiftCard       the gift itself, with the photo on its right column
    App            owns the state and the timing of the transition

  The photograph behind fold 2 (it peeks through a half circle at the bottom
  of fold 1, then the circle opens to fill the screen): set PHOTO below to a
  data: URI to ship it inside the page (the only way it can load on the
  artifact host), or pass ?image=https://... when the page is hosted by
  Everlab. With neither, a warm living-room gradient stands in.

  The link from the email can carry the gift on the query string. Every field
  is optional and falls back to GIFT_DEFAULTS.

    ?from=Matt
    &to=Sam
    &message=Happy%2030th%2C%20Sam.%0AGo%20find%20out%20how%20good%0Ayou%20actually%20are.
        (%0A = a deliberate line break in the quote; three lines read best)
    &note=Wishing%20you%20a%20long%2C%20healthy%20life.
    &product=Everlab%20Membership
    &blurb=Twelve%20months%20of%20Everlab...        (the description in the card)
    &value=%241%2C950                               (total value, shown large in the card)
    &includes=A%2045-minute%20onboarding%20consult%7CAdvanced%20blood%20panel%7CDEXA%20scan
        (pipe-separated; each item is one line on desktop, so keep them short)
    &steps=Claim%20your%20gift%7CEnter%20your%20details;Meet%20your%20doctor%7CA%2045-minute%20consult
        (semicolon-separated steps, each "Title|Description")
    &claim=https%3A%2F%2Feverlab.com.au%2Factivate%3Fcode%3DEVL-7K2M-QX4
    &image=https%3A%2F%2F...  (the photograph behind fold 2; http(s) only)

  All text is inserted with textContent, never innerHTML.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap">
<style>
  /* Two deliberate worlds, painted explicitly: a white letter, then a dark room. */
  :root{
    /* fold 1 */
    --white:#FCFBF9;
    --ink:#171412;
    --ember:#D98B4A;   /* the colour a letter has while it's still out of focus */
    --ember-strength:.5;    /* how much of it shows: 1 is full orange, 0 is none */
    --btn:#171412;
    --btn-ink:#FCFBF9;

    /* fold 2 */
    --night:#0E0C0B;
    --card:#161312;
    --card-hair:rgba(255,255,255,.09);
    --ink-d:#F3EFEA;
    --ink-d2:#B9B0A8;
    --muted-d:#7D746D;
    --hair-d:rgba(255,255,255,.10);
    --red:#C4655B;
    --btn-d:#F3EFEA;
    --btn-d-ink:#0E0C0B;
    --glow-a:rgba(222,150,84,.20);
    --glow-b:rgba(180,87,78,.12);

    /* the fold transition: a long slow start, then it commits fast and settles */
    --ease-scene:cubic-bezier(.9,0,.22,1);
    --ease-out:cubic-bezier(.22,.61,.24,1);
    /* the sequence after the click:
         0ms      the whole first-fold block scrolls up and out of the viewport (800ms)
         100ms    the viewport starts crossfading to dark (700ms)
         100ms    the card starts rising from the bottom at the same moment (1000ms)
         1100ms   settled */
    --fade-ms:800ms;
    --bg-delay:100ms;
    --bg-ms:700ms;
    --card-delay:100ms;
    --card-ms:1000ms;
    /* and in reverse (the arrow on fold 2):
         0ms      the card sinks back below the bottom edge (750ms)
         0ms      the viewport crossfades back to white at the same moment (700ms)
         400ms    the block settles back down into place (750ms)
         1150ms   settled */
    --back-card-ms:750ms;
    --back-bg-delay:0ms;
    --back-text-delay:400ms;
    --back-text-ms:750ms;

    --sans:'Suisse Intl','Geist','Helvetica Neue',Helvetica,Arial,sans-serif;
    color-scheme:light;
  }

  *{box-sizing:border-box;}
  html{height:100%;}
  body{
    margin:0;min-height:100%;
    background:var(--white);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overflow:hidden;
    transition:background-color var(--bg-ms) ease var(--bg-delay);
  }
  body[data-state="revealing"],
  body[data-state="gift"]{background:var(--night);color-scheme:dark;}
  body[data-state="returning"]{background:var(--white);transition-delay:var(--back-bg-delay);}

  /* the photograph behind fold 2. On fold 1 only the top of a circle shows at
     the bottom edge, like a sun about to rise; on click the circle opens
     until it fills the viewport and becomes the room. */
  /* The circle IS the photograph: a round element centred on the bottom edge
     whose background is the image. Closed, it is a small circle holding the
     photo at half size (the couple sits in the dome); open, it is a circle
     large enough to cover the viewport, holding the photo at exactly the size
     and position of a full-screen cover. Because the image is the element's
     own background, it can never show an edge inside the circle. The sizes
     and offsets are computed in JS (layoutScene) and written as custom
     properties, so every one of them interpolates. */
  .scene-bg{
    position:fixed;left:50%;top:100%;z-index:1;pointer-events:none;
    width:var(--d0);height:var(--d0);
    /* hidden until the message and the button have landed, then it scales up */
    transform:translate(-50%,-50%) scale(0);
    border-radius:50%;
    overflow:hidden;
    /* stand-in until the photo ships: a cosy wood-toned living room in low warm light */
    background-image:
      radial-gradient(38% 30% at 70% 22%, rgba(255,196,120,.55), transparent 70%),
      radial-gradient(60% 40% at 25% 85%, rgba(20,10,5,.7), transparent 70%),
      radial-gradient(70% 60% at 55% 60%, rgba(140,88,44,.5), transparent 70%),
      linear-gradient(180deg, #4A2E1B 0%, #2E1B10 55%, #150C08 100%);
    background-color:#2E1B10;
    background-repeat:no-repeat;
    background-size:var(--bw0) var(--bh0);
    background-position:var(--bx0) var(--by0);
    transition:
      transform 1100ms cubic-bezier(.2,.7,.2,1),
      width var(--card-ms) var(--ease-scene) var(--bg-delay),
      height var(--card-ms) var(--ease-scene) var(--bg-delay),
      background-size var(--card-ms) var(--ease-scene) var(--bg-delay),
      background-position var(--card-ms) var(--ease-scene) var(--bg-delay);
  }
  body.orb-in .scene-bg{transform:translate(-50%,-50%) scale(1);}
  body[data-state="revealing"] .scene-bg,
  body[data-state="gift"] .scene-bg{
    width:var(--d1);height:var(--d1);
    background-size:var(--bw1) var(--bh1);
    background-position:var(--bx1) var(--by1);
  }
  body[data-state="returning"] .scene-bg{transition-duration:var(--back-card-ms);transition-delay:0s;}
  /* a light dim on the peeking photo, so it sits back from the white page */
  .scene-bg::after{
    content:"";position:absolute;inset:0;background:rgba(14,12,11,.22);
    transition:opacity var(--card-ms) ease var(--bg-delay);
  }
  body[data-state="revealing"] .scene-bg::after,
  body[data-state="gift"] .scene-bg::after{opacity:0;}
  /* the room's darkening, viewport-relative so the columns below read;
     comes up as the circle opens */
  .dim{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg, rgba(14,12,11,.45), rgba(14,12,11,.62) 55%, rgba(14,12,11,.85));
    opacity:0;
    transition:opacity var(--card-ms) ease var(--bg-delay);
  }
  body[data-state="revealing"] .dim,
  body[data-state="gift"] .dim{opacity:1;}
  body[data-state="returning"] .dim,
  body[data-state="returning"] .scene-bg::after{transition-duration:var(--back-card-ms);transition-delay:0s;}

  /* warm glow that belongs to the dark room; fades in with the background */
  .glow{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(70% 50% at 50% -10%, var(--glow-a), transparent 70%),
      radial-gradient(50% 40% at 50% 110%, var(--glow-b), transparent 70%);
    opacity:0;
    transition:opacity var(--bg-ms) ease var(--bg-delay);
  }
  body[data-state="revealing"] .glow,
  body[data-state="gift"] .glow{opacity:1;}
  body[data-state="returning"] .glow{opacity:0;transition-delay:var(--back-bg-delay);}

  :focus-visible{outline:2px solid currentColor;outline-offset:4px;border-radius:999px;}

  /* ---- fold 1 ---- */
  .intro{
    position:fixed;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;
  }
  /* on click the whole block scrolls up and out of the viewport, like the
     page being pushed; the room changes behind it */
  .stack{
    display:flex;flex-direction:column;align-items:center;
    will-change:transform;
    transition:transform var(--fade-ms) var(--ease-scene);
  }
  body[data-state="revealing"] .intro,
  body[data-state="gift"] .intro{pointer-events:none;}
  body[data-state="revealing"] .stack,
  body[data-state="gift"] .stack{transform:translateY(-110vh);}
  body[data-state="gift"] .intro{visibility:hidden;}
  /* coming back: the block scrolls back down into place once the room is light again */
  body[data-state="returning"] .stack{
    transform:none;
    transition:transform var(--back-text-ms) var(--ease-scene) var(--back-text-delay);
  }

  .quote{
    margin:0;
    max-width:min(92vw, 14em);
    text-align:center;
    font-weight:500;
    font-size:clamp(29px, 4.2vw + 12px, 64px);
    /* 6px tighter than .98; floored at .8em so lines never overlap on phones */
    line-height:max(calc(.98em - 6px), .8em);
    letter-spacing:-.034em;
    color:var(--ink);
    text-wrap:balance;
  }
  .quote .w{white-space:nowrap;}
  /* each line is a row that opens from nothing shortly before its letters
     start, so the centred block grows from the middle: the first line is
     pushed up by the second, both by the third */
  .quote .line{
    display:grid;grid-template-rows:0fr;
    animation:line-open 650ms var(--ease-out) var(--ld, 0ms) both;
  }
  .quote .line-in{min-height:0;}
  @keyframes line-open{from{grid-template-rows:0fr;}to{grid-template-rows:1fr;}}
  /* each letter comes up quickly, then takes its time sharpening out of the
     blur. The warmth is a separate animation lasting three stagger steps
     (--stag × 3) and fading linearly, so at any moment the newest letter is
     warmest, the one before it less, the one before that barely: a short
     gradient trailing the leading edge. --e lets the last word carry less of
     it; --dur is the sharpening time. */
  .quote .c{
    position:relative;display:inline;
    opacity:0;top:3px;filter:blur(7px);
    --warm:color-mix(in srgb, var(--ember) calc(var(--e, 100%) * var(--ember-strength)), var(--ink));
    --halo:color-mix(in srgb, rgba(217,139,74,.4) calc(var(--e, 100%) * var(--ember-strength)), transparent);
    color:var(--ink);
    animation:
      resolve var(--dur, 1000ms) cubic-bezier(.3,.5,.2,1) var(--d) both,
      ember calc(var(--stag, 60ms) * 3) linear var(--d) both;
  }
  @keyframes resolve{
    0%{opacity:0;top:3px;filter:blur(7px);}
    22%{opacity:.75;top:2px;filter:blur(5px);}
    100%{opacity:1;top:0;filter:blur(0);}
  }
  @keyframes ember{
    0%{color:var(--warm);text-shadow:0 0 12px var(--halo);}
    100%{color:var(--ink);text-shadow:0 0 0 rgba(232,140,60,0);}
  }

  /* a plain mono line above the message: a black square, then who sent it */
  .chip{
    margin:0 0 clamp(26px, 4vh, 40px);
    display:inline-flex;align-items:center;gap:12px;
    font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink);
    opacity:0;transform:translateY(4px);
    animation:chip-in 700ms var(--ease-out) 80ms both;
  }
  .chip::before{content:"";width:7px;height:7px;background:var(--ink);}
  @keyframes chip-in{to{opacity:1;transform:none;}}
  /* the eyebrow's letters resolve the same way as the message, ahead of it */
  .chip .c{
    position:relative;display:inline;
    opacity:0;top:2px;filter:blur(5px);
    --warm:color-mix(in srgb, var(--ember) calc(var(--e, 100%) * var(--ember-strength)), var(--ink));
    --halo:color-mix(in srgb, rgba(217,139,74,.4) calc(var(--e, 100%) * var(--ember-strength)), transparent);
    color:var(--ink);
    animation:
      resolve var(--dur, 700ms) cubic-bezier(.3,.5,.2,1) var(--d) both,
      ember calc(var(--stag, 40ms) * 3) linear var(--d) both;
  }
  .chip .w{white-space:nowrap;}

  .pill{
    appearance:none;border:0;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--sans);font-weight:500;font-size:15px;letter-spacing:-.004em;
    color:var(--btn-ink);background:var(--btn);
    padding:13px 26px;border-radius:999px;
    text-decoration:none;
    transition:transform .35s var(--ease-out), background-color .35s var(--ease-out),
               opacity .7s var(--ease-out), filter .7s var(--ease-out);
  }
  .pill:hover{transform:translateY(-1px) scale(1.015);background:#2A2522;}
  .pill:active{transform:scale(.985);}

  .intro .cta{
    margin-top:clamp(40px, 6vh, 64px);
    opacity:0;transform:translateY(8px);filter:blur(3px);
    transition:opacity .7s var(--ease-out), transform .7s var(--ease-out), filter .7s var(--ease-out);
  }
  .intro.cta-in .cta{opacity:1;transform:none;filter:none;}

  /* ---- fold 2: the dark room; the card rises into it from the bottom ---- */
  .gift{
    position:fixed;inset:0;z-index:3;
    overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    color:var(--ink-d);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:0 24px 48px;
    visibility:hidden;
  }
  /* the card lands in the centre of the first screen; the columns wait below */
  .hero{
    width:100%;min-height:100svh;flex:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
    padding:84px 0 24px;  /* room for the arrow above the card */
  }
  body[data-state="revealing"] .gift,
  body[data-state="gift"] .gift,
  body[data-state="returning"] .gift{visibility:visible;}

  /* the way back up */
  .back{
    position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:4;
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    appearance:none;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);
    color:var(--ink-d2);cursor:pointer;
    opacity:0;pointer-events:none;
    /* appears once the card has landed (the gift state starts as it settles) */
    transition:opacity .8s var(--ease-out) 250ms, background-color .3s ease, color .3s ease, border-color .3s ease;
  }
  .back:hover{background:rgba(255,255,255,.09);color:var(--ink-d);border-color:rgba(255,255,255,.18);}
  .back svg{display:block;}
  body[data-state="gift"] .back{opacity:1;pointer-events:auto;}
  body[data-state="returning"] .back{opacity:0;transition-delay:0s;transition-duration:.4s;}

  .card{
    position:relative;
    width:100%;max-width:1080px;
    flex:none;
    margin:0;
    background:rgba(22,19,18,.66);
    -webkit-backdrop-filter:blur(44px) saturate(1.15);backdrop-filter:blur(44px) saturate(1.15);
    border-radius:36px;
    display:grid;grid-template-columns:minmax(0, 1.25fr) minmax(0, 1fr);
    overflow:hidden;
    transform:translateY(110vh);
    will-change:transform;
    transition:transform var(--card-ms) var(--ease-scene) var(--card-delay);
  }
  body[data-state="revealing"] .card,
  body[data-state="gift"] .card{transform:none;}
  body[data-state="returning"] .card{transform:translateY(110vh);transition:transform var(--back-card-ms) var(--ease-scene) 0s;}

  .card .info{padding:48px 48px;display:flex;flex-direction:column;justify-content:flex-start;min-height:580px;min-width:0;}
  .kicker{
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    margin:0 0 28px;
  }
  .mono-label{
    margin:0;
    font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-d);
  }
  .blurb{
    margin:0 0 30px;max-width:30em;
    font-size:15.5px;line-height:1.55;color:var(--ink-d2);
    text-wrap:pretty;
  }
  .value{display:flex;flex-direction:column;gap:6px;margin:0 0 30px;}
  .value b{
    font-weight:500;font-size:clamp(26px, 1.4vw + 16px, 34px);line-height:1;letter-spacing:-.03em;
    color:var(--ink-d);font-variant-numeric:tabular-nums;
  }

  /* the journey: square, line, square, line ... with a title under each */
  .timeline{
    list-style:none;margin:12px 0 0;padding:0 8px;
    width:100%;max-width:820px;
    display:flex;align-items:flex-start;
    opacity:0;transform:translateY(10px);
    transition:opacity .8s var(--ease-out) 1250ms, transform .8s var(--ease-out) 1250ms;
  }
  body[data-state="revealing"] .timeline,
  body[data-state="gift"] .timeline{opacity:1;transform:none;}
  body[data-state="returning"] .timeline{opacity:0;transition-delay:0s;transition-duration:.3s;}
  .timeline li{
    position:relative;flex:1;min-width:0;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    text-align:center;
  }
  .timeline li i{
    display:block;width:10px;height:10px;flex:none;
    border:1.5px solid rgba(243,239,234,.45);background:transparent;
  }
  .timeline li.now i{background:var(--red);border-color:var(--red);}
  .timeline li span{font-size:13px;color:var(--muted-d);padding:0 6px;}
  .timeline li.now span{color:var(--ink-d);font-weight:500;}
  /* the line between squares: from this square to the next */
  .timeline li:not(:last-child)::after{
    content:"";position:absolute;top:4.5px;left:calc(50% + 10px);right:calc(-50% + 10px);
    border-top:1px solid rgba(243,239,234,.22);
  }

  /* below the card */
  .more{
    width:100%;max-width:1080px;
    margin-top:8px;
    max-width:760px;
    display:grid;grid-template-columns:1fr;gap:64px;
    align-items:start;
    opacity:0;transform:translateY(18px);
    /* half a second after the card has landed (card-delay + card-ms + 500) */
    transition:opacity .9s var(--ease-out) 1600ms, transform .9s var(--ease-out) 1600ms;
  }
  body[data-state="revealing"] .more,
  body[data-state="gift"] .more{opacity:1;transform:none;}
  body[data-state="returning"] .more{opacity:0;transition-delay:0s;transition-duration:.4s;}
  .block{display:flex;flex-direction:column;gap:14px;min-width:0;}
  .steps{list-style:none;margin:0;padding:0;counter-reset:step;}
  .steps li{
    counter-increment:step;
    display:grid;grid-template-columns:32px minmax(0,1fr);gap:14px;align-items:baseline;
    padding:13px 0;border-bottom:1px solid var(--hair-d);
  }
  .steps li::before{
    content:counter(step, decimal-leading-zero);
    font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px;letter-spacing:.06em;color:var(--muted-d);
  }
  .steps b{display:block;font-weight:500;font-size:15px;color:var(--ink-d);margin-bottom:3px;}
  .steps span{display:block;font-size:14px;line-height:1.5;color:var(--ink-d2);}
  /* the same mono line as fold 1, on the dark ground */
  .kicker .chip{
    margin:0;animation:none;opacity:1;transform:none;
    font-size:11.5px;gap:10px;color:var(--ink-d);
  }
  .kicker .chip::before{background:var(--ink-d);}
  .card h2{
    margin:0 0 14px;
    font-weight:500;
    font-size:clamp(28px, 1.6vw + 16px, 38px);line-height:1.04;letter-spacing:-.03em;
    color:var(--ink-d);
    text-wrap:balance;
  }
  .incl{list-style:none;margin:0;padding:0;}
  .incl li{
    display:flex;gap:14px;align-items:baseline;
    padding:13px 0;border-bottom:1px solid var(--hair-d);
    font-size:14.5px;color:var(--ink-d);
    white-space:nowrap;
  }
  .incl li::before{
    content:"";flex:none;width:5px;height:5px;background:var(--red);
    transform:translateY(-2px);
  }
  /* the sender's note */
  /* the sender's note, under the value */
  .note{
    margin:auto 0 0;padding-top:26px;border-top:1px solid var(--hair-d);  /* pushed to the bottom of the column */
    font-weight:300;font-size:16.5px;line-height:1.45;letter-spacing:-.01em;color:var(--ink-d2);
    text-wrap:pretty;
  }
  .note .who{display:block;margin-top:8px;font-size:13px;color:var(--muted-d);font-weight:400;letter-spacing:0;}
  /* the button sits under the card, centred, and fades in once the card has landed */
  .act{
    position:absolute;right:28px;bottom:28px;
    opacity:0;transform:translateY(10px);
    transition:opacity .7s var(--ease-out) 1100ms, transform .7s var(--ease-out) 1100ms;
  }
  body[data-state="revealing"] .act,
  body[data-state="gift"] .act{opacity:1;transform:none;}
  body[data-state="returning"] .act{opacity:0;transition-delay:0s;transition-duration:.3s;}
  .act .pill{color:var(--btn-d-ink);background:var(--btn-d);padding:15px 30px;}
  .act .pill:hover{background:#FFFFFF;}

  /* right column: what's included, condensed; the same glass as the rest of
     the card, no second tint */
  .visual{
    position:relative;min-height:580px;min-width:0;
    display:flex;flex-direction:column;justify-content:flex-start;gap:14px;
    padding:48px 44px 110px 40px;  /* room for the button in the corner */
    border-left:1px solid var(--hair-d);  /* a hairline between the columns */
  }
  .visual .incl li{padding:9px 0;font-size:13.5px;gap:12px;white-space:normal;}
  .visual .incl li::before{width:4px;height:4px;}

  .foot{
    margin:28px 0 0;flex:none;
    display:flex;align-items:center;gap:10px;
    font-size:13px;color:var(--muted-d);
    opacity:0;transform:translateY(8px);
    transition:opacity .9s var(--ease-out) 1900ms, transform .9s var(--ease-out) 1900ms;
  }
  body[data-state="returning"] .foot{opacity:0;transition-delay:0s;transition-duration:.4s;}
  body[data-state="revealing"] .foot,
  body[data-state="gift"] .foot{opacity:1;transform:none;}
  .foot svg rect{fill:var(--muted-d);}
  .foot b{font-weight:500;color:var(--ink-d2);}

  @media (max-width:820px){
    .card{grid-template-columns:1fr;max-width:560px;margin:0;}
    .visual{order:1;min-height:0;padding:26px 26px 30px;border-left:0;border-top:1px solid var(--hair-d);}
    .note{margin-top:26px;}
    .card{border-radius:28px;}
    .act{position:static;order:2;display:flex;justify-content:center;padding:0 26px 30px;}
    .back{left:auto;right:14px;transform:none;}
    .timeline li span{font-size:11.5px;padding:0 3px;}
    .back{top:14px;}
    .phone{width:min(34%, 150px);transform:translate(-50%,-42%) rotate(-14deg);}
    .card .info{padding:30px 26px 28px;min-height:0;}
    .incl li{white-space:normal;}
    .more{margin-top:40px;gap:40px;}
    .gift{justify-content:flex-start;padding:0 20px 40px;}
    .hero{min-height:0;padding:68px 0 8px;}
    .intro{padding:24px 22px;}
    .intro .cta{margin-top:44px;}
  }

  @media (prefers-reduced-motion: reduce){
    .quote .c, .chip .c{animation:none !important;opacity:1;top:0;filter:none;color:var(--ink);text-shadow:none;}
    .quote .line{animation:none !important;grid-template-rows:1fr;}
    .chip{animation:none;opacity:1;transform:none;}
    .stack, .card, .act, .more, .foot, .back, body, .glow, .scene-bg, .scene-bg::after, .dim{transition-duration:.3s !important;transition-delay:0s !important;}
    .stack{transition-property:opacity;}
    body[data-state="revealing"] .stack, body[data-state="gift"] .stack{transform:none;opacity:0;}
    body[data-state="returning"] .stack{opacity:1;}
    .intro .cta{opacity:1;transform:none;filter:none;}
    .card{transform:none;opacity:0;transition-property:opacity;}
    body[data-state="revealing"] .card, body[data-state="gift"] .card{opacity:1;}
  }

  /* ---- version switcher: a fixed pill at the top left with a select ---- */
  .switch{
    position:fixed;top:14px;left:16px;z-index:9;
    display:inline-flex;align-items:center;gap:10px;
    padding:0 12px 0 14px;height:36px;border-radius:999px;
    background:rgba(23,20,18,.86);color:#F3EFEA;
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  }
  .switch label{opacity:.55;}
  .switch .sel{position:relative;display:inline-flex;align-items:center;}
  .switch select{
    appearance:none;-webkit-appearance:none;
    background:transparent;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;
    padding:0 18px 0 0;cursor:pointer;outline:none;
  }
  .switch select option{color:#171412;background:#F3EFEA;text-transform:none;letter-spacing:0;font-family:inherit;}
  .switch .sel::after{
    content:"";position:absolute;right:2px;top:50%;width:6px;height:6px;
    border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
    transform:translateY(-70%) rotate(45deg);pointer-events:none;
  }
  .switch select:focus-visible{outline:2px solid #F3EFEA;outline-offset:3px;border-radius:4px;}

            c.style.setProperty('--e', Math.round(ember * 100) + '%');
            c.style.setProperty('--dur', Math.round(dur) + 'ms');
          }
          w.appendChild(c);
          i++;
        });
        host.appendChild(w);
        if(wi < words.length - 1) host.appendChild(document.createTextNode(' '));
      });
      if(!opts.grow && li < lines.length - 1) frag.appendChild(document.createElement('br'));
    });
    el.textContent = '';
    el.appendChild(frag);
    el.setAttribute('aria-label', text.replace(/\n/g,' '));

    return { done: reduce ? 0 : finishStartsBy + lastMs };
  }

  /* ---------- GiftIntro ---------- */
  function GiftIntro(root, gift, onSee){
    // the eyebrow resolves first: its letters run from 0.2s to 0.8s, with a
    // lighter ember, and are settled by ~1.4s
    AnimatedQuote($('chipText'), gift.from + ' got something special for you', {
      startAt: 200, finishStartsBy: 800, charMs: 650, fixedDur: true, ember: .5
    });
    // the message follows: letters start at 0.9s, the last begins at 2.7s
    // and settles by ~3.3s; the last word carries a fifth of the ember and less time
    var quote = AnimatedQuote($('quote'), gift.message, {
      startAt: 900, finishStartsBy: 2700, charMs: 1000, lastWordMs: 600, lastWordEmber: .2, grow: true
    });
    // the button rises ~350ms after the last character settles, and the
    // circle scales up at the bottom ~500ms after the button
    setTimeout(function(){ root.classList.add('cta-in'); }, reduce ? 0 : quote.done + 350);
    setTimeout(function(){ document.body.classList.add('orb-in'); }, reduce ? 0 : quote.done + 850);
    $('see').addEventListener('click', onSee);
  }

  /* ---------- GiftCard ---------- */
  function GiftCard(gift){
    $('fromChip').textContent = 'A gift from ' + gift.from;
    $('toName').textContent = gift.to;
    $('product').textContent = gift.product;
    $('blurb').textContent = gift.blurb;
    $('noteText').textContent = '“' + gift.note + '”';
    $('noteWho').textContent = '— ' + gift.from;
    $('claim').href = gift.claim;
    var list = $('includes');
    gift.includes.forEach(function(item){
      var li = document.createElement('li');
      li.textContent = item;
      list.appendChild(li);
    });
    var src = gift.image || PHOTO;
    if(src){
      $('sceneBg').style.backgroundImage = 'url("' + src.replace(/["\\]/g, '') + '")';
      var probe = new Image();
      probe.onload = function(){ layoutScene(probe.naturalWidth, probe.naturalHeight); };
      probe.src = src;
    }
  }

  /* ---------- the circle's geometry ----------
     Writes the closed and open states of the photo circle as custom
     properties: diameter, background size and background position. */
  var imgW = 1920, imgH = 1446; // the stand-in gradient uses the photo's aspect
  function layoutScene(w, h){
    if(w && h){ imgW = w; imgH = h; }
    var W = window.innerWidth, H = window.innerHeight;
    var root = document.documentElement.style;

    // full-screen cover size of the photo
    var k = Math.max(W / imgW, H / imgH);
    var Fw = imgW * k, Fh = imgH * k;

    // closed: a half circle of radius r on the bottom edge, photo at half size,
    // placed so the upper-middle of the photo (the couple) sits in the dome
    var r = Math.max(90, Math.min(.26 * W, .22 * H, 260));
    var d0 = 2 * r;
    var bw0 = Fw * .5, bh0 = Fh * .5;
    var bx0 = r - bw0 / 2;                  // centred on the circle
    var by0 = (r - .62 * r) - .38 * bh0;    // photo's 38% line at 62% up the dome

    // open: a circle big enough to cover the viewport from the bottom centre,
    // photo at full cover size, centred on the viewport
    var d1 = 2 * Math.sqrt((W / 2) * (W / 2) + H * H) + 8;
    var bx1 = (d1 - Fw) / 2;
    var by1 = (d1 - H - Fh) / 2;

    root.setProperty('--d0', d0.toFixed(1) + 'px');
    root.setProperty('--bw0', bw0.toFixed(1) + 'px'); root.setProperty('--bh0', bh0.toFixed(1) + 'px');
    root.setProperty('--bx0', bx0.toFixed(1) + 'px'); root.setProperty('--by0', by0.toFixed(1) + 'px');
    root.setProperty('--d1', d1.toFixed(1) + 'px');
    root.setProperty('--bw1', Fw.toFixed(1) + 'px'); root.setProperty('--bh1', Fh.toFixed(1) + 'px');
    root.setProperty('--bx1', bx1.toFixed(1) + 'px'); root.setProperty('--by1', by1.toFixed(1) + 'px');
  }
  layoutScene();
  window.addEventListener('resize', function(){ layoutScene(); });

  /* ---------- App: intro → revealing → gift → returning → intro ---------- */
  var SCENE_MS = 1100; // card-delay + card-ms, see the CSS tokens
  var BACK_MS = 1150;  // back-text-delay + back-text-ms
  var state = 'intro';
  function setState(next){
    state = next;
    document.body.dataset.state = next;
    var onGift = next === 'gift' || next === 'revealing';
    $('gift').setAttribute('aria-hidden', onGift ? 'false' : 'true');
    $('intro').setAttribute('aria-hidden', onGift ? 'true' : 'false');
  }

  function reveal(){
    if(state !== 'intro') return;
    setState('revealing');
    $('see').disabled = true;
    setTimeout(function(){
      setState('gift');
      $('product').focus({ preventScroll: true });
    }, reduce ? 320 : SCENE_MS);
  }

  function goBack(){
    if(state !== 'gift') return;
    setState('returning');
    setTimeout(function(){
    
  // version switcher: open the other version (a new tab when the host
  // forbids navigating this frame's parent)
  var sel = document.getElementById('version');
  var here = sel.value;
  sel.addEventListener('change', function(){
    var url = sel.value;
    if(url === here) return;
    var w = null;
    try{ w = window.open(url, '_blank', 'noopener'); }catch(e){}
    if(!w){ try{ window.top.location.href = url; }catch(e){ location.href = url; } }
    sel.value = here;
  });

  setState('intro');
      $('see').disabled = false;
      $('see').focus({ preventScroll: true });
    }, reduce ? 320 : BACK_MS);
  }

  setState('intro');
  GiftCard(gift);
  GiftIntro($('intro'), gift, reveal);
  $('back').addEventListener('click', goBack);

  /* ---------- scroll as a trigger ----------
     On the first fold, scrolling down (wheel, trackpad, swipe, keyboard) runs
     the same reveal as the button, once the message and button are on
     screen. At the top of the second fold, a firm scroll up runs the way back. */
  var intro = $('intro'), giftEl = $('gift');
  function ready(){ return state === 'intro' && intro.classList.contains('cta-in'); }
  var wheelAcc = 0, wheelTimer = null;
  window.addEventListener('wheel', function(e){
    if(state === 'intro'){
      if(!ready()) return;
      wheelAcc += e.deltaY;
      clearTimeout(wheelTimer); wheelTimer = setTimeout(function(){ wheelAcc = 0; }, 300);
      if(wheelAcc > 40){ wheelAcc = 0; reveal(); }
    }else if(state === 'gift'){
      if(giftEl.scrollTop > 0) return;
      wheelAcc += e.deltaY;
      clearTimeout(wheelTimer); wheelTimer = setTimeout(function(){ wheelAcc = 0; }, 300);
      if(wheelAcc < -140){ wheelAcc = 0; goBack(); }
    }
  }, { passive: true });
  var touchY = null;
  window.addEventListener('touchstart', function(e){ touchY = e.touches[0].clientY; }, { passive: true });
  window.addEventListener('touchmove', function(e){
    if(touchY == null) return;
    var dy = touchY - e.touches[0].clientY; // finger up = scroll down
    if(state === 'intro' && ready() && dy > 48){ touchY = null; reveal(); }
    else if(state === 'gift' && giftEl.scrollTop <= 0 && dy < -90){ touchY = null; goBack(); }
  }, { passive: true });
  window.addEventListener('touchend', function(){ touchY = null; });
  window.addEventListener('keydown', function(e){
    if(e.defaultPrevented || e.target.tagName === 'SELECT') return;
    if(state === 'intro' && ready() && (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ')){ e.preventDefault(); reveal(); }
    else if(state === 'gift' && giftEl.scrollTop <= 0 && (e.key === 'ArrowUp' || e.key === 'PageUp')){ e.preventDefault(); goBack(); }
  });
})();
</script>
