<meta charset="utf-8">
<title>Unwrap your Everlab gift</title>
<!--
  Everlab · gift reveal

  Two folds, one continuous page. State: intro → revealing → gift.

    Fold 1  white. The sender's message alone, resolving letter by letter,
            then a single "See my gift" button.
    Fold 2  dark. Rises from the bottom of the screen as a sheet and pushes
            fold 1 out through the top. Nothing on it but the gift card.

  Components (bottom of file):
    AnimatedQuote  splits the message into characters and resolves them into
                   focus one by one (blur → sharp, 3px rise, ~3s in total)
    GiftIntro      fold 1
    GiftCard       the gift itself, with the photo on its right column
    App            owns the state and the timing of the transition

  Photo on the card's right column: set PHOTO below to a data: URI to ship it
  inside the page (the only way it can load on the artifact host), or pass
  ?image=https://... when the page is hosted by Everlab. With neither, a warm
  low-light gradient stands in.

  The link from the email can carry the gift on the query string. Every field
  is optional and falls back to GIFT_DEFAULTS.

    ?from=Matt
    &to=Sam
    &message=Happy%2030th%2C%20Sam.%0AGo%20find%20out%20how%20good%0Ayou%20actually%20are.
        (%0A = a deliberate line break in the quote; three lines read best)
    &note=Wishing%20you%20a%20long%2C%20healthy%20life.
    &product=Everlab%20Membership
    &term=12%20months
    &value=%241%2C950%20value
    &includes=A%2045-minute%20onboarding%20consult%7CAdvanced%20blood%20panel%7CDEXA%20scan
        (pipe-separated; each item is one line on desktop, so keep them short)
    &claim=https%3A%2F%2Feverlab.com.au%2Factivate%3Fcode%3DEVL-7K2M-QX4
    &image=https%3A%2F%2F...  (photo for the card; http(s) only)

  All text is inserted with textContent, never innerHTML.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap">
<style>
  /* Two deliberate worlds, painted explicitly: a white letter, then a dark room. */
  :root{
    /* fold 1 */
    --white:#FCFBF9;
    --ink:#171412;
    --ember:#D98B4A;   /* the colour a letter has while it's still out of focus */
    --ember-strength:.5;    /* how much of it shows: 1 is full orange, 0 is none */
    --btn:#171412;
    --btn-ink:#FCFBF9;

    /* fold 2 */
    --night:#0E0C0B;
    --card:#161312;
    --card-hair:rgba(255,255,255,.09);
    --ink-d:#F3EFEA;
    --ink-d2:#B9B0A8;
    --muted-d:#7D746D;
    --hair-d:rgba(255,255,255,.10);
    --red:#C4655B;
    --btn-d:#F3EFEA;
    --btn-d-ink:#0E0C0B;
    --glow-a:rgba(222,150,84,.20);
    --glow-b:rgba(180,87,78,.12);

    /* the fold transition: a long slow start, then it commits fast and settles */
    --ease-scene:cubic-bezier(.9,0,.22,1);
    --ease-out:cubic-bezier(.22,.61,.24,1);
    /* the sequence after the click:
         0ms      the whole first-fold block scrolls up and out of the viewport (1100ms)
         150ms    the viewport starts crossfading to dark (950ms)
         150ms    the card starts rising from the bottom at the same moment (1400ms)
         1550ms   settled */
    --fade-ms:1100ms;
    --bg-delay:150ms;
    --bg-ms:950ms;
    --card-delay:150ms;
    --card-ms:1400ms;
    /* and in reverse (the arrow on fold 2):
         0ms      the card sinks back below the bottom edge (1000ms)
         0ms      the viewport crossfades back to white at the same moment (950ms)
         600ms    the block settles back down into place (1000ms)
         1600ms   settled */
    --back-card-ms:1000ms;
    --back-bg-delay:0ms;
    --back-text-delay:600ms;
    --back-text-ms:1000ms;

    --sans:'Suisse Intl','Geist','Helvetica Neue',Helvetica,Arial,sans-serif;
    color-scheme:light;
  }

  *{box-sizing:border-box;}
  html{height:100%;}
  body{
    margin:0;min-height:100%;
    background:var(--white);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overflow:hidden;
    transition:background-color var(--bg-ms) ease var(--bg-delay);
  }
  body[data-state="revealing"],
  body[data-state="gift"]{background:var(--night);color-scheme:dark;}
  body[data-state="returning"]{background:var(--white);transition-delay:var(--back-bg-delay);}

  /* warm glow that belongs to the dark room; fades in with the background */
  .glow{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(70% 50% at 50% -10%, var(--glow-a), transparent 70%),
      radial-gradient(50% 40% at 50% 110%, var(--glow-b), transparent 70%);
    opacity:0;
    transition:opacity var(--bg-ms) ease var(--bg-delay);
  }
  body[data-state="revealing"] .glow,
  body[data-state="gift"] .glow{opacity:1;}
  body[data-state="returning"] .glow{opacity:0;transition-delay:var(--back-bg-delay);}

  :focus-visible{outline:2px solid currentColor;outline-offset:4px;border-radius:999px;}

  /* ---- fold 1 ---- */
  .intro{
    position:fixed;inset:0;z-index:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;
  }
  /* on click the whole block scrolls up and out of the viewport, like the
     page being pushed; the room changes behind it */
  .stack{
    display:flex;flex-direction:column;align-items:center;
    will-change:transform;
    transition:transform var(--fade-ms) var(--ease-scene);
  }
  body[data-state="revealing"] .intro,
  body[data-state="gift"] .intro{pointer-events:none;}
  body[data-state="revealing"] .stack,
  body[data-state="gift"] .stack{transform:translateY(-110vh);}
  body[data-state="gift"] .intro{visibility:hidden;}
  /* coming back: the block scrolls back down into place once the room is light again */
  body[data-state="returning"] .stack{
    transform:none;
    transition:transform var(--back-text-ms) var(--ease-scene) var(--back-text-delay);
  }

  .quote{
    margin:0;
    max-width:min(92vw, 14em);
    text-align:center;
    font-weight:500;
    font-size:clamp(29px, 4.2vw + 12px, 64px);
    /* 6px tighter than .98; floored at .8em so lines never overlap on phones */
    line-height:max(calc(.98em - 6px), .8em);
    letter-spacing:-.034em;
    color:var(--ink);
    text-wrap:balance;
  }
  .quote .w{white-space:nowrap;}
  /* each letter comes up quickly, then takes its time sharpening out of the
     blur. The warmth is a separate animation lasting three stagger steps
     (--stag × 3) and fading linearly, so at any moment the newest letter is
     warmest, the one before it less, the one before that barely: a short
     gradient trailing the leading edge. --e lets the last word carry less of
     it; --dur is the sharpening time. */
  .quote .c{
    position:relative;display:inline;
    opacity:0;top:3px;filter:blur(7px);
    --warm:color-mix(in srgb, var(--ember) calc(var(--e, 100%) * var(--ember-strength)), var(--ink));
    --halo:color-mix(in srgb, rgba(217,139,74,.4) calc(var(--e, 100%) * var(--ember-strength)), transparent);
    color:var(--ink);
    animation:
      resolve var(--dur, 1600ms) var(--ease-out) var(--d) both,
      ember calc(var(--stag, 60ms) * 3) linear var(--d) both;
  }
  @keyframes resolve{
    0%{opacity:0;top:3px;filter:blur(8px);}
    6%{opacity:.8;}
    100%{opacity:1;top:0;filter:blur(0);}
  }
  @keyframes ember{
    0%{color:var(--warm);text-shadow:0 0 12px var(--halo);}
    100%{color:var(--ink);text-shadow:0 0 0 rgba(232,140,60,0);}
  }

  /* a plain mono line above the message: a black square, then who sent it */
  .chip{
    margin:0 0 clamp(26px, 4vh, 40px);
    display:inline-flex;align-items:center;gap:12px;
    font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink);
    opacity:0;transform:translateY(4px);
    animation:chip-in 900ms var(--ease-out) 120ms both;
  }
  .chip::before{content:"";width:7px;height:7px;background:var(--ink);}
  @keyframes chip-in{to{opacity:1;transform:none;}}

  .pill{
    appearance:none;border:0;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--sans);font-weight:500;font-size:15px;letter-spacing:-.004em;
    color:var(--btn-ink);background:var(--btn);
    padding:13px 26px;border-radius:999px;
    text-decoration:none;
    transition:transform .35s var(--ease-out), background-color .35s var(--ease-out),
               opacity .7s var(--ease-out), filter .7s var(--ease-out);
  }
  .pill:hover{transform:translateY(-1px) scale(1.015);background:#2A2522;}
  .pill:active{transform:scale(.985);}

  .intro .cta{
    margin-top:clamp(40px, 6vh, 64px);
    opacity:0;transform:translateY(10px);filter:blur(3px);
    transition:opacity .8s var(--ease-out), transform .8s var(--ease-out), filter .8s var(--ease-out);
  }
  .intro.cta-in .cta{opacity:1;transform:none;filter:none;}

  /* ---- fold 2: the dark room; the card rises into it from the bottom ---- */
  .gift{
    position:fixed;inset:0;z-index:2;
    overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    color:var(--ink-d);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:84px 24px 40px;  /* room for the arrow above the card */
    visibility:hidden;
  }
  body[data-state="revealing"] .gift,
  body[data-state="gift"] .gift,
  body[data-state="returning"] .gift{visibility:visible;}

  /* the way back up */
  .back{
    position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:3;
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    appearance:none;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);
    color:var(--ink-d2);cursor:pointer;
    opacity:0;pointer-events:none;
    /* appears once the card has landed (the gift state starts as it settles) */
    transition:opacity .8s var(--ease-out) 250ms, background-color .3s ease, color .3s ease, border-color .3s ease;
  }
  .back:hover{background:rgba(255,255,255,.09);color:var(--ink-d);border-color:rgba(255,255,255,.18);}
  .back svg{display:block;}
  body[data-state="gift"] .back{opacity:1;pointer-events:auto;}
  body[data-state="returning"] .back{opacity:0;transition-delay:0s;transition-duration:.4s;}

  .card{
    width:100%;max-width:1080px;
    flex:none;
    margin:auto 0;
    background:var(--card);
    border-radius:24px;
    display:grid;grid-template-columns:minmax(0, 1.25fr) minmax(0, 1fr);
    overflow:hidden;
    transform:translateY(110vh);
    will-change:transform;
    transition:transform var(--card-ms) var(--ease-scene) var(--card-delay);
  }
  body[data-state="revealing"] .card,
  body[data-state="gift"] .card{transform:none;}
  body[data-state="returning"] .card{transform:translateY(110vh);transition:transform var(--back-card-ms) var(--ease-scene) 0s;}

  .card .info{padding:36px 40px 36px;display:flex;flex-direction:column;min-height:500px;min-width:0;}
  .card .incl{margin-bottom:34px;}
  .kicker{
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    margin:0 0 28px;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-d);font-weight:500;
  }
  /* the same mono line as fold 1, on the dark ground */
  .kicker .chip{
    margin:0;animation:none;opacity:1;transform:none;
    font-size:11.5px;gap:10px;color:var(--ink-d);
  }
  .kicker .chip::before{background:var(--ink-d);}
  .card h2{
    margin:0 0 8px;
    font-weight:500;
    font-size:clamp(28px, 1.6vw + 16px, 38px);line-height:1.04;letter-spacing:-.03em;
    color:var(--ink-d);
    text-wrap:balance;
  }
  .term{margin:0 0 28px;color:var(--ink-d2);font-size:15px;}
  .incl-label{
    margin:0 0 10px;
    font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-d);
  }
  .incl{list-style:none;margin:0 0 30px;padding:0;}
  .incl li{
    display:flex;gap:16px;align-items:baseline;
    padding:10px 0;border-bottom:1px solid var(--hair-d);
    font-size:14.5px;color:var(--ink-d);
    white-space:nowrap;
  }
  .incl li::before{
    content:"";flex:none;width:5px;height:5px;background:var(--red);
    transform:translateY(-2px);
  }
  /* the sender's note sits over the bottom of the photograph */
  .note{
    position:absolute;left:20px;right:20px;bottom:20px;z-index:1;
    margin:0;
    padding:16px 18px;border-radius:14px;
    background:rgba(18,12,9,.55);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.08);
    font-weight:300;font-size:16px;line-height:1.45;letter-spacing:-.01em;color:#F3EFEA;
    text-wrap:pretty;
  }
  .note .who{display:block;margin-top:8px;font-size:13px;color:rgba(243,239,234,.6);font-weight:400;}
  .act{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:auto;}
  .act .pill{color:var(--btn-d-ink);background:var(--btn-d);}
  .act .pill:hover{background:#FFFFFF;}

  /* right column: the photograph, or until it ships, a composed stand-in of
     the same scene: a phone on oak in low warm light */
  .visual{
    position:relative;min-height:520px;overflow:hidden;
    background:
      radial-gradient(55% 45% at 72% 26%, rgba(240,178,104,.62), transparent 70%),
      radial-gradient(70% 60% at 15% 95%, rgba(18,10,6,.75), transparent 70%),
      linear-gradient(160deg, #8F5C2F 0%, #6A4222 45%, #30190E 100%);
    background-size:cover;background-position:center;
  }
  .visual.photo{background-size:cover;background-position:center;}
  .visual.photo .scene{display:none;}
  .scene{position:absolute;inset:0;}
  .scene .grain{
    position:absolute;inset:-20%;
    background:repeating-linear-gradient(97deg, rgba(255,235,210,.05) 0 2px, transparent 2px 9px, rgba(40,20,8,.08) 9px 11px, transparent 11px 23px);
    mix-blend-mode:soft-light;
  }
  .scene .shadow{
    position:absolute;left:18%;top:40%;width:54%;height:70%;
    background:radial-gradient(50% 50% at 50% 50%, rgba(20,10,5,.6), transparent 70%);
    transform:rotate(-14deg) translate(8%, 10%);
  }
  .phone{
    position:absolute;left:50%;top:50%;
    width:min(46%, 190px);aspect-ratio:9/19;
    transform:translate(-56%,-46%) rotate(-14deg);
    background:#0B0A0A;border-radius:14% / 6.6%;
    border:2px solid #23201E;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.06) inset;
    padding:9% 8%;
    display:flex;flex-direction:column;
    color:#E9E2DA;font-size:clamp(7px, .55vw + 4px, 9px);
  }
  .phone .st{display:flex;justify-content:space-between;color:#A39B93;font-size:.9em;margin-bottom:12%;}
  .phone .hd{color:#D9D1C8;font-size:1.05em;margin-bottom:10%;}
  .phone .heart{width:38%;margin:0 auto 6%;display:block;}
  .phone .big{text-align:center;font-size:3.4em;line-height:1;letter-spacing:-.04em;color:#F3EFEA;font-weight:300;}
  .phone .cap{text-align:center;color:#9E958C;font-size:.9em;margin-top:6%;}
  .phone .tabs{display:flex;justify-content:space-around;gap:4%;white-space:nowrap;color:#7C746C;font-size:.8em;margin:12% 0 8%;}
  .phone .tabs b{color:#E9E2DA;font-weight:400;}
  .phone .tile{margin-top:auto;background:#151312;border-radius:10px;padding:8% 9%;}
  .phone .tile small{display:block;color:#7C746C;font-size:.8em;letter-spacing:.1em;}
  .phone .tile b{display:block;font-weight:400;font-size:1.3em;margin:3% 0 8%;}
  .phone .bars{display:flex;align-items:flex-end;gap:7%;height:22px;}
  .phone .bars i{flex:1;background:#DCD4CB;border-radius:2px;opacity:.85;}

  .foot{
    margin:28px 0 0;flex:none;
    display:flex;align-items:center;gap:10px;
    font-size:13px;color:var(--muted-d);
    opacity:0;transform:translateY(8px);
    transition:opacity .9s var(--ease-out) 1450ms, transform .9s var(--ease-out) 1450ms;
  }
  body[data-state="returning"] .foot{opacity:0;transition-delay:0s;transition-duration:.4s;}
  body[data-state="revealing"] .foot,
  body[data-state="gift"] .foot{opacity:1;transform:none;}
  .foot svg rect{fill:var(--muted-d);}
  .foot b{font-weight:500;color:var(--ink-d2);}

  @media (max-width:820px){
    .card{grid-template-columns:1fr;max-width:560px;margin:0;}
    .visual{order:-1;min-height:min(78vw, 400px);}
    .note{left:14px;right:14px;bottom:14px;padding:14px 16px;font-size:15px;}
    .phone{transform:translate(-50%,-62%) rotate(-14deg);}
    .back{top:14px;}
    .phone{width:min(34%, 150px);transform:translate(-50%,-42%) rotate(-14deg);}
    .card .info{padding:30px 26px 28px;min-height:0;}
    .incl li{white-space:normal;}
    .gift{justify-content:flex-start;padding:68px 20px 40px;}
    .intro{padding:24px 22px;}
    .intro .cta{margin-top:44px;}
  }

  @media (prefers-reduced-motion: reduce){
    .quote .c{animation:none !important;opacity:1;top:0;filter:none;color:var(--ink);text-shadow:none;}
    .chip{animation:none;opacity:1;transform:none;}
    .stack, .card, .foot, .back, body, .glow{transition-duration:.3s !important;transition-delay:0s !important;}
    .stack{transition-property:opacity;}
    body[data-state="revealing"] .stack, body[data-state="gift"] .stack{transform:none;opacity:0;}
    body[data-state="returning"] .stack{opacity:1;}
    .intro .cta{opacity:1;transform:none;filter:none;}
    .card{transform:none;opacity:0;transition-property:opacity;}
    body[data-state="revealing"] .card, body[data-state="gift"] .card{opacity:1;}
  }
</style>

<div class="glow" aria-hidden="true"></div>

<!-- Fold 1 · GiftIntro -->
<section class="intro" id="intro" aria-label="A message from the sender">
  <div class="stack">
    <p class="chip" id="chip"></p>
    <p class="quote" id="quote"></p>
    <div class="cta">
      <button class="pill" id="see" type="button">See my gift</button>
    </div>
  </div>
</section>

<!-- Fold 2 · the gift -->
<button class="back" id="back" type="button" aria-label="Back to the message">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
</button>

<main class="gift" id="gift" aria-hidden="true">
  <article class="card" id="card" aria-label="Your gift">
    <div class="info">
      <p class="kicker"><span class="chip" id="fromChip"></span><span id="value"></span></p>
      <h2 id="product" tabindex="-1"></h2>
      <p class="term" id="term"></p>
      <p class="incl-label">What’s included</p>
      <ul class="incl" id="includes"></ul>
      <div class="act">
        <a class="pill" id="claim" href="#">Claim my gift</a>
      </div>
    </div>
    <div class="visual" id="visual" role="img" aria-label="A phone showing Everlab health insights on a wooden table in warm evening light">
      <div class="scene" aria-hidden="true">
        <div class="grain"></div>
        <div class="shadow"></div>
        <div class="phone">
          <div class="st"><span>9:41</span><span>●●●</span></div>
          <div class="hd">Health insights</div>
          <svg class="heart" viewBox="0 0 40 36" aria-hidden="true">
            <path d="M20 33C9 25 3 19 3 11.5 3 6.5 7 3 11.5 3c3.5 0 6.5 2 8.5 5 2-3 5-5 8.5-5C33 3 37 6.5 37 11.5 37 19 31 25 20 33z"
                  fill="none" stroke="#B4574E" stroke-width="1.2" stroke-dasharray="1.2 2.1" opacity=".85"/>
          </svg>
          <div class="big">44</div>
          <div class="cap">4 years older</div>
          <div class="tabs"><span>Biological</span><b>Heart age</b><span>Lung</span></div>

          </div>
        </div>
      </div>
      <p class="note"><span id="noteText"></span><span class="who" id="noteWho"></span></p>

  <p class="foot">
    <svg width="13" height="13" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="12" height="2.6" rx="1.3"/><rect x="1" y="7.7" width="16" height="2.6" rx="1.3"/><rect x="3" y="13.4" width="12" height="2.6" rx="1.3"/></svg>
    <span>everlab &nbsp;·&nbsp; Sent privately to <b id="toName"></b></span>
  </p>
</main>

<script>
(function(){
  'use strict';

  /* Paste a data: URI here to ship the card photo inside the page. */
  var PHOTO = '';

  var GIFT_DEFAULTS = {
    from: 'Matt',
    to: 'Sam',
    message: 'Happy 30th, Sam.\nGo find out how good\nyou actually are.',
    note: 'Thirty looks good on you. Now go and see what’s going on inside.',
    product: 'Everlab Membership',
    term: 'Twelve months of testing, doctors and insights',
    value: '$1,950 value',
    includes: [
      'A 45-minute onboarding consult with an Everlab doctor',
      'Advanced blood panel — 100+ biomarkers across 50 health areas',
      'DEXA scan for body composition and bone density',
      'A 90-minute physical assessment, including VO₂ max',
      'Nutrition assessment with an Everlab nutritionist',
      'Re-testing part-way through, plus a full 12-month review'
    ],
    claim: 'https://everlab.com.au/',
    image: ''
  };

  var params = new URLSearchParams(location.search);
  function pick(key){
    var v = params.get(key);
    return (v && v.trim()) ? v.trim() : GIFT_DEFAULTS[key];
  }
  var gift = {
    from: pick('from'), to: pick('to'), message: pick('message'), note: pick('note'),
    product: pick('product'), term: pick('term'), value: pick('value'),
    includes: params.get('includes')
      ? params.get('includes').split('|').map(function(s){ return s.trim(); }).filter(Boolean)
      : GIFT_DEFAULTS.includes,
    claim: pick('claim'),
    image: pick('image')
  };
  if(!/^https?:\/\//i.test(gift.claim)) gift.claim = GIFT_DEFAULTS.claim;
  if(gift.image && !/^https?:\/\//i.test(gift.image)) gift.image = '';

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function(id){ return document.getElementById(id); };

  /* ---------- AnimatedQuote ----------
     Characters resolve into focus one after another. The stagger is derived
     from the character count so any message lands in about three seconds.
     Words are kept unbreakable; authored line breaks (\n) are honoured. */
  function AnimatedQuote(el, text, opts){
    var startAt = opts.startAt, finishStartsBy = opts.finishStartsBy, charMs = opts.charMs;
    var lastMs = opts.lastWordMs || charMs, lastEmber = opts.lastWordEmber == null ? 1 : opts.lastWordEmber;
    var lines = text.split('\n');
    var count = 0;
    lines.forEach(function(l){ count += l.replace(/\s+/g,'').length; });
    var stagger = count > 1 ? (finishStartsBy - startAt) / (count - 1) : 0;
    // the warm flash lasts one stagger step, so it is only ever on one letter
    el.style.setProperty('--stag', Math.max(40, Math.round(stagger)) + 'ms');

    // the ember tapers across the last line so the final word arrives quick
    // and almost ink; everything before it keeps the full effect
    var lastLine = lines[lines.length - 1];
    var lastLineChars = lastLine.replace(/\s+/g,'').length;
    var lastLineStart = count - lastLineChars;
    var lastWordChars = (lastLine.trim().split(/\s+/).pop() || '').length;

    var i = 0;
    var frag = document.createDocumentFragment();
    lines.forEach(function(line, li){
      var words = line.split(/\s+/).filter(Boolean);
      words.forEach(function(word, wi){
        var w = document.createElement('span');
        w.className = 'w';
        Array.prototype.forEach.call(word, function(ch){
          var c = document.createElement('span');
          c.className = 'c';
          c.textContent = ch;
          c.style.setProperty('--d', Math.round(startAt + i * stagger) + 'ms');
          if(i >= lastLineStart){
            var isLastWord = i >= count - lastWordChars;
            var t = lastLineChars > 1 ? (i - lastLineStart) / (lastLineChars - 1) : 1; // 0 → 1 across the last line
            var ember = isLastWord ? lastEmber : 1 - (1 - lastEmber) * t;
            var dur = isLastWord ? lastMs : charMs - (charMs - lastMs) * t;
            c.style.setProperty('--e', Math.round(ember * 100) + '%');
            c.style.setProperty('--dur', Math.round(dur) + 'ms');
          }
          w.appendChild(c);
          i++;
        });
        frag.appendChild(w);
        if(wi < words.length - 1) frag.appendChild(document.createTextNode(' '));
      });
      if(li < lines.length - 1) frag.appendChild(document.createElement('br'));
    });
    el.textContent = '';
    el.appendChild(frag);
    el.setAttribute('aria-label', text.replace(/\n/g,' '));

    return { done: reduce ? 0 : finishStartsBy + lastMs };
  }

  /* ---------- GiftIntro ---------- */
  function GiftIntro(root, gift, onSee){
    $('chip').textContent = gift.from + ', I sent you something';
    // letters start at 0.45s (after the mono line), the last begins at 3.4s
    // and settles by ~4.2s; the last word carries a fifth of the ember and half the time
    var quote = AnimatedQuote($('quote'), gift.message, {
      startAt: 450, finishStartsBy: 3400, charMs: 1600, lastWordMs: 800, lastWordEmber: .2
    });
    // the button rises ~450ms after the last character settles
    setTimeout(function(){ root.classList.add('cta-in'); }, reduce ? 0 : quote.done + 450);
    $('see').addEventListener('click', onSee);
  }

  /* ---------- GiftCard ---------- */
  function GiftCard(gift){
    $('fromChip').textContent = 'A gift from ' + gift.from;
    $('toName').textContent = gift.to;
    $('value').textContent = gift.value;
    $('product').textContent = gift.product;
    $('term').textContent = gift.term;
    $('noteText').textContent = '“' + gift.note + '”';
    $('noteWho').textContent = '— ' + gift.from;
    $('claim').href = gift.claim;
    var list = $('includes');
    gift.includes.forEach(function(item){
      var li = document.createElement('li');
      li.textContent = item;
      list.appendChild(li);
    });
    var src = gift.image || PHOTO;
    if(src){
      var v = $('visual');
      v.classList.add('photo');
      v.style.backgroundImage = 'url("' + src.replace(/["\\]/g, '') + '")';
    }
  }

  /* ---------- App: intro → revealing → gift → returning → intro ---------- */
  var SCENE_MS = 1550; // card-delay + card-ms, see the CSS tokens
  var BACK_MS = 1600;  // back-text-delay + back-text-ms
  var state = 'intro';
  function setState(next){
    state = next;
    document.body.dataset.state = next;
    var onGift = next === 'gift' || next === 'revealing';
    $('gift').setAttribute('aria-hidden', onGift ? 'false' : 'true');
    $('intro').setAttribute('aria-hidden', onGift ? 'true' : 'false');
  }

  function reveal(){
    if(state !== 'intro') return;
    setState('revealing');
    $('see').disabled = true;
    setTimeout(function(){
      setState('gift');
      $('product').focus({ preventScroll: true });
    }, reduce ? 320 : SCENE_MS);
  }

  function goBack(){
    if(state !== 'gift') return;
    setState('returning');
    setTimeout(function(){
      setState('intro');
      $('see').disabled = false;
      $('see').focus({ preventScroll: true });
    }, reduce ? 320 : BACK_MS);
  }

  setState('intro');
  GiftCard(gift);
  GiftIntro($('intro'), gift, reveal);
  $('back').addEventListener('click', goBack);
})();
</script>
