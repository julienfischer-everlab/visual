<meta charset="utf-8">
<title>Unwrap your Everlab gift</title>
<!--
  Everlab · gift unwrap page

  Linked from the gift email. The link can carry the gift on the query string:

    ?to=Julien
    &from=Sarah
    &message=Happy%20birthday...
    &product=Everlab%20Complete%20Health%20Assessment
    &blurb=A%20full-body%20baseline...
    &includes=100%2B%20biomarkers%7CDoctor%20consult%7CPersonalised%20plan   (pipe-separated)
    &code=EVL-7K2M-QX4
    &until=8%20September%202027
    &claim=https%3A%2F%2Feverlab.com.au%2Fclaim%3Fcode%3DEVL-7K2M-QX4

  Anything missing falls back to the example gift in GIFT_DEFAULTS below.
  All text is inserted with textContent, never innerHTML.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&display=swap">
<style>
  :root{
    --ground:#F3EDE7;
    --paper:#FBF8F4;
    --paper-back:#FDFBF8;
    --ink:#2A1B16;
    --ink-soft:#6E5348;
    --muted:#9A8377;
    --line:rgba(42,27,22,.12);
    --ribbon:#B4574E;
    --ribbon-deep:#95433C;
    --ribbon-edge:rgba(42,27,22,.18);
    --glow:rgba(180,87,78,.10);
    --shadow:0 1px 2px rgba(42,27,22,.06), 0 18px 48px -18px rgba(42,27,22,.28);
    --shadow-lift:0 2px 4px rgba(42,27,22,.06), 0 34px 70px -22px rgba(42,27,22,.36);
    --btn:#2A1B16;
    --btn-ink:#FBF8F4;
    --focus:#B4574E;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#1A0E0C;
      --paper:#261512;
      --paper-back:#2B1915;
      --ink:#F2E5E0;
      --ink-soft:#C9AFA6;
      --muted:#8F736A;
      --line:rgba(242,229,224,.12);
      --ribbon:#C1615A;
      --ribbon-deep:#9E4B45;
      --ribbon-edge:rgba(0,0,0,.28);
      --glow:rgba(193,97,90,.14);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 18px 48px -18px rgba(0,0,0,.7);
      --shadow-lift:0 2px 4px rgba(0,0,0,.3), 0 34px 70px -22px rgba(0,0,0,.8);
      --btn:#F2E5E0;
      --btn-ink:#1A0E0C;
      --focus:#C1615A;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ground:#1A0E0C;
    --paper:#261512;
    --paper-back:#2B1915;
    --ink:#F2E5E0;
    --ink-soft:#C9AFA6;
    --muted:#8F736A;
    --line:rgba(242,229,224,.12);
    --ribbon:#C1615A;
    --ribbon-deep:#9E4B45;
    --ribbon-edge:rgba(0,0,0,.28);
    --glow:rgba(193,97,90,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 18px 48px -18px rgba(0,0,0,.7);
    --shadow-lift:0 2px 4px rgba(0,0,0,.3), 0 34px 70px -22px rgba(0,0,0,.8);
    --btn:#F2E5E0;
    --btn-ink:#1A0E0C;
    --focus:#C1615A;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html{height:100%;}
  body{
    margin:0;
    min-height:100%;
    background:var(--ground);
    color:var(--ink);
    font-family:'Suisse Intl','Geist','Helvetica Neue',Helvetica,Arial,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  :focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px;}

  /* ---- chrome ---- */
  .brand{
    position:absolute;top:22px;left:24px;z-index:3;
    display:inline-flex;align-items:center;gap:8px;
    font-size:15px;font-weight:500;letter-spacing:-.01em;color:var(--ink);
    text-decoration:none;
  }
  .brand svg{display:block;}
  .brand svg rect{fill:var(--ink);}

  /* ---- page ---- */
  .page{
    position:relative;
    min-height:100svh;
    padding:clamp(88px, 14vh, 150px) 20px 72px;
    display:flex;flex-direction:column;align-items:center;
  }
  .glow{
    position:absolute;left:50%;top:clamp(88px, 14vh, 150px);
    width:min(720px, 120vw);height:520px;
    transform:translate(-50%,-90px);
    background:radial-gradient(ellipse at center, var(--glow) 0%, transparent 62%);
    pointer-events:none;
    opacity:.55;
    transition:opacity 1.6s ease;
  }
  .page.open .glow{opacity:1;}

  .stage{
    position:relative;z-index:1;
    width:100%;max-width:400px;
    display:flex;flex-direction:column;align-items:center;gap:28px;
  }

  .eyebrow{
    margin:0;
    font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);
    text-align:center;
    transition:opacity .5s ease;
  }
  .page.open .eyebrow.lead{opacity:0;}

  /* ---- the card ---- */
  .scene{
    width:100%;
    perspective:1600px;
  }
  .card{
    position:relative;
    width:100%;
    display:grid;
    transform-style:preserve-3d;
    transition:transform 1.05s cubic-bezier(.66,0,.2,1), box-shadow .8s ease;
    border-radius:8px;
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .card:hover{box-shadow:var(--shadow-lift);}
  .page.open .card{transform:rotateY(180deg);cursor:default;box-shadow:var(--shadow);}
  .face{
    grid-area:1/1;
    border-radius:8px;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    min-height:440px;
  }
  .front{
    position:relative;overflow:hidden;
    background:var(--paper);
    border:1px solid var(--line);
  }
  .back{
    transform:rotateY(180deg);
    background:var(--paper-back);
    border:1px solid var(--line);
    padding:34px 34px 30px;
    display:flex;flex-direction:column;
  }

  /* ribbon */
  .ribbon{
    position:absolute;
    background:
      linear-gradient(90deg, var(--ribbon-edge), transparent 18%, transparent 82%, var(--ribbon-edge)),
      var(--ribbon);
    transition:transform 1s cubic-bezier(.7,0,.3,1), opacity .9s ease;
  }
  .ribbon.v{top:-2px;bottom:-2px;left:38%;width:34px;}
  .ribbon.h{
    left:-2px;right:-2px;top:44%;height:34px;
    background:
      linear-gradient(180deg, var(--ribbon-edge), transparent 18%, transparent 82%, var(--ribbon-edge)),
      var(--ribbon);
  }
  .knot{
    position:absolute;
    left:calc(38% + 17px);top:calc(44% + 17px);
    width:120px;height:96px;
    transform:translate(-50%,-50%);
    transition:transform .8s cubic-bezier(.6,0,.3,1), opacity .6s ease;
  }
  .knot .loop{fill:var(--ribbon-deep);stroke:var(--paper);stroke-width:2;}
  .knot .core{fill:var(--ribbon);stroke:var(--paper);stroke-width:2;}
  .page.open .ribbon.v{transform:translateY(112%);}
  .page.open .ribbon.h{transform:translateX(112%);}
  .page.open .knot{transform:translate(-50%,-50%) scale(.6) rotate(-8deg);opacity:0;}

  .front .mark{
    position:absolute;left:22px;bottom:18px;
    display:inline-flex;align-items:center;gap:7px;
    font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.01em;
  }
  .front .mark svg rect{fill:var(--muted);}
  .front .to{
    position:absolute;right:22px;bottom:18px;
    font-size:12px;color:var(--muted);
    font-family:'Newsreader',Georgia,'Times New Roman',serif;font-style:italic;font-size:15px;
  }

  /* message */
  .from{
    margin:0 0 18px;
    font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  }
  .message{
    margin:0;flex:1;
    font-family:'Newsreader',Georgia,'Times New Roman',serif;
    font-style:italic;font-weight:300;
    font-size:clamp(22px, 2.2vw + 12px, 26px);
    line-height:1.32;letter-spacing:-.005em;
    color:var(--ink);
    text-wrap:pretty;
    white-space:pre-line;
  }
  .sign{
    margin:26px 0 0;
    font-family:'Newsreader',Georgia,'Times New Roman',serif;font-style:italic;
    font-size:19px;color:var(--ink-soft);
  }
  .back > *{
    opacity:0;transform:translateY(6px);
    transition:opacity .7s ease, transform .7s ease;
  }
  .page.open .back > *{opacity:1;transform:none;}
  .page.open .back .from{transition-delay:.75s;}
  .page.open .back .message{transition-delay:.9s;}
  .page.open .back .sign{transition-delay:1.15s;}

  /* unwrap button */
  .unwrap{
    appearance:none;border:0;cursor:pointer;
    font:inherit;font-weight:500;font-size:15px;letter-spacing:-.005em;
    color:var(--btn-ink);background:var(--btn);
    padding:13px 30px;border-radius:999px;
    transition:transform .18s ease, opacity .45s ease, box-shadow .18s ease;
  }
  .unwrap:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
  .unwrap:active{transform:translateY(0) scale(.985);}
  .page.open .unwrap{opacity:0;pointer-events:none;}

  /* ---- the gift ---- */
  .gift{
    width:100%;
    display:flex;flex-direction:column;gap:0;
    opacity:0;transform:translateY(18px);
    transition:opacity .8s ease 1.35s, transform .8s cubic-bezier(.2,.7,.2,1) 1.35s;
  }
  .page.open .gift{opacity:1;transform:none;}
  .gift .eyebrow{text-align:left;margin-bottom:12px;}
  .gift h1{
    margin:0 0 8px;
    font-size:22px;font-weight:500;line-height:1.25;letter-spacing:-.015em;
    text-wrap:balance;
  }
  .gift .blurb{margin:0 0 22px;color:var(--ink-soft);max-width:34em;text-wrap:pretty;}
  .includes{
    list-style:none;margin:0 0 24px;padding:0;
    border-top:1px solid var(--line);
  }
  .includes li{
    display:flex;align-items:baseline;gap:12px;
    padding:11px 0;border-bottom:1px solid var(--line);
    font-size:14.5px;color:var(--ink);
  }
  .includes li::before{
    content:"";flex:none;width:6px;height:6px;border-radius:50%;
    background:var(--ribbon);transform:translateY(-1px);
  }
  .meta{
    display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;
    margin:0 0 22px;
    font-size:13px;color:var(--muted);
  }
  .meta dl{display:flex;gap:28px;margin:0;}
  .meta dt{margin:0 0 2px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;}
  .meta dd{margin:0;color:var(--ink);font-size:14px;}
  .meta dd.code{
    font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13.5px;letter-spacing:.04em;font-variant-numeric:tabular-nums;
  }
  .claim{
    display:flex;align-items:center;justify-content:center;
    width:100%;padding:15px 20px;border-radius:999px;
    font:inherit;font-weight:500;font-size:15px;letter-spacing:-.005em;
    color:var(--btn-ink);background:var(--btn);text-decoration:none;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .claim:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
  .claim:active{transform:translateY(0) scale(.99);}
  .fine{margin:14px 0 0;text-align:center;font-size:12.5px;color:var(--muted);}

  @media (max-width:420px){
    .page{padding-top:84px;}
    .back{padding:28px 26px 26px;}
    .face{min-height:400px;}
  }

  @media (prefers-reduced-motion: reduce){
    .card, .ribbon, .knot, .back > *, .gift, .glow, .eyebrow, .unwrap, .claim{transition:none !important;}
    .page.open .back > *{transition-delay:0s !important;}
  }
</style>

<a class="brand" href="https://everlab.com.au" aria-label="Everlab">
  <svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="12" height="2.6" rx="1.3"/><rect x="1" y="7.7" width="16" height="2.6" rx="1.3"/><rect x="3" y="13.4" width="12" height="2.6" rx="1.3"/></svg>
  <span>everlab</span>
</a>

<main class="page" id="page">
  <div class="glow" aria-hidden="true"></div>

  <div class="stage">
    <p class="eyebrow lead" id="lead">Sarah sent you something</p>

    <div class="scene">
      <div class="card" id="card" role="button" tabindex="0" aria-label="Unwrap your gift" aria-pressed="false">
        <div class="face front" aria-hidden="true">
          <div class="ribbon v"></div>
          <div class="ribbon h"></div>
          <svg class="knot" viewBox="0 0 120 96" aria-hidden="true">
            <path class="loop" d="M60 48C52 34 26 24 16 36c-9 11 8 26 28 24 8-1 13-5 16-12z"/>
            <path class="loop" d="M60 48c8-14 34-24 44-12 9 11-8 26-28 24-8-1-13-5-16-12z"/>
            <path class="loop" d="M60 50c-6 10-18 22-14 32 3 8 12 4 14-3 2 7 11 11 14 3 4-10-8-22-14-32z"/>
            <ellipse class="core" cx="60" cy="48" rx="9" ry="7"/>
          </svg>
          <span class="mark">
            <svg width="12" height="12" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="12" height="2.6" rx="1.3"/><rect x="1" y="7.7" width="16" height="2.6" rx="1.3"/><rect x="3" y="13.4" width="12" height="2.6" rx="1.3"/></svg>
            everlab
          </span>
          <span class="to" id="toLabel">for Julien</span>
        </div>
        <div class="face back">
          <p class="from" id="fromLabel">From Sarah</p>
          <p class="message" id="message"></p>
          <p class="sign" id="sign"></p>
        </div>
      </div>
    </div>

    <button class="unwrap" id="unwrap" type="button">Unwrap</button>

    <section class="gift" id="gift" aria-live="polite" hidden>
      <p class="eyebrow">Your gift</p>
      <h1 id="productName"></h1>
      <p class="blurb" id="productBlurb"></p>
      <ul class="includes" id="includes"></ul>
      <div class="meta">
        <dl>
          <div><dt>Gift code</dt><dd class="code" id="code"></dd></div>
          <div><dt>Valid until</dt><dd id="until"></dd></div>
        </dl>
      </div>
      <a class="claim" id="claim" href="#">Claim your gift</a>
      <p class="fine">Takes a couple of minutes. Nothing to pay.</p>
    </section>
  </div>
</main>

<script>
(function(){
  var GIFT_DEFAULTS = {
    to: 'Julien',
    from: 'Sarah',
    message: 'Happy birthday, Jules.\nYou spend the whole year looking after everyone else. This is a year of someone looking after you. Go and find out what your body has been trying to tell you.',
    sign: 'With love, S.',
    product: 'Everlab Complete Health Assessment',
    blurb: 'A full-body baseline: blood work across 100+ biomarkers, a consult with an Everlab doctor, and a personalised plan for the year ahead.',
    includes: ['Blood test across 100+ biomarkers', '60-minute consult with an Everlab doctor', 'Personalised health plan and follow-up'],
    code: 'EVL-7K2M-QX4',
    until: '8 September 2027',
    claim: 'https://everlab.com.au/'
  };

  var params = new URLSearchParams(location.search);
  function pick(key){
    var v = params.get(key);
    return (v && v.trim()) ? v.trim() : GIFT_DEFAULTS[key];
  }
  var gift = {
    to: pick('to'), from: pick('from'), message: pick('message'), sign: pick('sign'),
    product: pick('product'), blurb: pick('blurb'),
    includes: params.get('includes') ? params.get('includes').split('|').map(function(s){return s.trim();}).filter(Boolean) : GIFT_DEFAULTS.includes,
    code: pick('code'), until: pick('until'), claim: pick('claim')
  };
  // Only allow http(s) claim links.
  if(!/^https?:\/\//i.test(gift.claim)) gift.claim = GIFT_DEFAULTS.claim;

  var $ = function(id){ return document.getElementById(id); };
  $('lead').textContent = gift.from + ' sent you something';
  $('toLabel').textContent = 'for ' + gift.to;
  $('fromLabel').textContent = 'From ' + gift.from;
  $('message').textContent = gift.message;
  $('sign').textContent = gift.sign;
  $('productName').textContent = gift.product;
  $('productBlurb').textContent = gift.blurb;
  $('code').textContent = gift.code;
  $('until').textContent = gift.until;
  $('claim').href = gift.claim;
  document.title = 'Unwrap your Everlab gift';

  var list = $('includes');
  gift.includes.forEach(function(item){
    var li = document.createElement('li');
    li.textContent = item;
    list.appendChild(li);
  });

  var page = $('page'), card = $('card'), btn = $('unwrap'), giftEl = $('gift');
  var opened = false;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function open(){
    if(opened) return;
    opened = true;
    giftEl.hidden = false;
    // let the gift section paint in its hidden resting state before the transition starts
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        page.classList.add('open');
        card.setAttribute('aria-pressed','true');
        card.setAttribute('aria-label','Your gift message');
        card.removeAttribute('role');
        card.removeAttribute('tabindex');
        btn.setAttribute('aria-hidden','true');
        btn.tabIndex = -1;
      });
    });
    // once the gift has arrived, make sure it's on screen (mostly matters on phones)
    setTimeout(function(){
      var r = giftEl.getBoundingClientRect();
      if(r.bottom > window.innerHeight){
        giftEl.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'end'});
      }
    }, reduce ? 50 : 2200);
  }

  btn.addEventListener('click', open);
  card.addEventListener('click', open);
  card.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); }
  });
})();
</script>
