<meta charset="utf-8">
<title>Unwrap gift-FINAL</title>
<!--
  Everlab · gift reveal

  Two folds, one continuous page. State: intro → revealing → gift.

    Fold 1  white. The sender's message alone, resolving letter by letter,
            then a single "See my gift" button.
    Fold 2  dark. Rises from the bottom of the screen as a sheet and pushes
            fold 1 out through the top. Nothing on it but the gift card.

  Components (bottom of file):
    AnimatedQuote  splits the message into characters and resolves them into
                   focus one by one (blur → sharp, 3px rise, ~3s in total)
    GiftIntro      fold 1
    GiftCard       the gift itself, with the photo on its right column
    App            owns the state and the timing of the transition

  The photograph behind fold 2 (it peeks through a half circle at the bottom
  of fold 1, then the circle opens to fill the screen): set PHOTO below to a
  data: URI to ship it inside the page (the only way it can load on the
  artifact host), or pass ?image=https://... when the page is hosted by
  Everlab. With neither, a warm living-room gradient stands in.

  The link from the email can carry the gift on the query string. Every field
  is optional and falls back to GIFT_DEFAULTS.

    ?from=Marc
    &to=Sam
    &message=Happy%20Birthday.%0AI%20want%20you%20around%0Afor%20a%20long%20time.
        (%0A = a deliberate line break in the quote; three lines read best)
    &note=Wishing%20you%20a%20long%2C%20healthy%20life.
    &product=Everlab%20Protocol%20Membership
    &blurb=Twelve%20months%20of%20Everlab...        (the description in the card)
    &value=%241%2C950                               (total value, shown large in the card)
    &includes=A%2045-minute%20onboarding%20consult%7CAdvanced%20blood%20panel%7CDEXA%20scan
        (pipe-separated; each item is one line on desktop, so keep them short)
    &steps=Claim%20your%20gift%7CEnter%20your%20details;Meet%20your%20doctor%7CA%2045-minute%20consult
        (semicolon-separated steps, each "Title|Description")
    &claim=https%3A%2F%2Feverlab.com.au%2Factivate%3Fcode%3DEVL-7K2M-QX4
    &image=https%3A%2F%2F...  (the photograph behind fold 2; http(s) only)

  All text is inserted with textContent, never innerHTML.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Homemade+Apple&display=swap">
<style>
  /* Two deliberate worlds, painted explicitly: a white letter, then a dark room. */
  :root{
    /* fold 1 */
    --white:#FCFBF9;
    --ink:#171412;
    --ember:#D98B4A;   /* the colour a letter has while it's still out of focus */
    --ember-strength:1;     /* how much of it shows: 1 is full orange, 0 is none */
    --btn:#171412;
    --btn-ink:#FCFBF9;

    /* fold 2 */
    --night:#0E0C0B;
    --card:#161312;
    --card-hair:rgba(255,255,255,.09);
    --ink-d:#F3EFEA;
    --ink-d2:#B9B0A8;
    --muted-d:#7D746D;
    --hair-d:rgba(255,255,255,.10);
    --red:#C4655B;
    --btn-d:#F3EFEA;
    --btn-d-ink:#0E0C0B;
    --glow-a:rgba(222,150,84,.20);
    --glow-b:rgba(180,87,78,.12);

    /* the fold transition: a long slow start, then it commits fast and settles */
    --ease-scene:cubic-bezier(.9,0,.22,1);
    --ease-out:cubic-bezier(.22,.61,.24,1);
    /* the sequence after the click:
         0ms      the whole first-fold block scrolls up and out of the viewport (800ms)
         100ms    the viewport starts crossfading to dark (700ms)
         100ms    the card starts rising from the bottom at the same moment (1000ms)
         1100ms   settled */
    --fade-ms:800ms;
    --bg-delay:100ms;
    --bg-ms:700ms;
    --card-delay:100ms;
    --card-ms:1000ms;
    /* and in reverse (the arrow on fold 2):
         0ms      the card sinks back below the bottom edge (750ms)
         0ms      the viewport crossfades back to white at the same moment (700ms)
         400ms    the block settles back down into place (750ms)
         1150ms   settled */
    --back-card-ms:750ms;
    --back-hold:0ms;        /* the content fades in place while the card shrinks */
    --back-bg-delay:0ms;
    --back-text-delay:400ms;
    --back-text-ms:750ms;

    --sans:'Suisse Intl','Geist','Helvetica Neue',Helvetica,Arial,sans-serif;
    color-scheme:light;
  }

  *{box-sizing:border-box;}
  html{height:100%;}
  body{
    margin:0;min-height:100%;
    background:var(--white);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overflow:hidden;
    transition:background-color var(--bg-ms) ease var(--bg-delay);
  }
  body[data-state="revealing"],
  body[data-state="gift"]{background:var(--night);color-scheme:dark;}
  body[data-state="returning"]{background:var(--white);transition-delay:var(--back-bg-delay);}

  /* the photograph behind fold 2. On fold 1 only the top of a circle shows at
     the bottom edge, like a sun about to rise; on click the circle opens
     until it fills the viewport and becomes the room. */
  /* The circle IS the photograph: a round element centred on the bottom edge
     whose background is the image. Closed, it is a small circle holding the
     photo at half size (the couple sits in the dome); open, it is a circle
     large enough to cover the viewport, holding the photo at exactly the size
     and position of a full-screen cover. Because the image is the element's
     own background, it can never show an edge inside the circle. The sizes
     and offsets are computed in JS (layoutScene) and written as custom
     properties, so every one of them interpolates. */
  .scene-bg{
    position:absolute;left:50%;top:100%;z-index:1;pointer-events:none;
    width:var(--d0);height:var(--d0);
    /* hidden until the message and the button have landed, then it scales up */
    transform:translate(-50%,-50%) scale(0);
    border-radius:50%;
    overflow:hidden;
    /* stand-in until the photo ships: a cosy wood-toned living room in low warm light */
    background-image:
      radial-gradient(38% 30% at 70% 22%, rgba(255,196,120,.55), transparent 70%),
      radial-gradient(60% 40% at 25% 85%, rgba(20,10,5,.7), transparent 70%),
      radial-gradient(70% 60% at 55% 60%, rgba(140,88,44,.5), transparent 70%),
      linear-gradient(180deg, #4A2E1B 0%, #2E1B10 55%, #150C08 100%);
    background-color:#2E1B10;
    background-repeat:no-repeat;
    background-size:var(--bw0) var(--bh0);
    background-position:var(--bx0) var(--by0);
    transition:
      transform 1100ms cubic-bezier(.2,.7,.2,1),
      width var(--card-ms) var(--ease-scene) var(--bg-delay),
      height var(--card-ms) var(--ease-scene) var(--bg-delay),
      background-size var(--card-ms) var(--ease-scene) var(--bg-delay),
      background-position var(--card-ms) var(--ease-scene) var(--bg-delay);
  }
  body.orb-in .scene-bg{transform:translate(-50%,-50%) scale(1);}
  body[data-state="revealing"] .scene-bg,
  body[data-state="gift"] .scene-bg{
    width:var(--d1);height:var(--d1);
    background-size:var(--bw1) var(--bh1);
    background-position:var(--bx1) var(--by1);
  }
  body[data-state="returning"] .scene-bg{transition-duration:var(--back-card-ms);transition-delay:var(--back-hold);}
  /* a light dim on the peeking photo, so it sits back from the white page */
  .scene-bg::after{
    content:"";position:absolute;inset:0;background:rgba(14,12,11,.22);
    transition:opacity var(--card-ms) ease var(--bg-delay);
  }
  body[data-state="revealing"] .scene-bg::after,
  body[data-state="gift"] .scene-bg::after{opacity:0;}
  /* the room's darkening, viewport-relative so the columns below read;
     comes up as the circle opens */
  .dim{
    position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg, rgba(14,12,11,.45), rgba(14,12,11,.62) 55%, rgba(14,12,11,.85));
    opacity:0;
    transition:opacity var(--card-ms) ease var(--bg-delay);
  }
  body[data-state="revealing"] .dim,
  body[data-state="gift"] .dim{opacity:1;}
  body[data-state="returning"] .dim,
  body[data-state="returning"] .scene-bg::after{transition-duration:var(--back-card-ms);transition-delay:var(--back-hold);}

  /* the seed: a glass half circle inside the photo dome, concentric with it,
     the card's own surface with nothing in it yet. On the reveal it morphs into
     the card's exact rectangle (left/top/width/height/radius written by JS),
     then the card takes its place and the content fades in. */
  .seed{
    position:absolute;z-index:2;pointer-events:none;
    background:rgba(40,38,36,.36);
    -webkit-backdrop-filter:blur(60px) saturate(1.15);backdrop-filter:blur(60px) saturate(1.15);
    border-radius:50%;
    transform:scale(0);
    /* the morph itself (left/top/width/height/radius) is one Web Animation
       driven from the script, so the four sides always move together */
    transition:transform 1100ms cubic-bezier(.2,.7,.2,1);
  }
  body.orb-in .seed{transform:scale(1);}
  body[data-motion="static"] .seed{display:none !important;}
  /* dynamic: the card does not rise and has no glass of its own; the seed,
     sitting exactly behind it, is its surface for the whole visit (so there is
     never a swap to flash), and only the content fades in and out */
  body[data-motion="dynamic"] .card{transform:none;opacity:1;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;transition:none;}
  body[data-motion="dynamic"] .card .info, body[data-motion="dynamic"] .card-head{opacity:0;transition:opacity 600ms ease calc(var(--card-delay) + var(--card-ms) + 50ms);}
  body[data-motion="dynamic"][data-state="revealing"] .card .info, body[data-motion="dynamic"][data-state="revealing"] .card-head,
  body[data-motion="dynamic"][data-state="gift"] .card .info, body[data-motion="dynamic"][data-state="gift"] .card-head{opacity:1;}
  body[data-motion="dynamic"][data-state="returning"] .card .info, body[data-motion="dynamic"][data-state="returning"] .card-head{opacity:0;transition:opacity 350ms ease 0s;}
  /* nothing inside the card moves on the way back; it only fades */
  body[data-motion="dynamic"][data-state="returning"] .act{transform:none;}

  /* warm glow that belongs to the dark room; fades in with the background */
  .glow{
    position:absolute;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(70% 50% at 50% -10%, var(--glow-a), transparent 70%),
      radial-gradient(50% 40% at 50% 110%, var(--glow-b), transparent 70%);
    opacity:0;
    transition:opacity var(--bg-ms) ease var(--bg-delay);
  }
  /* the warm halo that used to come up with the room is off */
  .glow{display:none;}
  body[data-state="returning"] .glow{opacity:0;transition-delay:var(--back-bg-delay);}

  :focus-visible{outline:2px solid currentColor;outline-offset:4px;border-radius:999px;}

  /* ---- fold 1 ---- */
  .intro{
    position:absolute;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;
  }
  /* on click the whole block (eyebrow, message, button) travels 256px up while
     it fades and softens out of focus, all together; the room changes behind it */
  .stack{
    display:flex;flex-direction:column;align-items:center;
    will-change:transform,opacity,filter;
    transition:transform var(--fade-ms) var(--ease-scene), opacity calc(var(--fade-ms) * .7) ease calc(var(--fade-ms) * .2), filter var(--fade-ms) ease;
  }
  /* dynamic: when the circle rises, the block moves up 64px to make room */
  body.orb-in .stack{transform:translateY(-64px);transition:transform 1.3s var(--ease-out);}
  body[data-state="revealing"] .intro,
  body[data-state="gift"] .intro{pointer-events:none;}
  body[data-state="revealing"] .stack,
  body[data-state="gift"] .stack{
    transform:translateY(-256px);opacity:0;filter:blur(8px);
    transition:transform var(--fade-ms) var(--ease-scene), opacity calc(var(--fade-ms) * .7) ease calc(var(--fade-ms) * .2), filter var(--fade-ms) ease;
  }
  body[data-state="gift"] .intro{visibility:hidden;}
  /* coming back: the block settles down into focus once the room is light again */
  body[data-state="returning"] .stack{
    transform:translateY(-64px);opacity:1;filter:none;
    transition:transform var(--back-text-ms) var(--ease-out) var(--back-text-delay),
               opacity var(--back-text-ms) ease var(--back-text-delay),
               filter var(--back-text-ms) ease var(--back-text-delay);
  }

  .quote{
    margin:0;
    max-width:min(92cqw, 17em);
    text-align:center;
    font-weight:500;
    font-size:clamp(29px, 4.2cqw + 12px, 64px);
    /* 6px tighter than .98; floored at .8em so lines never overlap on phones */
    line-height:max(calc(.98em - 6px), .9em);
    letter-spacing:-.034em;
    color:var(--ink);
    text-wrap:balance;
  }
  .quote .w{white-space:nowrap;}
  /* the sender's signature: a script face, overlapping the bottom right of the
     title, inclined a little; it writes itself on after the title */
  .quote-wrap{position:relative;display:flex;justify-content:center;max-width:100%;}
  .sig{
    position:absolute;left:0;top:0;  /* placed over the last word by the script */
    font-family:'Homemade Apple','Segoe Script','Bradley Hand',cursive;font-weight:400;
    font-size:clamp(20px, 1.9cqw + 6px, 32px);line-height:1;letter-spacing:.02em;
    color:var(--ink);white-space:nowrap;
    transform:rotate(-7deg);transform-origin:left center;
    opacity:0;clip-path:inset(-20% 100% -20% -10%);
    transition:opacity .3s ease, clip-path 1.1s cubic-bezier(.3,0,.3,1);
  }
  .sig.sig-in{opacity:1;clip-path:inset(-20% -10% -20% -10%);}
  body[data-motion="static"] .sig{opacity:1;clip-path:none;transition:none;}
  body[data-sig="off"] .sig{display:none;}
  /* each line is a row that opens from nothing shortly before its letters
     start, so the centred block grows from the middle: the first line is
     pushed up by the second, both by the third */
  .quote .line{
    display:grid;grid-template-rows:0fr;
    animation:line-open 1500ms cubic-bezier(.25,.1,.25,1) var(--ld, 0ms) both;
  }
  .quote .line-in{min-height:0;}
  @keyframes line-open{from{grid-template-rows:0fr;}to{grid-template-rows:1fr;}}
  /* each letter comes up quickly, then takes its time sharpening out of the
     blur. The warmth is a separate animation lasting three stagger steps
     (--stag × 3) and fading linearly, so at any moment the newest letter is
     warmest, the one before it less, the one before that barely: a short
     gradient trailing the leading edge. --e lets the last word carry less of
     it; --dur is the sharpening time. */
  .quote .c{
    position:relative;display:inline;
    opacity:0;top:3px;filter:blur(7px);
    --warm:color-mix(in srgb, var(--ember) calc(var(--e, 100%) * var(--ember-strength)), var(--ink));
    --halo:color-mix(in srgb, rgba(240,130,50,.55) calc(var(--e, 100%) * var(--ember-strength)), transparent);
    color:var(--ink);
    animation:
      resolve var(--dur, 1640ms) cubic-bezier(.45,0,.2,1) var(--d) both,
      ember calc(var(--dur, 1640ms) * .7) cubic-bezier(.3,0,.5,1) var(--d) both;
  }
  /* the letter eases up and sharpens along one smooth curve; it is orange for
     as long as it is out of focus (the warmth fades over 70% of the sharpening
     time), so every word arrives orange and blurred and settles white and sharp */
  @keyframes resolve{
    0%{opacity:0;top:3px;filter:blur(7px);}
    35%{opacity:.7;top:1.5px;filter:blur(4px);}
    70%{opacity:.95;top:.4px;filter:blur(1.2px);}
    100%{opacity:1;top:0;filter:blur(0);}
  }
  @keyframes ember{
    0%{color:var(--warm);text-shadow:0 0 12px var(--halo);}
    100%{color:var(--ink);text-shadow:0 0 0 rgba(232,140,60,0);}
  }

  /* a plain mono line above the message: a black square, then who sent it */
  .chip{
    margin:0 0 clamp(26px, 4cqh, 40px);
    display:inline-flex;align-items:center;gap:12px;
    font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink);
    opacity:0;transform:translateY(4px);
    animation:chip-in 700ms var(--ease-out) 650ms both;
  }
  .chip::before{content:"";width:7px;height:7px;background:#E8722A;}
  /* on the first fold the square blinks once a second, like a cursor */
  .intro .chip::before{animation:blink 1s steps(1, end) infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.15;}}
  @keyframes chip-in{to{opacity:1;transform:none;}}
  /* the eyebrow's letters resolve the same way as the message, ahead of it */
  .chip .c{
    position:relative;display:inline;
    opacity:0;top:2px;filter:blur(5px);
    --warm:color-mix(in srgb, var(--ember) calc(var(--e, 100%) * var(--ember-strength)), var(--ink));
    --halo:color-mix(in srgb, rgba(217,139,74,.4) calc(var(--e, 100%) * var(--ember-strength)), transparent);
    color:var(--ink);
    animation:
      resolve var(--dur, 700ms) cubic-bezier(.45,0,.2,1) var(--d) both,
      ember calc(var(--dur, 700ms) * .7) cubic-bezier(.3,0,.5,1) var(--d) both;
  }
  .chip .w{white-space:nowrap;}
  /* the authored break before "special" only shows on phones */
  @container stage (min-width:821px){ .chip br{display:none;} }

  .pill{
    appearance:none;border:0;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--sans);font-weight:500;font-size:17px;letter-spacing:-.004em;
    color:var(--btn-ink);background:var(--btn);
    padding:15px 30px;border-radius:999px;
    text-decoration:none;
    transition:transform .35s var(--ease-out), background-color .35s var(--ease-out),
               opacity .7s var(--ease-out), filter .7s var(--ease-out);
  }
  .pill:hover{background:#2A2522;}  /* colour only, no lift or scale */
  .pill:active{transform:scale(.985);}

  /* the button's row opens from nothing, so the message and eyebrow above are
     pushed up as it arrives, the same way the lines pushed each other */
  /* the button's row and spacing are there from the start (nothing grows);
     it arrives with a fade and a short rise only */
  .intro .cta{
    display:grid;grid-template-rows:1fr;
    margin-top:clamp(40px, 6cqh, 64px);
    opacity:0;transform:translateY(18px);
    transition:opacity .9s var(--ease-out), transform .9s var(--ease-out);
  }
  .intro .cta-box{min-height:0;display:flex;justify-content:center;}
  .intro.cta-in .cta{opacity:1;transform:none;}
  .intro .cta .pill{position:relative;z-index:1;}

  /* ---- fold 2: the dark room; the card rises into it from the bottom ---- */
  .gift{
    position:absolute;inset:0;z-index:3;
    overflow:hidden;
    color:var(--ink-d);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 24px;
    visibility:hidden;
  }
  /* the card lands in the centre of the first screen; the columns wait below */
  .hero{
    width:100%;height:100%;flex:none;max-width:561px;
    display:grid;grid-template-columns:minmax(0, 1fr);gap:52px;
    align-content:center;justify-content:center;
    padding:96px 0 64px;  /* clear of the logo above and the footer below */
  }
  body[data-state="revealing"] .gift,
  body[data-state="gift"] .gift,
  body[data-state="returning"] .gift{visibility:visible;}

  /* the wordmark, ink on the white fold, white once the room is dark */
  .logo{
    position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:5;
    display:block;color:var(--ink);
    transition:color var(--bg-ms) ease var(--bg-delay);
  }
  .logo svg{display:block;height:25px;width:auto;}
  /* the order of arrival: wordmark, eyebrow, message, button, circle */
  body[data-motion="dynamic"] .logo{opacity:0;animation:logo-in 700ms var(--ease-out) 150ms both;}
  @keyframes logo-in{to{opacity:1;}}
  body[data-state="revealing"] .logo,
  body[data-state="gift"] .logo{color:var(--ink-d);}
  body[data-state="returning"] .logo{transition-delay:var(--back-hold);transition-duration:var(--back-card-ms);}

  /* the way back up, top right */
  .back{
    position:absolute;top:22px;right:22px;z-index:4;
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    appearance:none;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.16);
    -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
    color:var(--ink-d2);cursor:pointer;
    opacity:0;pointer-events:none;
    /* appears once the card has landed (the gift state starts as it settles) */
    transition:opacity .8s var(--ease-out) 250ms, background-color .3s ease, color .3s ease, border-color .3s ease;
  }
  .back:hover{background:rgba(255,255,255,.24);color:var(--ink-d);border-color:rgba(255,255,255,.22);}
  .back svg{display:block;}
  body[data-state="gift"] .back{opacity:1;pointer-events:auto;}
  body[data-state="returning"] .back{opacity:0;transition-delay:0s;transition-duration:.4s;}

  .card{
    position:relative;
    width:100%;max-width:1080px;
    flex:none;
    margin:0;
    background:rgba(40,38,36,.36);
    -webkit-backdrop-filter:blur(60px) saturate(1.15);backdrop-filter:blur(60px) saturate(1.15);
    border-radius:44px;
    display:grid;grid-template-columns:minmax(0, 1fr);
    max-height:100%;
    overflow:hidden;
    transform:translateY(110cqh);
    will-change:transform;
    transition:transform var(--card-ms) var(--ease-scene) var(--card-delay);
  }
  body[data-state="revealing"] .card,
  body[data-state="gift"] .card{transform:none;}
  body[data-state="returning"] .card{transform:translateY(110cqh);transition:transform var(--back-card-ms) var(--ease-scene) 0s;}

  .card-head:empty{display:none;}
  .card .info{padding:40px;display:flex;flex-direction:column;justify-content:flex-start;min-height:0;min-width:0;}
  .kicker{
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    margin:0 0 10px;
  }
  .mono-label{
    margin:0;
    font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-d);
  }
  .blurb{
    margin:0 0 22px;max-width:34em;padding-right:88px;  /* clear of the image column, like the title */
    font-size:16px;line-height:20px;color:var(--ink-d2);
    text-wrap:pretty;
  }
  .value{display:flex;flex-direction:column;gap:6px;margin:0 0 30px;}
  .value b{
    font-weight:500;font-size:clamp(26px, 1.4cqw + 16px, 34px);line-height:1;letter-spacing:-.03em;
    color:var(--ink-d);font-variant-numeric:tabular-nums;
  }

  /* the journey, horizontal: square, line, square, line ... a title under each */
  .timeline{
    list-style:none;margin:0;padding:0;
    display:grid;grid-template-columns:repeat(5, minmax(0,1fr));gap:0;
  }
  .timeline li{
    position:relative;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:0 4px;text-align:center;
  }
  /* squares: filled white at 20%, the current one Everlab red */
  .timeline li i{
    display:block;width:10px;height:10px;flex:none;
    border:0;background:rgba(255,255,255,.2);
  }
  .timeline li.now i{background:var(--red);border-color:var(--red);}
  .timeline li span{font-size:12.5px;line-height:1.3;color:var(--muted-d);white-space:nowrap;}
  .timeline li.now span{color:var(--ink-d);font-weight:500;}
  /* a half-pixel line from 6px right of this square to 6px left of the next
     (the squares sit at the centres of equal columns) */
  .timeline li:not(:last-child)::before{
    content:"";position:absolute;top:4.75px;height:.5px;
    left:calc(50% + 11px);right:calc(-50% + 11px);
    background:rgba(243,239,234,.3);
  }
  /* on the current step's segment a soft orange pulse travels along the line */
  .timeline li.now:not(:last-child)::after{
    content:"";position:absolute;top:4.75px;height:.5px;
    left:calc(50% + 11px);right:calc(-50% + 11px);
    background:linear-gradient(90deg, transparent, #E8722A 35%, #E8722A 65%, transparent) no-repeat;
    background-size:45% 100%;
    animation:flow 2.2s cubic-bezier(.45,0,.55,1) infinite;
  }
  @keyframes flow{from{background-position:-80% 0;}to{background-position:180% 0;}}

  /* below the card */
  .more{
    width:100%;max-width:1080px;
    margin-top:8px;
    max-width:760px;
    display:grid;grid-template-columns:1fr;gap:64px;
    align-items:start;
    opacity:0;transform:translateY(18px);
    /* half a second after the card has landed (card-delay + card-ms + 500) */
    transition:opacity .9s var(--ease-out) 1600ms, transform .9s var(--ease-out) 1600ms;
  }
  body[data-state="revealing"] .more,
  body[data-state="gift"] .more{opacity:1;transform:none;}
  body[data-state="returning"] .more{opacity:0;transition-delay:0s;transition-duration:.4s;}
  .block{display:flex;flex-direction:column;gap:14px;min-width:0;}
  .steps{list-style:none;margin:0;padding:0;counter-reset:step;}
  .steps li{
    counter-increment:step;
    display:grid;grid-template-columns:32px minmax(0,1fr);gap:14px;align-items:baseline;
    padding:13px 0;border-bottom:1px solid var(--hair-d);
  }
  .steps li::before{
    content:counter(step, decimal-leading-zero);
    font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px;letter-spacing:.06em;color:var(--muted-d);
  }
  .steps b{display:block;font-weight:500;font-size:15px;color:var(--ink-d);margin-bottom:3px;}
  .steps span{display:block;font-size:14px;line-height:1.5;color:var(--ink-d2);}
  /* the same mono line as fold 1, on the dark ground */
  .kicker .chip{
    margin:0;animation:none;opacity:1;transform:none;
    font-size:11.5px;gap:10px;color:var(--ink-d);
  }
  .kicker .chip::before{background:#E8722A;}
  .title-row{display:flex;align-items:center;gap:14px;margin:0 0 14px;}
  .title-row .orb{width:44px;height:44px;border-radius:50%;flex:none;display:block;}
  .card h2, .card-head h2{
    margin:0;
    font-weight:500;
    font-size:clamp(24px, 1.1cqw + 14px, 30px);line-height:1.08;letter-spacing:-.025em;
    color:var(--ink-d);
    text-wrap:balance;
  }
  /* what's included: the label above, then plain rows with an icon each, no card, no dividers */
  .incl-wrap{margin-top:0;padding-top:2px;display:flex;flex-direction:column;gap:14px;}
  .incl{list-style:none;margin:0;padding:0;}
  .incl li{
    display:grid;grid-template-columns:22px minmax(0,1fr);gap:14px;align-items:center;
    padding:6px 0;
    font-size:14px;line-height:1.4;color:var(--ink-d);text-wrap:pretty;
  }
  .incl li svg{display:block;width:18px;height:18px;stroke:var(--ink-d2);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
  /* Card tweak "Cards": three mini cards in a row below the card, in place of the timeline */
  .steps{display:none;flex-direction:column;gap:14px;}
  body[data-card="cards"] .steps{display:flex;}
  /* three chips; one is active at a time and hands over to the next after
     STEP_MS, the two states fading into each other; the description below
     crossfades with it */
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip-btn{
    position:relative;overflow:hidden;appearance:none;cursor:pointer;
    border:1px solid rgba(255,255,255,.14);border-radius:999px;background:transparent;
    padding:9px 16px;font:inherit;font-size:13px;font-weight:500;line-height:1.2;letter-spacing:.01em;
    color:var(--muted-d);transition:color .4s ease, border-color .4s ease, background-color .4s ease;
  }
  .chip-btn{display:inline-flex;align-items:center;gap:9px;padding:7px 16px 7px 7px;}  /* 7px round the circle on three sides */
  .chip-btn .n{
    display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;flex:none;
    border:1px solid rgba(255,255,255,.16);font-style:normal;
    font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;line-height:1;color:var(--muted-d);
    transition:background-color .4s ease, color .4s ease, border-color .4s ease;
  }
  .chip-btn.on .n{background:var(--ink-d);border-color:var(--ink-d);color:#1A1816;}
  .chip-btn:hover{color:var(--ink-d);}
  .chip-btn.on{color:var(--ink-d);border-color:transparent;background:rgba(255,255,255,.14);}
  .step-desc{margin:0;min-height:3em;  /* two lines at line-height 1.5 */
    font-size:14px;line-height:1.5;color:var(--ink-d2);text-wrap:pretty;transition:opacity .22s ease;}
  .step-desc.swap{opacity:0;}
  /* Cards: the side column is a second card in the same glass, tucked behind
     the hero card so only its bottom shows. It starts flush at the hero card's
     bottom edge with square top corners; two small glass fillers, masked to
     the outside of the hero card's rounded corners, close the notches so the
     panel reads as continuing up behind the card */
  body[data-card="cards"] .hero{gap:0 !important;}  /* flush: the panel starts at the card's bottom edge, on every screen */
  body[data-card="cards"] .gift{overflow-y:auto;justify-content:flex-start;}
  body[data-card="cards"] .hero{height:100%;min-height:0;padding:160px 0 160px;}  /* 160px above and below the stack */
  body[data-card="cards"] .incl li{padding:4px 0;}
  body[data-card="cards"] .incl-wrap{gap:10px;}
  body[data-card="cards"] .card .info{padding-top:40px;padding-bottom:40px;}
  body[data-card="cards"] .card{max-height:var(--card-max, none);}  /* the script caps it so card + panel fit the frame */
  /* the card's upper part scrolls on its own (no visible bar; a fade at both
     ends once it can scroll); the button below it never moves */
  .info-scroll{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none;}
  .info-scroll::-webkit-scrollbar{display:none;}
  .info-scroll.can-scroll{
    -webkit-mask:linear-gradient(180deg, transparent, #000 28px, #000 calc(100% - 28px), transparent);
    mask:linear-gradient(180deg, transparent, #000 28px, #000 calc(100% - 28px), transparent);
  }
  .side-clip{display:contents;}
  .side-in{display:flex;flex-direction:column;gap:14px;min-width:0;}
  body[data-card="cards"] .side{--r:44px;position:relative;justify-content:flex-start;padding:0;}
  body[data-card="cards"] .side-clip{display:block;overflow:hidden;border-radius:0 0 var(--r) var(--r);}
  body[data-card="cards"] .side-in{gap:12px;padding:10px 40px 40px;}  /* the foot matches the sides */
  /* the panel's surface: one element in the stage, behind the hero card's
     glass, sized by the script to the card's width and the panel's height
     plus the corner radius, so it runs up under the card and the card's
     rounded bottom simply sits over it: no seam, no fillers */
  .panel-clip{position:absolute;z-index:1;pointer-events:none;display:none;overflow:hidden;}
  body[data-card="cards"] .panel-clip{display:block;}
  .panel-bg{
    position:absolute;left:0;width:100%;
    background:var(--panel-bg, rgba(197,164,150,.24));  /* the Panel tweak: colour, opacity and blur */
    -webkit-backdrop-filter:var(--panel-filter, none);backdrop-filter:var(--panel-filter, none);
    /* the script sets a clip path: the panel's rectangle plus the two notches
       outside the card's rounded bottom corners, and nothing under the glass */
  }
  }
  /* dynamic: once the hero card has landed the panel slides down from behind
     it (its own height, inside the clip, so it emerges from the card's bottom
     edge) over 0.8s from 1.0s; the corner fillers fade in as it settles. On
     the way back it slides up under the card again */
  body[data-motion="dynamic"][data-card="cards"] .side-in{transform:translateY(-100%);transition:transform .8s var(--ease-out);}
  body[data-motion="dynamic"][data-card="cards"][data-state="revealing"] .side-in,
  body[data-motion="dynamic"][data-card="cards"][data-state="gift"] .side-in{transform:none;transition-delay:1000ms;}
  body[data-motion="dynamic"][data-card="cards"][data-state="returning"] .side-in{transform:translateY(-100%);transition:transform .35s ease 0s;}
  body[data-motion="dynamic"][data-card="cards"] .panel-bg{transform:translateY(calc(-100% + var(--r, 44px)));transition:transform .8s var(--ease-out);}
  body[data-motion="dynamic"][data-card="cards"][data-state="revealing"] .panel-bg,
  body[data-motion="dynamic"][data-card="cards"][data-state="gift"] .panel-bg{transform:none;transition:transform .8s var(--ease-out) 1000ms;}
  body[data-motion="dynamic"][data-card="cards"][data-state="returning"] .panel-bg{transform:translateY(calc(-100% + var(--r, 44px)));transition:transform .35s ease 0s;}
  /* the label above the mini cards, Cards only; the column's gap sits between */
  .next-label{display:none;margin:0 0 6px;color:rgba(243,239,234,.62);}  /* 18px to the chips with the column gap */
  body[data-card="cards"] .next-label{display:block;}
  body[data-motion="dynamic"] .next-label{opacity:0;transition:opacity .5s ease;}
  body[data-motion="dynamic"][data-state="revealing"] .next-label,
  body[data-motion="dynamic"][data-state="gift"] .next-label{opacity:1;transition-delay:1000ms;}
  body[data-motion="dynamic"][data-state="returning"] .next-label{opacity:0;transition:opacity .25s ease 0s;}
  body[data-card="cards"] .timeline{display:none;}
  /* dynamic: like the timeline steps, the three arrive one after another */
  /* the sender's note, under the value */
  .note{
    margin:auto 0 0;padding-top:26px;border-top:1px solid var(--hair-d);  /* pushed to the bottom of the column */
    font-weight:300;font-size:16.5px;line-height:1.45;letter-spacing:-.01em;color:var(--ink-d2);
    text-wrap:pretty;
  }
  .note .who{display:block;margin-top:8px;font-size:13px;color:var(--muted-d);font-weight:400;letter-spacing:0;}
  /* the button sits under the card, centred, and fades in once the card has landed */
  .act-float{display:none;pointer-events:none;}
  body[data-state="gift"] .act-float{pointer-events:auto;}
  /* the button: centred at the foot of the right column, 70% of its width */
  .act{
    margin-top:auto;padding-top:30px;
    display:flex;justify-content:center;
    opacity:0;transform:translateY(10px);
    transition:opacity .7s var(--ease-out) 1100ms, transform .7s var(--ease-out) 1100ms;
  }
  body[data-state="revealing"] .act,
  body[data-state="gift"] .act{opacity:1;transform:none;}
  body[data-state="returning"] .act{opacity:0;transition-delay:0s;transition-duration:.3s;}
  .act .pill{color:var(--btn-d-ink);background:var(--btn-d);padding:16px 30px;width:100%;font-size:16px;font-weight:500;}
  .act .pill:hover{background:#FFFFFF;}

  /* the membership passport card: copper texture, mark, MEMBER pill, name, term */
  .pass{
    position:relative;width:100%;aspect-ratio:1.62;border-radius:18px;overflow:hidden;
    color:#FFF7F0;flex:none;
    background:linear-gradient(135deg,#C97A52 0%,#A8552F 45%,#7E3A22 100%);
    box-shadow:0 1px 0 rgba(255,255,255,.12) inset;
  }
  .pass-tex{position:absolute;inset:-40%;background-size:cover;background-position:center;opacity:.9;filter:saturate(1.05) blur(64px);}
  .pass-dots{display:none;}
  .pass .pass-mark{position:absolute;top:18px;left:18px;height:26px;width:26px;color:#fff;}
  .pass-tag{
    position:absolute;top:18px;right:18px;
    font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    padding:6px 12px;border:1px solid rgba(255,255,255,.8);border-radius:999px;
  }
  .pass-name{position:absolute;left:18px;bottom:16px;display:flex;flex-direction:column;}
  .pass-name b{font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1;}
  .pass-name span{font-size:12px;opacity:.85;margin-top:5px;}
  .pass-term{position:absolute;right:18px;bottom:16px;display:flex;flex-direction:column;align-items:flex-end;}
  .pass-term b{font-size:20px;font-weight:500;letter-spacing:-.02em;line-height:1;}
  .pass-term span{font-size:12px;opacity:.85;margin-top:5px;}
  /* inside the glass card the passport is a small 128×72 tile at the top right,
     beside the title: the mark and the term only */
  .card .pass{position:absolute;top:40px;right:40px;width:64px;height:64px;aspect-ratio:auto;border-radius:50%;}  /* a circle of the image, nothing on it */
  .card .pass .pass-tag, .card .pass .pass-name, .card .pass .pass-term{display:none;}
  .card .pass .pass-mark{display:none;}
  .card .pass .pass-tex{inset:0;filter:none;opacity:1;}
  .card .pass::after{display:none;}
  /* more light inside the tile: a warm highlight top left, a deep shadow bottom right */
  .card .pass::after{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(90% 110% at 18% 10%, rgba(255,214,170,.6), transparent 62%),
      radial-gradient(80% 90% at 88% 95%, rgba(96,30,12,.75), transparent 66%),
      linear-gradient(160deg, rgba(255,255,255,.12), transparent 45%);
  }
  .card .pass .pass-mark{top:10px;left:10px;width:18px;height:18px;}
  .card .pass .pass-term{right:11px;bottom:9px;}
  .card .pass .pass-term b{font-size:12px;letter-spacing:-.01em;}
  .title-row{padding-right:88px;}

  /* fold 2 layout: the side sits outside the card, over the photograph;
     the passport card, then what's next, then the button. It rises after the card. */
  .side{
    position:relative;min-width:0;
    display:flex;flex-direction:column;justify-content:center;gap:14px;padding:0;
    transform:translateY(110cqh);
    will-change:transform;
    transition:transform var(--card-ms) var(--ease-scene) calc(var(--card-delay) + 120ms);
  }
  body[data-state="revealing"] .side,
  body[data-state="gift"] .side{transform:none;}
  /* dynamic: the timeline does not slide; its four steps appear one after
     another over about two seconds once the card has landed */
  body[data-motion="dynamic"] .side{transform:none !important;transition:none;}
  body[data-motion="dynamic"] .timeline li{opacity:0;transform:translateY(6px);transition:opacity .5s ease, transform .5s ease;}
  body[data-motion="dynamic"][data-state="revealing"] .timeline li,
  body[data-motion="dynamic"][data-state="gift"] .timeline li{opacity:1;transform:none;}
  body[data-motion="dynamic"][data-state="revealing"] .timeline li:nth-child(1),
  body[data-motion="dynamic"][data-state="gift"] .timeline li:nth-child(1){transition-delay:1200ms;}
  body[data-motion="dynamic"][data-state="revealing"] .timeline li:nth-child(2),
  body[data-motion="dynamic"][data-state="gift"] .timeline li:nth-child(2){transition-delay:1550ms;}
  body[data-motion="dynamic"][data-state="revealing"] .timeline li:nth-child(3),
  body[data-motion="dynamic"][data-state="gift"] .timeline li:nth-child(3){transition-delay:1900ms;}
  body[data-motion="dynamic"][data-state="revealing"] .timeline li:nth-child(4),
  body[data-motion="dynamic"][data-state="gift"] .timeline li:nth-child(4){transition-delay:2250ms;}
  body[data-motion="dynamic"][data-state="revealing"] .timeline li:nth-child(5),
  body[data-motion="dynamic"][data-state="gift"] .timeline li:nth-child(5){transition-delay:2600ms;}
  body[data-motion="dynamic"][data-state="returning"] .timeline li{opacity:0;transition:opacity .25s ease 0s;}
  body[data-state="returning"] .side{transform:translateY(110cqh);transition:transform var(--back-card-ms) var(--ease-scene) 0s;}
  .side .mono-label{margin-top:10px;}
  .side .timeline li span{color:rgba(243,239,234,.62);}
  .side .timeline li.now span{color:var(--ink-d);}
  .side .timeline li:not(:last-child)::before{background:rgba(243,239,234,.28);}

  .foot{
    position:absolute;left:0;right:0;bottom:22px;
    margin:0;flex:none;white-space:nowrap;text-align:center;justify-content:center;
    display:flex;align-items:center;gap:10px;
    font-size:13px;color:var(--muted-d);
    opacity:0;transform:translateY(8px);
    transition:opacity .9s var(--ease-out) 1900ms, transform .9s var(--ease-out) 1900ms;
  }
  body[data-state="returning"] .foot{opacity:0;transition-delay:0s;transition-duration:.4s;}
  body[data-state="revealing"] .foot,
  body[data-state="gift"] .foot{opacity:1;transform:none;}
  .foot svg rect{fill:var(--muted-d);}
  .foot b{font-weight:500;color:var(--ink-d2);}

  @container stage (min-width:821px) and (max-height:800px){
    .hero{padding:80px 0 52px;}
    .card .info{padding:22px 26px;}
    .card .pass{top:22px;right:26px;}
    .hero{gap:44px;}
    .side{gap:12px;}
    .card{border-radius:32px;}
    body[data-card="cards"] .side{--r:32px;}
    body[data-card="cards"] .side-in{padding:8px 26px 14px;gap:10px;}
    body[data-card="cards"] .hero{padding-top:96px;}
    .title-row{margin-bottom:8px;}
    .title-row .orb{width:36px;height:36px;}
    .card h2, .card-head h2{font-size:clamp(22px, 1cqw + 13px, 26px);}
    .blurb{margin-bottom:0;font-size:13.5px;}
    .incl-wrap{gap:10px;padding-top:10px;}
    .incl li{padding:3px 0;font-size:13px;}
    .side .mono-label{margin-top:4px;}
    .pass{aspect-ratio:1.9;}
    .pass-name b{font-size:22px;}
    .act{padding-top:16px;}
    .act .pill{padding:13px 24px;font-size:15px;}
    .logo{top:30px;}
    .logo svg{height:20px;}
    .back{top:22px;}
  }
  @container stage (max-width:820px){
    .card{grid-template-columns:1fr;max-width:560px;margin:0;}
    .hero{grid-template-columns:1fr;gap:20px;}
    .side{gap:14px;padding:0 4px;}
    body[data-card="cards"] .side{--r:28px;}
    body[data-card="cards"] .side-in{padding:12px 30px 32px;gap:12px;}
    .timeline li span{white-space:normal;}
    .side .act{display:none;}
    .incl-wrap{margin-top:0;}
    .card{border-radius:28px;}
    /* the first-fold block sits 72px higher than centre on phones */
    .intro{padding-bottom:168px;}
    /* the eyebrow: two lines, roomier */
    .chip{max-width:250px;text-align:center;justify-content:center;font-size:13px;letter-spacing:.12em;line-height:1.36;}
    .chip .line{display:inline;}
    /* a bigger headline */
    .quote{font-size:clamp(34px, 9.4cqw, 40px);letter-spacing:-.03em;line-height:.95;max-width:100%;}
    .sig{font-size:clamp(17px, 5.4cqw, 21px);}
    /* on phones the card's own button hides and a floating one takes over,
       anchored to the stage so it stays at the foot of the screen */
    .act{display:none;}
    .act-float{
      display:flex;justify-content:center;position:absolute;left:0;right:0;bottom:0;z-index:6;
      padding:18px 15% 30px;  /* the button fills 70% of the width */
      /* rises from below the screen once the card has landed and its content shown */
      opacity:0;transform:translateY(110%);
      transition:opacity .5s var(--ease-out) 1500ms, transform .75s var(--ease-out) 1500ms;
    }
    /* the bar's own layer, behind the button: the gradient and a progressive
       16px blur fading upward, so the button itself stays crisp */
    .act-float .bar-fade{
      position:absolute;inset:0;z-index:0;pointer-events:none;
      background:linear-gradient(180deg, rgba(14,12,11,0), rgba(14,12,11,.88) 45%);
      -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
      -webkit-mask:linear-gradient(0deg, #000 40%, transparent);mask:linear-gradient(0deg, #000 40%, transparent);
    }
    .act-float .pill{position:relative;z-index:1;}
    body[data-state="revealing"] .act-float,
    body[data-state="gift"] .act-float{opacity:1;transform:none;}
    body[data-state="returning"] .act-float{opacity:0;transform:translateY(110%);transition-delay:0s;transition-duration:.3s;}
    .act-float .pill{width:100%;color:var(--btn-d-ink);background:var(--btn-d);padding:16px 30px;font-size:16px;font-weight:500;}
    .gift{padding-bottom:120px;}

    /* the eyebrow's square sits centred above its two lines */
    .intro .chip{flex-direction:column;align-items:center;gap:10px;}
    .intro .chip::before{margin-top:0;}
    .back{top:12px;right:12px;}
    .logo{top:40px;}
    .logo svg{height:20px;}
    .back{top:14px;}
    .phone{width:min(34%, 150px);transform:translate(-50%,-42%) rotate(-14deg);}
    .card .info{padding:30px 30px 32px;min-height:0;}
    body[data-card="cards"] .card .info{padding-top:30px;padding-bottom:32px;}
    /* the eyebrow and the title stand outside the card, centred, with room

    .card-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 12px 64px;}

  setSig((params.get('sig') || '').toLowerCase());
  sigSel.addEventListener('change', function(){ setSig(sigSel.value); });

  /* ---------- panel tweak: the second card's colour and opacity ---------- */
  var panelColor = document.getElementById('panelColor'), panelAlpha = document.getElementById('panelAlpha'), panelBlur = document.getElementById('panelBlur');
  function setPanel(hex, a, bl){
    hex = String(hex || '').replace('#', '');
    if(!/^[0-9a-f]{6}$/i.test(hex)) hex = 'c5a496';   // warm sand by default
    a = parseInt(a, 10); if(isNaN(a)) a = 24; a = Math.max(0, Math.min(100, a));
    bl = parseInt(bl, 10); if(isNaN(bl)) bl = 120; bl = Math.max(0, Math.min(120, bl));
    var r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
    document.body.style.setProperty('--panel-bg', 'rgba(' + r + ',' + g + ',' + b + ',' + (a / 100) + ')');
    document.body.style.setProperty('--panel-filter', bl ? 'blur(' + bl + 'px)' : 'none');
    panelColor.value = '#' + hex.toLowerCase(); panelAlpha.value = a; panelBlur.value = bl;
  }
  function panelFromBar(){ setPanel(panelColor.value, panelAlpha.value, panelBlur.value); }
  setPanel(params.get('panel'), params.get('alpha'), params.get('blur'));
  panelColor.addEventListener('input', panelFromBar);
  panelAlpha.addEventListener('input', panelFromBar);
  panelBlur.addEventListener('input', panelFromBar);

  /* ---------- card tweak: the six rows, or three mini cards ---------- */
  var cardSel = document.getElementById('cardSel');
  function setCard(v){
    v = v === 'list' ? 'list' : 'cards';   // Cards by default
    document.body.dataset.card = v;
    cardSel.value = v;
    if(state === 'gift') panelSettled = true;
    syncSteps();
    requestAnimationFrame(panelSet);
    // the card changes height, so the seed behind it follows
    requestAnimationFrame(function(){ layoutScene(); if(state === 'gift') seedSet(cardRect()); });
  }
  setCard((params.get('card') || '').toLowerCase());
  cardSel.addEventListener('change', function(){ setCard(cardSel.value); });



  var motionSel = document.getElementById('motion');
  function setMotion(m){
    m = m === 'static' ? 'static' : 'dynamic';
    document.body.dataset.motion = m;
    motionSel.value = m;
    // switching motion always lands on the first fold: the reveal, if it had
    // run, is put back to its start so both folds are where the new mode expects
    if(state !== 'intro'){ setState('intro'); $('see').disabled = false; seedRest(); }
    document.getElementById('stage').scrollTop = 0;
    syncSteps();
    requestAnimationFrame(function(){ layoutScene(); placeSig(); panelSet(); });
  }
  setMotion((params.get('motion') || DEFAULT_MOTION || '').toLowerCase());
  motionSel.addEventListener('change', function(){ setMotion(motionSel.value); });

  // a small parallax on the static scroll: the fixed photograph drifts up at
  // 20% of the scroll (its layer is 22cqh taller at each end, so no edge shows)
  var stageEl = document.getElementById('stage'), parTick = false;
  function parallax(){
    parTick = false;
    if(!isStatic() || reduce){
      // the dynamic stage never scrolls: a focus() or scrollIntoView on something
      // below the fold could nudge it, so it is pinned back to the top
      if(!isStatic() && stageEl.scrollTop) stageEl.scrollTop = 0;
      stageEl.style.setProperty('--par', '0px'); return;
    }
    stageEl.style.setProperty('--par', (-stageEl.scrollTop * .2).toFixed(1) + 'px');
  }
  stageEl.addEventListener('scroll', function(){ if(!parTick){ parTick = true; requestAnimationFrame(parallax); } }, { passive: true });
  window.addEventListener('resize', parallax);
  parallax();
  $('back').addEventListener('click', goBack);

  /* ---------- scroll as a trigger ----------
     On the first fold, scrolling down (wheel, trackpad, swipe, keyboard) runs
     the same reveal as the button, once the message and button are on
     screen. At the top of the second fold, a firm scroll up runs the way back. */
  var intro = $('intro'), giftEl = $('gift');
  giftEl.addEventListener('scroll', function(){
    if(!isStatic() && state === 'gift') seedSet(cardRect());
    else if(!isStatic() && state === 'revealing' && seedAnim){ var t = seedAnim.currentTime || 0; seedMorph(cardRect(), Math.max(50, 1100 - t), 0); }
    panelSet();
  }, { passive: true });
  function ready(){ return !isStatic() && state === 'intro' && intro.classList.contains('cta-in'); }
  var wheelAcc = 0, wheelTimer = null;
  window.addEventListener('wheel', function(e){
    if(state === 'intro'){
      if(!ready()) return;
      wheelAcc += e.deltaY;
      clearTimeout(wheelTimer); wheelTimer = setTimeout(function(){ wheelAcc = 0; }, 300);
      if(wheelAcc > 40){ wheelAcc = 0; reveal(); }
    }else if(state === 'gift'){
      if(giftEl.scrollTop > 0) return;
      wheelAcc += e.deltaY;
      clearTimeout(wheelTimer); wheelTimer = setTimeout(function(){ wheelAcc = 0; }, 300);
      if(wheelAcc < -140){ wheelAcc = 0; goBack(); }
    }
  }, { passive: true });
  var touchY = null;
  window.addEventListener('touchstart', function(e){ touchY = e.touches[0].clientY; }, { passive: true });
  window.addEventListener('touchmove', function(e){
    if(touchY == null) return;
    var dy = touchY - e.touches[0].clientY; // finger up = scroll down
    if(state === 'intro' && ready() && dy > 48){ touchY = null; reveal(); }
    else if(state === 'gift' && giftEl.scrollTop <= 0 && dy < -90){ touchY = null; goBack(); }
  }, { passive: true });
  window.addEventListener('touchend', function(){ touchY = null; });
  window.addEventListener('keydown', function(e){
    if(e.defaultPrevented || e.target.tagName === 'SELECT') return;
    if(state === 'intro' && ready() && (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ')){ e.preventDefault(); reveal(); }
    else if(state === 'gift' && giftEl.scrollTop <= 0 && (e.key === 'ArrowUp' || e.key === 'PageUp')){ e.preventDefault(); goBack(); }
  });
})();
</script>
